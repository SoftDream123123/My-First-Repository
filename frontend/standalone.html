<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1280">
<title>面试助手 · HR 工作台</title>
<style>
/* ==========================================================================
   设计令牌 —— 「案卷」工作台
   --------------------------------------------------------------------------
   四条规则贯穿整个界面，其余一切服从它们：

   1. 深墨蓝的脊 + 纸白的工作区。脊管身份与导航，工作区管内容。
   2. 品牌靛蓝只用于「身份与操作」；分数色带只用于「评分」；灰阶用于
      一切结构。三者不混用 —— 蓝色出现的地方一定可以点，彩色出现的地方
      一定带信息。
   3. 面板是纸（白底 + 1px 边 + 8px 圆角，无投影）；只有真正浮起来的层
      （弹窗 / toast / 下拉）才有投影。这是对「SaaS 卡片套件」的回避。
   4. 数字用衬线、右对齐、tabular。报表里的数字要能列对齐 —— Cambria 的
      活字数字而不是 Georgia 的老式数字（3/4/7 下沉，读起来像手写）。
   ========================================================================== */

:root {
  /* ---- 脊：深墨蓝 ---- */
  --navy: #12283f;
  --navy-raise: #1c3a5c;
  --navy-line: #27456a;

  /* ---- 纸 ---- */
  --paper: #ffffff;
  --ground: #eff3f7;
  --line: #d6dfe9;
  --line-soft: #e8eef4;

  /* ---- 文字 ---- */
  --ink: #17222e;
  --ink-soft: #35434f;
  --muted: #61717f;
  --faint: #94a2b0;

  /* ---- 品牌靛蓝：身份与操作 ---- */
  --brand: #1f4e8c;
  --brand-deep: #173c6e;
  --brand-lift: #5b93d6;      /* 深底上用的品牌色（脊内） */
  --brand-wash: #eaf1f9;
  --brand-line: #c0d5ec;

  /* ---- 分数带：阈值 6.5 取自产品自身对 strengths 的定义 ---- */
  --pass: #0d6e52;
  --pass-wash: #e4f1eb;
  --watch: #9c6410;
  --watch-wash: #f8eedc;

  /* ---- 破坏性操作 ---- */
  --danger: #a32b1b;
  --danger-wash: #fbeae6;
  --danger-line: #efc9c2;

  /* ---- 字体 ---- */
  /* 离线环境，无外网字体可用。拉丁走 Segoe UI，中文回落到雅黑。 */
  --font-ui: "Segoe UI", "Microsoft YaHei UI", "Microsoft YaHei",
             -apple-system, "PingFang SC", "Hiragino Sans GB", sans-serif;
  /* 只用于数字。Cambria 是 Windows 自带的「文书衬线」，活字数字、
     笔画敦实 —— 报表里的数字该是这个样子。 */
  --font-num: Cambria, Georgia, "Times New Roman", "SimSun", serif;

  /* ---- 字号（1.25 比例，中文基准 15px） ---- */
  --t-xs: 12px;
  --t-sm: 13px;
  --t-base: 15px;
  --t-md: 16px;
  --t-lg: 18px;
  --t-xl: 22px;
  --t-2xl: 28px;
  --t-hero: 56px;

  /* ---- 间距 ---- */
  --s1: 4px;
  --s2: 8px;
  --s3: 12px;
  --s4: 16px;
  --s5: 20px;
  --s6: 24px;
  --s7: 32px;
  --s8: 40px;
  --s9: 56px;

  /* ---- 圆角：按层级区分，不是所有东西同一个值 ---- */
  --r-control: 4px;   /* 按钮、输入、标签 */
  --r-surface: 8px;   /* 面板、弹窗 */

  /* ---- 投影：只给浮层 ---- */
  --shadow-float: 0 12px 32px rgba(18, 40, 63, 0.16),
                  0 2px 6px rgba(18, 40, 63, 0.07);

  /* ---- 布局 ---- */
  --spine-w: 240px;
  --topbar-h: 56px;
  --measure: 34em;    /* 正文行长上限，中文约 34 字 */
}

/* ==========================================================================
   基础层
   ========================================================================== */

*, *::before, *::after { box-sizing: border-box; }

/* 显式接管 [hidden]：组件层里 display:grid / flex 的规则与它同优先级，
   靠声明顺序决胜太脆 —— 一处顺序调整就会让「隐藏」失效。 */
[hidden] { display: none !important; }

body {
  margin: 0;
  /* 仅 PC（PRD §2）。低于 1280 时横向滚动，不做响应式折叠。 */
  min-width: 1280px;
  font-family: var(--font-ui);
  font-size: var(--t-base);
  line-height: 1.6;
  color: var(--ink);
  background: var(--ground);
}

h1, h2, h3, h4 { margin: 0; font-weight: 700; line-height: 1.35; }
h1 { font-size: var(--t-2xl); letter-spacing: -0.01em; }
h2 { font-size: var(--t-xl); letter-spacing: -0.01em; }
h3 { font-size: var(--t-lg); }
h4 { font-size: var(--t-md); }
p  { margin: 0; }
ol, ul { margin: 0; padding: 0; list-style: none; }

a { color: var(--brand); text-decoration: none; }
a:hover { text-decoration: underline; }

/* 键盘可见焦点 —— 不是可选项 */
:focus-visible {
  outline: 2px solid var(--brand);
  outline-offset: 2px;
  border-radius: var(--r-control);
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: 0.01ms !important;
    transition-duration: 0.01ms !important;
  }
}

/* 数字：衬线 + 表格数字（列对齐） */
.num {
  font-family: var(--font-num);
  font-variant-numeric: lining-nums tabular-nums;
  letter-spacing: 0.01em;
}

.meta { font-size: var(--t-sm); color: var(--muted); }
.hint { font-size: var(--t-sm); color: var(--muted); }
.prose { line-height: 1.75; max-width: var(--measure); }

/* 页面标题区 */
.page-head {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: var(--s6);
  margin-bottom: var(--s6);
}
.page-lede {
  margin-top: var(--s2);
  font-size: 14px;
  color: var(--muted);
  max-width: 62em;
}
.page-head-actions { display: flex; gap: var(--s2); flex: none; padding-top: var(--s1); }

/* ==========================================================================
   组件层
   ========================================================================== */

/* ---- 外壳：脊 + 工作区 ---- */
.shell {
  display: grid;
  grid-template-columns: var(--spine-w) 1fr;
  min-height: 100vh;
}

.spine {
  display: flex;
  flex-direction: column;
  background: var(--navy);
  color: rgba(255, 255, 255, 0.78);
}

.spine-head {
  padding: var(--s5) var(--s5) var(--s5);
  border-bottom: 1px solid var(--navy-line);
}
.spine-mark {
  font-size: var(--t-lg);
  font-weight: 700;
  color: #fff;
  letter-spacing: 0.01em;
}
.spine-sub {
  margin-top: 2px;
  font-size: var(--t-xs);
  color: rgba(255, 255, 255, 0.5);
  letter-spacing: 0.06em;
}

.spine-nav { flex: 1; padding: var(--s4) 0; }
.nav-item {
  display: flex;
  align-items: center;
  gap: var(--s3);
  height: 38px;
  padding: 0 var(--s5);
  border-left: 3px solid transparent;
  font-size: 14px;
  color: rgba(255, 255, 255, 0.74);
}
.nav-item:hover {
  background: rgba(255, 255, 255, 0.05);
  color: #fff;
  text-decoration: none;
}
.nav-item.is-active {
  background: rgba(255, 255, 255, 0.08);
  border-left-color: var(--brand-lift);
  color: #fff;
  font-weight: 600;
}

.spine-foot {
  padding: var(--s4) var(--s5) var(--s5);
  border-top: 1px solid var(--navy-line);
}
.spine-user {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: var(--s2);
  margin-bottom: var(--s3);
}
.spine-username { font-size: 14px; color: #fff; }
.spine-role { font-size: var(--t-xs); color: rgba(255, 255, 255, 0.5); }

.workspace { display: flex; flex-direction: column; min-width: 0; }

.topbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: var(--s4);
  height: var(--topbar-h);
  padding: 0 var(--s7);
  background: var(--paper);
  border-bottom: 1px solid var(--line);
  flex: none;
}
.topbar-context { display: flex; align-items: baseline; gap: var(--s3); min-width: 0; }
.topbar-title { font-size: 14px; font-weight: 600; color: var(--ink); }

.main {
  flex: 1;
  padding: var(--s7) var(--s7) var(--s9);
  max-width: 1240px;
  width: 100%;
}

/* ---- 面板：内容块是纸，不是卡片 ---- */
.panel {
  background: var(--paper);
  border: 1px solid var(--line);
  border-radius: var(--r-surface);
}
.panel + .panel { margin-top: var(--s5); }
.panel-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: var(--s4);
  padding: var(--s4) var(--s5);
  border-bottom: 1px solid var(--line-soft);
}
.panel-title { font-size: var(--t-base); font-weight: 600; color: var(--ink); }
.panel-note { font-size: var(--t-sm); color: var(--muted); }
.panel-body { padding: var(--s5); }
.panel-body--flush { padding: 0; }
.panel-foot {
  padding: var(--s4) var(--s5);
  border-top: 1px solid var(--line-soft);
  display: flex;
  justify-content: flex-end;
  gap: var(--s2);
}

/* ---- 表格 ---- */
.table { width: 100%; border-collapse: collapse; }
.table th {
  padding: var(--s3) var(--s5);
  text-align: left;
  font-size: var(--t-sm);
  font-weight: 600;
  color: var(--ink-soft);
  background: #f7fafc;
  border-bottom: 1px solid var(--line);
  white-space: nowrap;
}
.table td {
  padding: var(--s3) var(--s5);
  border-bottom: 1px solid var(--line-soft);
  vertical-align: middle;
}
.table tbody tr:last-child td { border-bottom: none; }
.table tbody tr:hover { background: #f9fbfd; }
.table .cell-num {
  text-align: right;
  font-family: var(--font-num);
  font-variant-numeric: lining-nums tabular-nums;
}
.table .cell-actions {
  display: flex;
  gap: var(--s1);
  justify-content: flex-end;
  white-space: nowrap;
}
.table strong { font-weight: 600; }

/* ---- 按钮 ---- */
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: var(--s2);
  height: 36px;
  padding: 0 var(--s4);
  border: 1px solid transparent;
  border-radius: var(--r-control);
  font-family: inherit;
  font-size: 14px;
  font-weight: 600;
  line-height: 1;
  cursor: pointer;
  white-space: nowrap;
  transition: background-color 0.12s ease, border-color 0.12s ease;
}
.btn:disabled { cursor: not-allowed; opacity: 0.5; }

.btn--primary { background: var(--brand); color: #fff; }
.btn--primary:hover:not(:disabled) { background: var(--brand-deep); }

.btn--ghost {
  background: var(--paper);
  border-color: var(--line);
  color: var(--ink);
}
.btn--ghost:hover:not(:disabled) { background: #f4f7fa; }

.btn--danger { background: var(--danger); color: #fff; }
.btn--danger:hover:not(:disabled) { background: #8c2416; }

.btn--quiet {
  background: none;
  border-color: transparent;
  color: var(--muted);
  font-weight: 400;
}
.btn--quiet:hover:not(:disabled) { background: #eef2f6; color: var(--ink); }

.btn--wide { width: 100%; }
.btn--sm { height: 30px; padding: 0 var(--s3); font-size: var(--t-sm); }

/* 脊内专用的静音按钮（深底上的次要操作） */
.btn--onspine {
  background: none;
  border-color: var(--navy-line);
  color: rgba(255, 255, 255, 0.72);
  font-weight: 400;
  height: 30px;
  font-size: var(--t-sm);
}
.btn--onspine:hover:not(:disabled) {
  background: var(--navy-raise);
  color: #fff;
}

/* ---- 表单 ---- */
.field { margin-bottom: var(--s5); }
.field-label {
  display: block;
  margin-bottom: var(--s2);
  font-size: var(--t-sm);
  font-weight: 600;
  color: var(--ink-soft);
}
.field-note {
  margin-top: var(--s2);
  font-size: var(--t-xs);
  color: var(--faint);
}
.field-error {
  margin-top: var(--s2);
  font-size: var(--t-xs);
  color: var(--danger);
}

.input, .select, .textarea {
  width: 100%;
  padding: 0 var(--s3);
  height: 36px;
  font-family: inherit;
  font-size: 14px;
  color: var(--ink);
  background: var(--paper);
  border: 1px solid var(--line);
  border-radius: var(--r-control);
}
.textarea { height: auto; padding: var(--s3); line-height: 1.7; resize: vertical; }
.input::placeholder, .textarea::placeholder { color: var(--faint); }
.input:focus, .select:focus, .textarea:focus {
  outline: none;
  border-color: var(--brand);
  box-shadow: 0 0 0 3px var(--brand-wash);
}
.input:disabled, .select:disabled, .textarea:disabled {
  background: #f4f7fa;
  color: var(--muted);
}
.select { cursor: pointer; }

/* ---- 标签 ---- */
.tag {
  display: inline-flex;
  align-items: center;
  height: 22px;
  padding: 0 var(--s2);
  border: 1px solid transparent;
  border-radius: var(--r-control);
  font-size: var(--t-xs);
  font-weight: 600;
  line-height: 1;
  white-space: nowrap;
}
.tag--draft      { background: #eef2f6; border-color: #dde5ec; color: var(--muted); }
.tag--ongoing    { background: var(--brand-wash); border-color: var(--brand-line); color: var(--brand-deep); }
.tag--completed  { background: #eef2f6; border-color: #dde5ec; color: var(--ink-soft); }
.tag--evaluating { background: var(--watch-wash); border-color: #eadcbe; color: var(--watch); }
.tag--evaluated  { background: var(--pass-wash); border-color: #c6e0d5; color: var(--pass); }
.tag--dim        { background: #f2f6fa; border-color: #e0e8f0; color: var(--ink-soft); }
.tag--off        { background: #eef2f6; border-color: #dde5ec; color: var(--muted); }

.mine-badge { margin-left: var(--s1); font-size: var(--t-xs); color: var(--faint); }

/* ---- 列表 + 案卷：左列选条目，右列看全文 ----
   岗位和面试详情共用这套。JD 与评估维度是成段的内容，塞进表格单元格
   只能靠截断和展开行，两者都不是好读法。 */
.split {
  display: grid;
  grid-template-columns: 300px 1fr;
  gap: var(--s5);
  align-items: start;
}
.split-list {
  background: var(--paper);
  border: 1px solid var(--line);
  border-radius: var(--r-surface);
  overflow: hidden;
}
.split-list-head { padding: var(--s3); border-bottom: 1px solid var(--line-soft); }
.split-list-head .input { height: 32px; }
.split-list-body { max-height: 62vh; overflow-y: auto; }

.split-item {
  display: block;
  width: 100%;
  padding: var(--s3) var(--s4);
  border: none;
  border-left: 3px solid transparent;
  border-bottom: 1px solid var(--line-soft);
  background: none;
  font: inherit;
  text-align: left;
  color: var(--ink);
  cursor: pointer;
}
.split-item:last-child { border-bottom: none; }
.split-item:hover { background: #f7fafc; }
.split-item.is-active { background: var(--brand-wash); border-left-color: var(--brand); }
.split-item-name { font-size: 14px; font-weight: 600; }
.split-item-meta { margin-top: 2px; font-size: var(--t-xs); color: var(--muted); }

.dossier-head {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: var(--s5);
  padding: var(--s5);
  border-bottom: 1px solid var(--line-soft);
}
.dossier-title { font-size: var(--t-xl); font-weight: 700; letter-spacing: -0.01em; }
/* 题干是长句子，不用 22px 粗体 —— 段落级的粗体读起来太压 */
.dossier-question { font-size: 17px; font-weight: 600; line-height: 1.65; max-width: 46em; }
.dossier-meta {
  display: flex;
  align-items: center;
  gap: var(--s3);
  margin-top: var(--s2);
  font-size: var(--t-sm);
  color: var(--muted);
}
.dossier-actions { display: flex; gap: var(--s2); flex: none; }
.dossier-section { padding: var(--s5); }
.dossier-section + .dossier-section { border-top: 1px solid var(--line-soft); }
.dossier-label {
  margin-bottom: var(--s3);
  font-size: var(--t-sm);
  font-weight: 600;
  color: var(--ink-soft);
}
.dossier-text {
  font-size: 14px;
  line-height: 1.8;
  white-space: pre-wrap;
  max-width: 44em;
}
.tag-row { display: flex; flex-wrap: wrap; gap: var(--s2); }

/* ---- 维度编辑器 ---- */
.dim-editor-row {
  display: flex;
  align-items: center;
  gap: var(--s2);
  margin-bottom: var(--s2);
}
.dim-editor-remove {
  flex: none;
  width: 32px;
  height: 32px;
  padding: 0;
  font-size: var(--t-lg);
  line-height: 1;
  color: var(--faint);
}
.dim-editor-remove:hover:not(:disabled) { color: var(--danger); background: var(--danger-wash); }

/* ---- 筛选栏 ---- */
.filterbar {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: var(--s2);
  padding: var(--s3) var(--s5);
  border-bottom: 1px solid var(--line-soft);
  background: #fafcfe;
}
.filterbar .input,
.filterbar .select {
  width: auto;
  min-width: 116px;
  height: 32px;
  font-size: var(--t-sm);
}
.filterbar-grow { flex: 1; }
.filterbar-count { margin-left: auto; font-size: var(--t-sm); color: var(--muted); }

/* ---- 列表更宽的变体（题库的题干较长，左列放不下 300px） ---- */
.split--wide { grid-template-columns: 384px 1fr; }
.split-item-text {
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
  font-size: 14px;
  line-height: 1.6;
  color: var(--ink);
}
.split-item-tags {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: var(--s1);
  margin-top: var(--s2);
}
.split-item-pos { margin-left: var(--s1); font-size: var(--t-xs); color: var(--muted); }

/* ---- 单选题的选项（只读视图：标出参考答案是哪一项） ---- */
.option-list {
  border: 1px solid var(--line-soft);
  border-radius: var(--r-control);
  overflow: hidden;
}
.option-item {
  display: flex;
  align-items: flex-start;
  gap: var(--s3);
  padding: var(--s3) var(--s4);
  font-size: 14px;
  line-height: 1.6;
  border-top: 1px solid var(--line-soft);
}
.option-item:first-child { border-top: none; }
.option-key {
  flex: none;
  width: 18px;
  font-family: var(--font-num);
  font-variant-numeric: lining-nums tabular-nums;
  color: var(--faint);
}
.option-item.is-correct { background: var(--brand-wash); }
.option-item.is-correct .option-key { color: var(--brand); }
.option-flag {
  flex: none;
  margin-left: auto;
  font-size: var(--t-xs);
  font-weight: 600;
  color: var(--brand-deep);
}

/* ---- 选项编辑器 ---- */
.choice-row {
  display: flex;
  align-items: center;
  gap: var(--s2);
  margin-bottom: var(--s2);
}
.choice-key {
  flex: none;
  width: 18px;
  font-family: var(--font-num);
  font-variant-numeric: lining-nums tabular-nums;
  font-size: var(--t-sm);
  color: var(--faint);
}

/* ---- 分段控件（题型这种二选一、且会改变表单结构的选择） ---- */
.seg {
  display: inline-flex;
  border: 1px solid var(--line);
  border-radius: var(--r-control);
  overflow: hidden;
}
.seg-btn {
  height: 34px;
  padding: 0 var(--s4);
  border: none;
  background: var(--paper);
  font-family: inherit;
  font-size: 14px;
  color: var(--ink-soft);
  cursor: pointer;
}
.seg-btn + .seg-btn { border-left: 1px solid var(--line); }
.seg-btn:hover:not(:disabled) { background: #f4f7fa; }
.seg-btn.is-on { background: var(--brand); color: #fff; font-weight: 600; }
.seg-btn:disabled { cursor: not-allowed; opacity: 0.5; }

/* ---- 弹窗里的两列表单 ---- */
.form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0 var(--s4); }
.form-grid .field { min-width: 0; }
.form-grid-3 { grid-template-columns: 1fr 1fr 1fr; }
.form-grid-full { grid-column: 1 / -1; }

.meta-row {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: var(--s2);
  margin-top: var(--s3);

  const seq = { user: 5, position: 5, question: 11 };
  const sessions = new Map(); // token → user id

  /* ---- 响应助手 ---- */
  const ok = (body) => ({ status: 200, body });
  const created = (body) => ({ status: 201, body });
  const fail = (status, code, message, detail) => ({ status, body: { code, message, detail: detail ?? null } });

  function publicUser(user) {
    if (!user) return null;
    const { password, ...rest } = user;
    return rest;
  }

  function requireAdmin(user) {
    if (!user || user.role !== 'admin') return fail(403, 'FORBIDDEN', '无权限执行此操作');
    return null;
  }

  /* ---- 路由表 ---- */
  const routes = [];
  function on(method, pattern, handler) {
    routes.push({ method, parts: pattern.split('/').filter(Boolean), handler });
  }
  function match(method, path) {
    const parts = path.split('/').filter(Boolean);
    for (const route of routes) {
      if (route.method !== method || route.parts.length !== parts.length) continue;
      const params = {};
      let matched = true;
      for (let i = 0; i < parts.length; i += 1) {
        if (route.parts[i].startsWith(':')) params[route.parts[i].slice(1)] = decodeURIComponent(parts[i]);
        else if (route.parts[i] !== parts[i]) { matched = false; break; }
      }
      if (matched) return { handler: route.handler, params };
    }
    return null;
  }

  /* ---- auth ---- */
  on('POST', '/auth/login', ({ body }) => {
    const user = state.users.find((u) => u.username === body?.username && u.password === body?.password);
    if (!user || !user.is_active) if (!user) return fail(401, 'UNAUTHORIZED', '用户名或密码错误');
    if (!user.is_active) return fail(401, 'UNAUTHORIZED', '账号已禁用，请联系管理员');
    const token = `mock.${user.id}.${Date.now().toString(36)}`;
    sessions.set(token, user.id);
    return ok({ token, user: publicUser(user) });
  });

  on('GET', '/auth/me', ({ user }) => {
    const denied = requireLogin(user);
    return denied || ok(publicUser(user));

  function requireLogin(user) {
    return user ? null : fail(401, 'INVALID_TOKEN', '登录状态已失效，请重新登录');
  }

  /* ---- users ---- */
  on('GET', '/users', ({ user }) => requireAdmin(user) || ok(state.users.map(publicUser)));

  on('POST', '/users', ({ user, body }) => {
    const denied = requireAdmin(user);
    if (denied) return denied;

    const username = String(body?.username ?? '').trim();
    const fields = [];
    if (!username) fields.push({ field: 'username', message: '请填写用户名' });
    if (!body?.password || body.password.length < 8 || body.password.length > 128) {
      fields.push({ field: 'password', message: '密码长度需在 8–128 位之间' });
    }

      id: seq.user++,

      password: body.password,

    else if (jd.length > 10000) fields.push({ field: 'jd', message: '岗位描述不能超过 10000 个字符' });

    if (!Array.isArray(dims) || !dims.length) {
      fields.push({ field: 'evaluation_dimensions', message: '至少需要 1 个评估维度' });
    } else if (dims.some((d) => !String(d).trim())) {
      fields.push({ field: 'evaluation_dimensions', message: '评估维度不能为空' });
    } else if (dims.length > 10) {
      fields.push({ field: 'evaluation_dimensions', message: '评估维度不能超过 10 个' });

    return fields;

  on('GET', '/positions', ({ user }) => {

    if (denied) return denied;

    const name = body.name.trim();
    // 同名校验按 owner 划范围（后端 get_by_owner_and_name），不是全库唯一
    if (state.positions.some((p) => p.created_by === user.id && p.name === name)) {

    const row = {
      id: seq.position++,

  on('PUT', '/positions/:id', ({ user, body, params }) => {
    const denied = requireLogin(user);
    if (denied) return denied;

    const located = locatePosition(user, params.id);
    if (located.error) return located.error;

    const fields = validatePosition(body);
    if (fields.length) return fail(400, 'VALIDATION_ERROR', '请求参数不合法', { fields });

    const name = body.name.trim();
    if (state.positions.some((p) => p.created_by === user.id && p.name === name && p.id !== located.row.id)) {
      return fail(409, 'BUSINESS_ERROR', '该岗位名称已存在');

    located.row.name = name;

  on('DELETE', '/positions/:id', ({ user, params }) => {

    // questions / interviews 由后面的模块补上；引用校验在那之后才真正起作用
    const usedByQuestion = (state.questions || []).some((q) => q.position_id === located.row.id);
    const usedByInterview = (state.interviews || []).some((i) => i.position_id === located.row.id);
    if (usedByQuestion || usedByInterview) {
      return fail(409, 'BUSINESS_ERROR', '该岗位已被题库或面试引用，无法删除');

  /* ---- questions ---- */

  const MIN_CHOICE_OPTIONS = 2;
  const MAX_CHOICE_OPTIONS = 10;
  const MAX_OPTION_LENGTH = 200;
  const MAX_TAGS = 10;
  const MAX_TAG_LENGTH = 20;

  function visibleQuestions(user) {
    return user.role === 'admin'
      ? state.questions
      : state.questions.filter((q) => q.created_by === user.id);
  }

  function locateQuestion(user, id) {
    const row = state.questions.find((q) => q.id === Number(id));
    if (!row) return { error: fail(404, 'NOT_FOUND', '题目不存在') };
    if (user.role !== 'admin' && row.created_by !== user.id) {
      return { error: fail(403, 'FORBIDDEN', '无权限访问该题目') };
    }
    return { row };
  }

  /**
   * 按题型校验选项与参考答案（对应后端 service._normalize_choice_fields）。
   * 这些是跨字段规则：文案随题型不同，而且**不带 detail.fields** ——
   * 所以前端会走通用 toast，而不是落到某个字段下方。两条路径都要如实照搬。
   */
  function normalizeChoiceFields(questionType, rawOptions, rawAnswer) {
    const cleaned = (rawOptions || []).map((o) => String(o).trim());
    for (const item of cleaned) {
      if (!item) return { error: '选项不能为空' };
      if (item.length > MAX_OPTION_LENGTH) return { error: `单个选项不能超过 ${MAX_OPTION_LENGTH} 个字符` };
    }
    if (new Set(cleaned).size !== cleaned.length) return { error: '选项不能重复' };

    const answer = typeof rawAnswer === 'string' && rawAnswer.trim() ? rawAnswer.trim() : null;

    if (questionType === 'single_choice') {
      if (cleaned.length < MIN_CHOICE_OPTIONS) return { error: `单选题至少需要 ${MIN_CHOICE_OPTIONS} 个选项` };
      if (cleaned.length > MAX_CHOICE_OPTIONS) return { error: `单选题最多 ${MAX_CHOICE_OPTIONS} 个选项` };
      if (answer === null) return { error: '单选题必须提供参考答案' };
      if (!cleaned.includes(answer)) {
        return { error: '参考答案必须是选项之一', detail: { options: cleaned } };
      }
      return { options: cleaned, reference_answer: answer };
    }

    if (cleaned.length) return { error: '简答题不应包含选项' };
    return { options: [], reference_answer: answer };
  }

  /** 基础字段 → 岗位归属 → 维度归属 → 题型规则。顺序与后端一致。 */
  function buildQuestionFields(user, body, existing) {
    const fields = [];
    const content = String(body?.content ?? '').trim();
    if (content.length < 5 || content.length > 2000) {
      fields.push({ field: 'content', message: '题干长度需在 5–2000 字之间' });
    }
    const category = String(body?.category ?? '').trim();
    if (category.length > 50) fields.push({ field: 'category', message: '分类不能超过 50 个字符' });

    const tags = [];
    if (Array.isArray(body?.tags)) {
      for (const raw of body.tags) {
        const item = String(raw).trim();
        if (!item) { fields.push({ field: 'tags', message: '标签不能为空' }); break; }
        if (item.length > MAX_TAG_LENGTH) {
          fields.push({ field: 'tags', message: `单个标签不能超过 ${MAX_TAG_LENGTH} 个字符` });
          break;
        }
        if (!tags.includes(item)) tags.push(item);
      }
      if (tags.length > MAX_TAGS) fields.push({ field: 'tags', message: `标签不能超过 ${MAX_TAGS} 个` });
    }
    if (fields.length) return { fields };

    const position = state.positions.find((p) => p.id === Number(body?.position_id));
    if (!position) return { error: fail(404, 'NOT_FOUND', '岗位不存在') };
    if (user.role !== 'admin' && position.created_by !== user.id) {
      return { error: fail(403, 'FORBIDDEN', '无权限访问该岗位') };
    }

    const dimension = String(body?.dimension ?? '').trim();
    if (!position.evaluation_dimensions.includes(dimension)) {
      return {
        error: fail(400, 'VALIDATION_ERROR', '该维度不属于岗位的评估维度', {
          dimension,
          allowed: position.evaluation_dimensions,
        }),
      };
    }

    const questionType = body?.question_type || (existing ? existing.question_type : 'short_answer');
    const choice = normalizeChoiceFields(questionType, body?.options, body?.reference_answer);
    if (choice.error) return { error: fail(400, 'VALIDATION_ERROR', choice.error, choice.detail ?? null) };

    const explanation = String(body?.explanation ?? '').trim();
    if (explanation.length > 2000) {
      return { error: fail(400, 'VALIDATION_ERROR', '解析不能超过 2000 个字符') };
    }

    return {
      values: {
        position_id: position.id,
        dimension,
        category: category || '通用',
        content,
        difficulty: ['easy', 'medium', 'hard'].includes(body?.difficulty) ? body.difficulty : 'medium',
        tags,
        question_type: questionType,
        options: choice.options,
        reference_answer: choice.reference_answer,
        explanation: explanation || null,
      },
    };
  }

  /** Mock 的「AI 生成参考答案」——确定性输出，无 Key 也能演示与复现。 */
  function mockReferenceAnswer(question) {
    if (question.question_type === 'single_choice') {
      return {
        reference_answer: (question.options || [])[0] || '（未能生成）',

      explanation: '追问方向：如果条件反过来会怎样？有没有反例？你会怎么验证自己的结论？',
    };
  }

  on('GET', '/questions', ({ user, query }) => {

    if (built.error) return built.error;

  on('GET', '/questions/:id', ({ user, params }) => {

  on('PUT', '/questions/:id', ({ user, body, params }) => {
    const denied = requireLogin(user);
    if (denied) return denied;

    const denied = requireLogin(user);

    if (used) return fail(409, 'BUSINESS_ERROR', '该题目已被面试引用，无法删除');

      return fail(409, 'BUSINESS_ERROR', 'AI 生成的答案不在选项中，请手工确认', {
        generated: generated.reference_answer,

    located.row.reference_answer = generated.reference_answer;
    located.row.explanation = generated.explanation;
    return ok(located.row);
  });

  /* ---- fetch 拦截 ---- */
  const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));

  function toResponse(result) {
    if (result.status === 204) return new Response(null, { status: 204 });
    return new Response(JSON.stringify(result.body), {
      status: result.status,
      headers: { 'Content-Type': 'application/json' },
    });
  }

  async function handler(input, init) {
    const url = typeof input === 'string' ? input : input.url;
    const options = init || {};
    const method = String(options.method || 'GET').toUpperCase();

    // 路径与查询串要分开：match() 按 '/' 切段，带着 ?a=1 会把最后一段切碎
    const raw = url.replace(/^\/api/, '');
    const mark = raw.indexOf('?');
    const path = mark >= 0 ? raw.slice(0, mark) : raw;
    const query = Object.fromEntries(new URLSearchParams(mark >= 0 ? raw.slice(mark + 1) : ''));

    const headers = options.headers || {};
    const token = String(headers.Authorization || headers.authorization || '').replace(/^Bearer\s+/, '');

    // 响应得有真实感：太快的话加载态一闪而过，看不出设计

  function parseTags(raw) {
    return raw.split(/[、,，]/).map((tag) => tag.trim()).filter(Boolean);
  }

  /** 选项的显示记号 A / B / C…（答案文本本身不含字母，这里只做索引） */
  function letter(index) { return String.fromCharCode(65 + index); }

  /* --------------------------- 选项编辑器 --------------------------- */
  /**
   * 参考答案在编辑期用**选项下标**表示，而不是选项文本。
   * 用文本的话，用户改一个错别字就会让已选中的答案悄无声息地失效。
   */
  function buildChoiceEditor(initialOptions, initialAnswer) {
    const options = [...initialOptions];
    let answerIndex = initialOptions.indexOf(initialAnswer);
    if (answerIndex < 0) answerIndex = null;

    const list = el('div', {});
    const errorNode = el('p', { class: 'field-error', hidden: true });
    const answerSelect = el('select', {
      class: 'select',
      id: 'question-answer',
      onChange: (event) => { answerIndex = event.target.value === '' ? null : Number(event.target.value); },
    });

    function repaintList() {
      clear(list);
      options.forEach((text, index) => {
        list.append(
          el('div', { class: 'choice-row' },
            el('span', { class: 'choice-key', text: letter(index) }),
            el('input', {
              class: 'input',
              value: text,
              maxlength: String(MAX_OPTION_LENGTH),
              'aria-label': `选项 ${letter(index)}`,
              onInput: (event) => {
                options[index] = event.target.value;
                // 只改下拉里那一项的文字，不重建 —— 重建会把已选中的答案冲掉
                const node = answerSelect.options[index + 1]; // 0 号是「请选择」
                if (node) node.textContent = options[index] || `选项 ${letter(index)}`;
              },
            }),
            el('button', {
              class: 'btn btn--quiet dim-editor-remove',
              type: 'button',
              text: '×',
              title: '删除这一项',
              'aria-label': `删除选项 ${letter(index)}`,
              onClick: () => {
                options.splice(index, 1);
                if (answerIndex === index) answerIndex = null;
                else if (answerIndex !== null && answerIndex > index) answerIndex -= 1;
                repaint();
              },
            }),
          ),
        );
      });
    }

    function repaintAnswer() {
      if (answerIndex !== null && answerIndex >= options.length) answerIndex = null;
      clear(answerSelect);
      answerSelect.append(el('option', { value: '', text: '请选择' }));
      options.forEach((text, index) => {
        answerSelect.append(el('option', { value: String(index), text: text || `选项 ${letter(index)}` }));
      });
      answerSelect.value = answerIndex === null ? '' : String(answerIndex);
    }

    function repaint() { repaintList(); repaintAnswer(); }
    repaint();

    const addButton = el('button', {
      class: 'btn btn--ghost btn--sm',
      type: 'button',
      text: '添加选项',
      onClick: () => {
        if (options.length >= MAX_OPTIONS) { toast.error(`最多 ${MAX_OPTIONS} 个选项`); return; }
        options.push('');
        repaint();
        list.querySelector('.choice-row:last-child .input')?.focus();
      },
    });

    return {
      node: el('div', {}, list, el('div', { style: 'margin-top:8px' }, addButton), errorNode),
      errorNode,
      answerSelect,
      /** 由「AI 生成参考答案」写回时用 —— 传进来的是选项文本。 */
      setAnswer(text) {
        answerIndex = options.indexOf(text);
        if (answerIndex < 0) answerIndex = null;
        repaintAnswer();
      },
      /** 校验通过返回 { options, reference_answer }，否则显示错误并返回 null。 */
      read() {
        const cleaned = options.map((o) => o.trim());
        let error = null;
        if (cleaned.length < MIN_OPTIONS) error = `单选题至少需要 ${MIN_OPTIONS} 个选项`;
        else if (cleaned.length > MAX_OPTIONS) error = `单选题最多 ${MAX_OPTIONS} 个选项`;
        else if (cleaned.some((o) => !o)) error = '选项不能为空';
        else if (cleaned.some((o) => o.length > MAX_OPTION_LENGTH)) error = `单个选项不能超过 ${MAX_OPTION_LENGTH} 个字符`;
        else if (new Set(cleaned).size !== cleaned.length) error = '选项不能重复';
        else if (answerIndex === null) error = '单选题必须提供参考答案';

        if (error) { errorNode.textContent = error; errorNode.hidden = false; return null; }
        errorNode.hidden = true;
        return { options: cleaned, reference_answer: cleaned[answerIndex] };
      },
    };
  }

  /* ------------------------------ 表单弹窗 ------------------------------ */

  function openQuestionModal(positions, question, onSaved) {
    const isEdit = Boolean(question);
    const isChoice = question ? question.question_type === 'single_choice' : true;

    const positionSelect = el(
      'select',
      { class: 'select', id: 'question-position' },
      positions.map((p) => el('option', { value: String(p.id), text: p.name })),
    );
    if (question) positionSelect.value = String(question.position_id);

    // 维度随岗位联动为下拉 —— 候选值就是该岗位的评估维度，否则提交必然被拒绝
    const dimensionSelect = el('select', { class: 'select', id: 'question-dimension' });

    function syncDimensions() {
      const position = positions.find((p) => p.id === Number(positionSelect.value));
      clear(dimensionSelect);
      if (!position) {
        dimensionSelect.append(el('option', { value: '', text: '请先选择岗位' }));
        dimensionSelect.disabled = true;
        return;
      }
      dimensionSelect.disabled = false;
      position.evaluation_dimensions.forEach((dimension) => {
        dimensionSelect.append(el('option', { value: dimension, text: dimension }));
      });
      if (question && position.id === question.position_id) dimensionSelect.value = question.dimension;
    }
    positionSelect.addEventListener('change', syncDimensions);

    const contentInput = el('textarea', {
      class: 'textarea', id: 'question-content', rows: '4', maxlength: '2000',
      value: question?.content ?? '',
      placeholder: '写具体一点。好的面试题通常指向一个真实场景，而不是让人背诵定义。',
    });
    const contentError = fieldError();

    const choiceEditor = buildChoiceEditor(question?.options ?? ['', ''], question?.reference_answer ?? null);

    const shortAnswerInput = el('textarea', {
      class: 'textarea', id: 'question-reference', rows: '3', maxlength: '2000',
      value: isChoice ? '' : (question?.reference_answer ?? ''),
      placeholder: '可选。留空表示还没有标准答案，之后可以用 AI 生成再改。',
    });

    const explanationInput = el('textarea', {
      class: 'textarea', id: 'question-explanation', rows: '3', maxlength: '2000',
      value: question?.explanation ?? '',
      placeholder: '可选。写清这道题在考什么、可追问哪些方向，评估时也用得上。',
    });

    const categoryInput = el('input', {
      class: 'input', id: 'question-category', maxlength: '50', value: question?.category ?? '通用',
    });
    const categoryError = fieldError();

    const difficultySelect = el(
      'select',
      { class: 'select', id: 'question-difficulty' },
      ['easy', 'medium', 'hard'].map((value) => el('option', { value, text: DIFFICULTY_LABELS[value] })),
    );
    difficultySelect.value = question?.difficulty ?? 'medium';

    const tagsInput = el('input', {
      class: 'input', id: 'question-tags', value: (question?.tags ?? []).join('、'),
      placeholder: '用顿号或逗号分隔，最多 10 个',
    });
    const tagsError = fieldError();

    const errors = fieldErrors({
      content: contentError,
      category: categoryError,
      tags: tagsError,
      options: choiceEditor.errorNode,
    });

    /* ---- 题型：二选一，且它会改变表单结构，所以做成醒目的分段控件 ---- */
    let type = question?.question_type ?? 'short_answer';

    const choiceBlock = el('div', { class: 'field' },
      el('span', { class: 'field-label', text: '选项' }),
      choiceEditor.node);

    const choiceAnswerBlock = el('div', { class: 'field' },
      el('span', { class: 'field-label', text: '参考答案' }),
      el('p', { class: 'field-note', style: 'margin-bottom:8px' }, '单选题的参考答案必须是其中一个选项 —— 判分时就按它比对。'),
      choiceEditor.answerSelect);

    const shortAnswerBlock = el('div', { class: 'field' },
      el('label', { class: 'field-label', for: 'question-reference', text: '参考答案' }),
      shortAnswerInput);

    const segButtons = {
      single_choice: el('button', { class: 'seg-btn', type: 'button', text: TYPE_LABELS.single_choice }),
      short_answer: el('button', { class: 'seg-btn', type: 'button', text: TYPE_LABELS.short_answer }),
    };

    function paintType() {
      for (const [key, button] of Object.entries(segButtons)) {
        button.className = `seg-btn${key === type ? ' is-on' : ''}`;
      }
      const isSingle = type === 'single_choice';
      choiceBlock.hidden = !isSingle;
      choiceAnswerBlock.hidden = !isSingle;
      shortAnswerBlock.hidden = isSingle;
    }
    for (const [key, button] of Object.entries(segButtons)) {
      button.addEventListener('click', () => { type = key; paintType(); });
    }

    const typeBlock = el('div', { class: 'field' },
      el('span', { class: 'field-label', text: '题型' }),
      el('div', { class: 'seg' }, segButtons.single_choice, segButtons.short_answer));

    const body = el(
      'div',
      {},
      el('div', { class: 'form-grid' },
        el('div', { class: 'field' },
          el('label', { class: 'field-label', for: 'question-position', text: '所属岗位' }),
          positionSelect),
        el('div', { class: 'field' },
          el('label', { class: 'field-label', for: 'question-dimension', text: '考察维度' }),
          dimensionSelect),
      ),
      typeBlock,
      el('div', { class: 'field' },
        el('label', { class: 'field-label', for: 'question-content', text: '题干' }),
        contentInput,
        el('p', { class: 'field-note', text: '5–2000 字。' }),
        contentError),
      choiceBlock,
      choiceAnswerBlock,
      shortAnswerBlock,
      el('div', { class: 'field' },
        el('label', { class: 'field-label', for: 'question-explanation', text: '解析' }),
        explanationInput),
      el('div', { class: 'form-grid' },
        el('div', { class: 'field' },
          el('label', { class: 'field-label', for: 'question-category', text: '分类' }),
          categoryInput, categoryError),
        el('div', { class: 'field' },
          el('label', { class: 'field-label', for: 'question-difficulty', text: '难度' }),
          difficultySelect),
      ),
      el('div', { class: 'field' },
        el('label', { class: 'field-label', for: 'question-tags', text: '标签' }),
        tagsInput,
        el('p', { class: 'field-note', text: '用顿号或逗号分隔。最多 10 个，每个不超过 20 字。' }),
        tagsError),
    );

    const submit = el('button', { class: 'btn btn--primary', text: isEdit ? '保存' : '创建题目' });

    // AI 生成参考答案：端点按题目 id 工作，所以只有已保存的题才能用
    const aiButton = el('button', {
      class: 'btn btn--ghost',
      type: 'button',
      text: 'AI 生成参考答案',
      disabled: !isEdit,
      title: isEdit ? '由 AI 写出参考答案与解析，写回后可继续手工修改' : '先保存这道题，才能用 AI 生成参考答案',
      onClick: async () => {
        aiButton.disabled = true;
        const before = aiButton.textContent;
        aiButton.textContent = '生成中…';
        try {
          const updated = await api.post(`/questions/${question.id}/reference-answer`, {});
          if (updated.question_type === 'single_choice') {
            choiceEditor.setAnswer(updated.reference_answer);
          } else {
            shortAnswerInput.value = updated.reference_answer ?? '';
          }
          explanationInput.value = updated.explanation ?? '';
          toast.success('已生成，可直接修改后保存');
        } catch (error) {
          toast.error(error.message); // 后端文案，例如「AI 生成的答案不在选项中」
        } finally {
          aiButton.disabled = false;
          aiButton.textContent = before;
        }
      },
    });

    const handle = openModal({
      title: isEdit ? '编辑题目' : '创建题目',
      body,
      wide: true,
      footer: [aiButton, el('button', { class: 'btn btn--ghost', text: '取消', onClick: () => handle.close() }), submit],
    });

    syncDimensions();
    paintType();

    submit.addEventListener('click', async () => {
      errors.clear();

      const content = contentInput.value.trim();
      if (content.length < 5) { errors.show('content', '题干至少 5 个字'); contentInput.focus(); return; }

      const tags = parseTags(tagsInput.value);
      if (tags.length > MAX_TAGS) {
        errors.show('tags', `标签最多 ${MAX_TAGS} 个，当前 ${tags.length} 个`);
        tagsInput.focus();
        return;
      }
      const tooLong = tags.find((tag) => tag.length > MAX_TAG_LENGTH);
      if (tooLong) {
        errors.show('tags', `单个标签不能超过 ${MAX_TAG_LENGTH} 个字符：${tooLong}`);
        tagsInput.focus();
        return;
      }

      let options = [];
      let referenceAnswer;
      if (type === 'single_choice') {
        const choice = choiceEditor.read();
        if (!choice) return;
        options = choice.options;
        referenceAnswer = choice.reference_answer;
      } else {
        referenceAnswer = shortAnswerInput.value.trim() || null;
      }

      handle.setBusy(true);
      try {
        const payload = {
          position_id: Number(positionSelect.value),
          dimension: dimensionSelect.value,
          content,
          category: categoryInput.value.trim() || '通用',
          difficulty: difficultySelect.value,
          tags,
          question_type: type,
          options,
          reference_answer: referenceAnswer,
          explanation: explanationInput.value.trim() || null,
        };
        if (isEdit) await api.put(`/questions/${question.id}`, payload);
        else await api.post('/questions', payload);
        handle.close();
        toast.success(isEdit ? '题目已保存' : '题目已创建');
        onSaved();
      } catch (error) {
        handle.setBusy(false);
        // 字段格式类 400（content / tags 越界）走 detail.fields，落到字段下方；
        // 选项与答案类规则、维度不属岗位返回的是别的 detail 形状（不含 fields），
        // 所以落到 else 分支，用后端原话提示。
        if (!errors.fromServer(error)) toast.error(error.message);
      }
    });
  }

  /* -------------------------------- 页面 -------------------------------- */

  async function render(container) {
    const { root, main } = createShell(contextTitle('题库'));
    mount(container, root);
    mount(main, loadingBlock('正在加载题库…'));

    let positions;
    try {
      positions = await api.get('/positions');
    } catch (error) {
      mount(main, el('div', { class: 'panel' }, emptyState('题库加载失败', error.message)));
      return;
    }

    let questions = [];
    let selectedId = null;
    const filters = { position_id: '', question_type: '', dimension: '', category: '', source: '', keyword: '' };

    const listBody = el('div', { class: 'split-list-body' });
    const dossier = el('div', { class: 'panel' });
    const split = el('div', { class: 'split split--wide' }, el('div', { class: 'split-list' }, listBody), dossier);
    const emptyPanel = el('div', { class: 'panel' });
    const bodyHost = el('div', {}, split, emptyPanel);
    const countNode = el('span', { class: 'filterbar-count' });

    function create() { openQuestionModal(positions, null, reload); }

    function query() {
      const params = new URLSearchParams();
      for (const [key, value] of Object.entries(filters)) if (value) params.set(key, value);
      const qs = params.toString();
      return `/questions${qs ? `?${qs}` : ''}`;
    }

    async function reload() {
      try {
        questions = await api.get(query());
      } catch (error) {
        toast.error(error.message);
        return;
      }
      if (!questions.some((q) => q.id === selectedId)) selectedId = questions[0]?.id ?? null;
      paint();
    }

    async function removeQuestion(question) {
      const ok = await confirmModal({
        title: '删除这道题？',
        message: '如果它已经被某场面试引用，删除会被拒绝。',
      });
      if (!ok) return;
      try {
        await api.del(`/questions/${question.id}`);
        toast.success('题目已删除');
        reload();
      } catch (error) {
        toast.error(error.message); // 409 的文案直接来自后端
      }
    }

    function paintList() {
      clear(listBody);
      if (!questions.length) {
        listBody.append(el('p', { class: 'hint', style: 'padding:var(--s4)' }, '没有匹配的题目。'));
        return;
      }
      for (const question of questions) {
        const position = positions.find((p) => p.id === question.position_id);
        listBody.append(
          el('button', {
            class: `split-item${question.id === selectedId ? ' is-active' : ''}`,
            type: 'button',
            'aria-current': question.id === selectedId ? 'true' : null,
            onClick: () => { selectedId = question.id; paintList(); paintDossier(); },
          },
            el('div', { class: 'split-item-text', text: question.content }),
            el('div', { class: 'split-item-tags' },
              el('span', { class: 'tag tag--dim', text: TYPE_LABELS[question.question_type] ?? question.question_type }),
              el('span', { class: 'tag tag--dim', text: DIFFICULTY_LABELS[question.difficulty] ?? question.difficulty }),
              el('span', { class: 'split-item-pos', text: position?.name ?? '—' }),
            ),
          ),
        );
      }
    }

    function section(label, node) {
      return el('div', { class: 'dossier-section' },
        el('div', { class: 'dossier-label', text: label }),
        node);
    }

    function paintDossier() {
      clear(dossier);
      const question = questions.find((q) => q.id === selectedId);
      if (!question) {
        dossier.append(emptyState('请选择一道题', '左侧选中后，这里显示题干、选项、参考答案与解析。'));
        return;
      }

      const position = positions.find((p) => p.id === question.position_id);
      const isChoice = question.question_type === 'single_choice';
      const answer = question.reference_answer;

      dossier.append(
        el('div', { class: 'dossier-head' },
          el('div', {},
            el('h2', { class: 'dossier-question', text: question.content }),
            el('div', { class: 'meta-row' },
              sourceTag(question.source),
              el('span', { class: 'tag tag--dim', text: TYPE_LABELS[question.question_type] ?? question.question_type }),
              dimTag(question.dimension),
              el('span', { class: 'tag tag--dim', text: `难度 ${DIFFICULTY_LABELS[question.difficulty] ?? question.difficulty}` }),
              // 位置信息合并成一句：几个裸词并排时，「线上排查」到底是分类还是
              // 岗位名的一部分，读起来要猜
              el('span', { text: `${position?.name ?? '—'}／${question.category}` }),
            ),
          ),
          el('div', { class: 'dossier-actions' },
            el('button', {
              class: 'btn btn--ghost',
              text: 'AI 生成参考答案',
              onClick: () => generateAnswer(question),
            }),
            el('button', { class: 'btn btn--ghost', text: '编辑', onClick: () => openQuestionModal(positions, question, reload) }),
            el('button', { class: 'btn btn--ghost', text: '删除', onClick: () => removeQuestion(question) }),
          ),
        ),

        isChoice && question.options.length
          ? section('选项', el('ol', { class: 'option-list' },
              question.options.map((text, index) =>
                el('li', { class: `option-item${text === answer ? ' is-correct' : ''}` },
                  el('span', { class: 'option-key', text: letter(index) }),
                  el('span', { text }),
                  text === answer ? el('span', { class: 'option-flag', text: '参考答案' }) : null,
                ),
              ),
            ))
          : null,

        answer
          ? section('参考答案', el('p', { class: 'dossier-text', text: answer }))
          : section('参考答案', el('p', { class: 'hint' }, isChoice
              ? '这道单选题还没有参考答案。'
              : '还没有参考答案。可以用上面的「AI 生成参考答案」起草，再手工修改。')),

        question.explanation ? section('解析', el('p', { class: 'dossier-text', text: question.explanation })) : null,

        question.tags.length
          ? section('标签', el('div', { class: 'tag-row' }, question.tags.map((tag) => dimTag(tag))))
          : null,
      );
    }

    async function generateAnswer(question) {
      if (question.reference_answer) {
        const ok = await confirmModal({
          title: '重新生成参考答案？',
          message: '生成会覆盖这道题现有的参考答案与解析，且不可撤销。',
          confirmLabel: '重新生成',
          danger: false,
        });
        if (!ok) return;
      }
      try {
        const updated = await api.post(`/questions/${question.id}/reference-answer`, {});
        Object.assign(question, updated);
        paintDossier();
        toast.success('参考答案已更新');
      } catch (error) {
        toast.error(error.message);
      }
    }

    function paint() {
      countNode.textContent = `${questions.length} 道题`;
      const hasAny = questions.length > 0;
      split.hidden = !hasAny;
      emptyPanel.hidden = hasAny;
      if (!hasAny) {
        clear(emptyPanel);
        emptyPanel.append(
          emptyState('没有匹配的题目', '换个筛选条件，或者新建一道。',
            el('button', { class: 'btn btn--primary', text: '创建题目', onClick: create })),
        );
        return;
      }
      paintList();
      paintDossier();
    }

    /* ---------------------------- 筛选栏 ---------------------------- */

    function selectFilter(options, key, ariaLabel) {
      const node = el(
        'select',
        { class: 'select', 'aria-label': ariaLabel, onChange: (event) => { filters[key] = event.target.value; reload(); } },
        options.map(([value, text]) => el('option', { value, text })),
      );
      return node;
    }

    function textFilter(key, placeholder, grow) {
      return el('input', {
        class: `input${grow ? ' filterbar-grow' : ''}`,
        placeholder,
        'aria-label': placeholder,
        onInput: (event) => { filters[key] = event.target.value.trim(); reload(); },
      });
    }

    // 维度与分类都是**精确匹配**（后端 == 比较），所以给下拉而不是自由输入 ——
    // 自由输入要求用户一字不差地敲对，否则筛出来是空的却看不出为什么。
    const dimensionOptions = [['', '全部维度']];
    const seenDimensions = new Set();
    for (const position of positions) {
      for (const dimension of position.evaluation_dimensions) {
        if (!seenDimensions.has(dimension)) { seenDimensions.add(dimension); dimensionOptions.push([dimension, dimension]); }
      }
    }
    const categoryOptions = [['', '全部分类']];
    for (const question of questions) {
      if (!categoryOptions.some(([value]) => value === question.category)) {
        categoryOptions.push([question.category, question.category]);
      }
    }

    const filterbar = el('div', { class: 'filterbar' },
      selectFilter([['', '全部岗位'], ...positions.map((p) => [String(p.id), p.name])], 'position_id', '按岗位筛选'),
      selectFilter([['', '全部题型'], ['single_choice', TYPE_LABELS.single_choice], ['short_answer', TYPE_LABELS.short_answer]], 'question_type', '按题型筛选'),
      selectFilter(dimensionOptions, 'dimension', '按维度筛选'),
      selectFilter(categoryOptions, 'category', '按分类筛选'),
      selectFilter([['', '全部来源'], ['bank', '手工'], ['ai', 'AI']], 'source', '按来源筛选'),
      textFilter('keyword', '搜索题干', true),

    mount(
      main,
      el('div', { class: 'page-head' },
        el('div', {},
          el('h1', { text: '题库' }),
          el('p', { class: 'page-lede' }, '手工维护的题会优先被抽中；AI 在面试创建时补充的题也会收录到这里。'),
        ),
        el('div', { class: 'page-head-actions' },
          el('button', {
            class: 'btn btn--primary',
            text: '创建题目',
            disabled: !positions.length,
            title: positions.length ? '' : '请先创建岗位',
            onClick: create,
          })),
      ),
      el('div', { class: 'panel' }, filterbar, bodyHost),
    );

    await reload();
  }

  exports.render = render;
};


/* ==========================================================================
   pages/placeholder.js —— 未实现的模块占位
   原型是分批建设的：信息架构（导航）一次给全，页面一块一块补。
   占位页明说「本模块尚未实现」，避免让人误以为功能坏了。
   ========================================================================== */
__modules['./pages/placeholder.js'] = function (exports, __require) {
  const { el, mount } = __require('./dom.js');
  const { contextTitle, createShell } = __require('./components/shell.js');

  function render(container, params) {
    const route = params?.__route;
    const label = route?.label || route?.key || '该页面';

    const notice = el(
      'div',
      { class: 'placeholder' },
      el('p', { class: 'placeholder-title', text: `${label}尚未接入本原型` }),
      el('p', { class: 'placeholder-text', text: '导航一次给全，页面按模块分批补齐。这一块排在后面的模块里。' }),

    // 公开路由（登录页）本来就不套外壳，占位时也不该套
    if (route?.isPublic) {
      mount(container, el('div', { class: 'placeholder-standalone' }, notice));
      return;
    }

    const { root, main } = createShell(contextTitle(label, '建设中'));
    mount(container, root);
    mount(main, notice);
  }

  exports.render = render;
};
