<style>
/* ===== tokens.css ===== */
/* ==========================================================================
   设计令牌
   --------------------------------------------------------------------------
   三条规则贯穿整个界面，其他一切服从它们：

   1. 颜色只出现在有分数的地方。没有品牌主色，主按钮就是墨色。
      唯一的彩色是 —— 荧光笔（表示"你在这里"）、通过绿、待改进赭。
   2. 衬线体只说数字。分数与总分用 Georgia，中文一律无衬线。
   3. 内容块之间只用发丝线分隔，不用投影。投影留给真正浮起来的层。
   ========================================================================== */

:root {
  /* ---- 墨与纸 ---- */
  --ink: #16202b;          /* 正文、已完成的状态段 */
  --ink-soft: #3a4753;     /* 次级标题 */
  --muted: #5e6c7a;        /* 辅助文字 */
  --faint: #8b98a5;        /* 占位、未到达的状态 */
  --line: #dce1e6;         /* 发丝线 —— 唯一的块间分隔手段 */
  --line-soft: #e9edf0;    /* 更轻的分隔（表格行） */
  --ground: #f1f3f5;       /* 页面底 */
  --surface: #ffffff;      /* 工作区 */

  /* ---- 荧光笔：只表示"当前位置" ---- */
  --marker: #f2c744;
  --marker-wash: #fdf4d6;
  --marker-line: #e3b52c;

  /* ---- 分数：阈值 6.5 取自产品自身对 strengths 的定义 ---- */
  --pass: #0e6b5c;
  --pass-wash: #e6f1ee;
  --watch: #9a6b12;
  --watch-wash: #f7efdd;

  /* ---- 破坏性操作（仅用于删除确认与错误提示） ---- */
  --danger: #a8331f;
  --danger-wash: #fbeae6;

  /* ---- 字体 ---- */
  /* 离线环境，无外网字体可用。个性来自排印处理而非字体族。 */
  --font-ui: "Segoe UI", "Microsoft YaHei UI", "Microsoft YaHei",
             -apple-system, "PingFang SC", "Hiragino Sans GB", sans-serif;
  /* Georgia 的老式数字（3/4/7/9 会下沉）在仪表盘里罕见，给分数一种被"写下"的质感 */
  --font-num: Georgia, "Times New Roman", "Songti SC", SimSun, serif;

  /* ---- 字号（1.25 比例，中文基准 15px 而非 14px） ---- */
  --t-xs: 0.75rem;     /* 12px 元信息 */
  --t-sm: 0.8125rem;   /* 13px 标签 */
  --t-base: 0.9375rem; /* 15px 正文 */
  --t-md: 1rem;        /* 16px */
  --t-lg: 1.125rem;    /* 18px 小节标题 */
  --t-xl: 1.5rem;      /* 24px 区块标题 */
  --t-2xl: 2rem;       /* 32px 页面标题 */
  --t-hero: 3.75rem;   /* 60px 总分 */

  /* ---- 间距 ---- */
  --s1: 4px;
  --s2: 8px;
  --s3: 12px;
  --s4: 16px;
  --s5: 24px;
  --s6: 32px;
  --s7: 48px;
  --s8: 64px;

  /* ---- 圆角：按层级区分，不是所有东西同一个值 ---- */
  --r-control: 3px;   /* 按钮、输入、标签 */
  --r-surface: 8px;   /* 面板、弹窗 */

  /* ---- 投影：只给浮层 ---- */
  --shadow-float: 0 8px 28px rgba(22, 32, 43, 0.14),
                  0 1px 3px rgba(22, 32, 43, 0.08);

  /* ---- 布局 ---- */
  --sidebar-w: 216px;
  --topbar-h: 52px;
  --measure: 34em;    /* 正文行长上限，中文约 34 字 */
}

/* ===== base.css ===== */
/* ==========================================================================
   基础：重置、排印、外壳布局
   ========================================================================== */

*,
*::before,
*::after {
  box-sizing: border-box;
}

* {
  margin: 0;
}

html {
  font-size: 100%;
  height: 100%;
}

body {
  font-family: var(--font-ui);
  font-size: var(--t-base);
  line-height: 1.7; /* 中文需要比拉丁文更松的行距 */
  color: var(--ink);
  background: var(--ground);
  min-height: 100%;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
}

#app {
  min-height: 100vh;
}

/* 数字统一用 Georgia —— 只在这些地方，见 tokens 的规则 2 */
.num {
  font-family: var(--font-num);
  font-variant-numeric: tabular-nums;
}

img,
svg,
canvas {
  display: block;
  max-width: 100%;
}

button,
input,
select,
textarea {
  font: inherit;
  color: inherit;
}

a {
  color: var(--ink);
  text-underline-offset: 0.25em;
  text-decoration-thickness: 1px;
}

a:hover {
  text-decoration-thickness: 2px;
}

/* --- 键盘可达性：焦点必须可见 --- */
:focus-visible {
  outline: 2px solid var(--ink);
  outline-offset: 2px;
  border-radius: var(--r-control);
}

::selection {
  background: var(--marker);
  color: var(--ink);
}

/* ==========================================================================
   排印
   ========================================================================== */

.h-page {
  font-size: var(--t-2xl);
  font-weight: 600;
  line-height: 1.3;
  letter-spacing: -0.01em;
}

.h-section {
  font-size: var(--t-xl);
  font-weight: 600;
  line-height: 1.4;
}

.h-sub {
  font-size: var(--t-lg);
  font-weight: 600;
  line-height: 1.5;
}

.prose {
  max-width: var(--measure);
  color: var(--ink-soft);
}

.meta {
  font-size: var(--t-sm);
  color: var(--muted);
}

.hint {
  font-size: var(--t-sm);
  color: var(--faint);
}

/* ==========================================================================
   外壳布局
   ========================================================================== */

.shell {
  display: grid;
  grid-template-columns: var(--sidebar-w) 1fr;
  min-height: 100vh;
}

/* ------------------------------ 侧边栏 ------------------------------ */

.sidebar {
  background: var(--surface);
  border-right: 1px solid var(--line);
  display: flex;
  flex-direction: column;
  padding: var(--s5) 0 var(--s4);
  position: sticky;
  top: 0;
  height: 100vh;
}

.sidebar-brand {
  padding: 0 var(--s5) var(--s5);
  font-size: var(--t-md);
  font-weight: 600;
  letter-spacing: -0.01em;
  color: var(--ink);
}

.sidebar-brand span {
  display: block;
  font-size: var(--t-xs);
  font-weight: 400;
  color: var(--faint);
  letter-spacing: 0;
}

.sidebar-nav {
  display: flex;
  flex-direction: column;
  gap: 2px;
  padding: 0 var(--s3);
}

/* 导航项用左边缘的荧光笔标记"你在哪里"，而不是整块高亮 */
.nav-item {
  display: flex;
  align-items: center;
  gap: var(--s3);
  padding: var(--s2) var(--s3);
  border-radius: var(--r-control);
  color: var(--ink-soft);
  text-decoration: none;
  font-size: var(--t-base);
  border-left: 3px solid transparent;
  transition: background 120ms ease;
}

.nav-item:hover {
  background: var(--ground);
  text-decoration: none;
}

.nav-item.is-active {
  color: var(--ink);
  font-weight: 600;
  border-left-color: var(--marker);
  background: var(--ground);
}

.nav-item-count {
  margin-left: auto;
  font-size: var(--t-xs);
  color: var(--faint);
  font-family: var(--font-num);
}

/* ------------------------------ 工作区 ------------------------------ */

.workspace {
  display: flex;
  flex-direction: column;
  min-width: 0; /* 防止宽表格把栅格撑破 */
}

.topbar {
  height: var(--topbar-h);
  display: flex;
  align-items: center;
  gap: var(--s4);
  padding: 0 var(--s6);
  border-bottom: 1px solid var(--line);
  background: var(--surface);
  position: sticky;
  top: 0;
  z-index: 20;
}

.topbar-context {
  display: flex;
  align-items: baseline;
  gap: var(--s3);
  min-width: 0;
}

.topbar-title {
  font-weight: 600;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.topbar-user {
  margin-left: auto;
  display: flex;
  align-items: center;
  gap: var(--s4);
  font-size: var(--t-sm);
  color: var(--muted);
}

.main {
  flex: 1;
  padding: var(--s6);
  min-width: 0;
}

/* 页面标题与操作按钮同一行 */
.page-head {
  display: flex;
  align-items: flex-end;
  gap: var(--s4);
  margin-bottom: var(--s5);
}

.page-head-actions {
  margin-left: auto;
  display: flex;
  gap: var(--s2);
}

.page-lede {
  margin-top: var(--s2);
  color: var(--muted);
  font-size: var(--t-base);
  max-width: var(--measure);
}

/* ==========================================================================
   动效：只有一个编排好的入场，不做逐块 fade-and-slide
   ========================================================================== */

@keyframes rise {
  from {
    opacity: 0;
    transform: translateY(6px);
  }
  to {
    opacity: 1;
    transform: none;
  }
}

/* 页面级唯一的一次入场 */
.main > * {
  animation: rise 220ms ease-out both;
}

@media (prefers-reduced-motion: reduce) {
  *,
  *::before,
  *::after {
    animation-duration: 0.01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.01ms !important;
  }
}

/* ===== components.css ===== */
/* ==========================================================================
   组件
   ========================================================================== */

/* ------------------------------- 按钮 ------------------------------- */
/* 主按钮是墨色而非品牌色 —— 全站没有品牌主色，见 tokens 规则 1 */

.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: var(--s2);
  height: 34px;
  padding: 0 var(--s4);
  border: 1px solid transparent;
  border-radius: var(--r-control);
  font-size: var(--t-base);
  line-height: 1;
  white-space: nowrap;
  cursor: pointer;
  background: none;
  transition: background 120ms ease, border-color 120ms ease;
}

.btn:disabled {
  cursor: not-allowed;
  opacity: 0.45;
}

.btn--primary {
  background: var(--ink);
  color: #fff;
}

.btn--primary:hover:not(:disabled) {
  background: #000;
}

.btn--ghost {
  border-color: var(--line);
  color: var(--ink);
  background: var(--surface);
}

.btn--ghost:hover:not(:disabled) {
  border-color: var(--faint);
}

.btn--quiet {
  color: var(--muted);
  padding: 0 var(--s2);
}

.btn--quiet:hover:not(:disabled) {
  color: var(--ink);
  background: var(--ground);
}

.btn--danger {
  background: var(--danger);
  color: #fff;
}

.btn--danger:hover:not(:disabled) {
  background: #8f2a19;
}

.btn--wide {
  width: 100%;
}

.btn--sm {
  height: 28px;
  padding: 0 var(--s3);
  font-size: var(--t-sm);
}

/* ------------------------------- 面板 ------------------------------- */

.panel {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--r-surface);
  overflow: hidden;
}

.panel + .panel {
  margin-top: var(--s5);
}

.panel-head {
  display: flex;
  align-items: center;
  gap: var(--s3);
  padding: var(--s4) var(--s5);
  border-bottom: 1px solid var(--line);
}

.panel-head-actions {
  margin-left: auto;
  display: flex;
  gap: var(--s2);
}

.panel-body {
  padding: var(--s5);
}

.panel-body--tight {
  padding: 0;
}

.panel-foot {
  display: flex;
  align-items: center;
  gap: var(--s3);
  padding: var(--s4) var(--s5);
  border-top: 1px solid var(--line);
  background: var(--ground);
}

/* ------------------------------- 表单 ------------------------------- */

.field {
  margin-bottom: var(--s5);
}

.field:last-child {
  margin-bottom: 0;
}

.field-label {
  display: block;
  margin-bottom: var(--s2);
  font-size: var(--t-sm);
  font-weight: 600;
  color: var(--ink);
}

.field-note {
  margin-top: var(--s2);
  font-size: var(--t-sm);
  color: var(--faint);
}

.field-error {
  margin-top: var(--s2);
  font-size: var(--t-sm);
  color: var(--danger);
}

.input,
.textarea,
.select {
  width: 100%;
  padding: var(--s2) var(--s3);
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--r-control);
  font-size: var(--t-base);
  line-height: 1.6;
  transition: border-color 120ms ease;
}

.input {
  height: 34px;
}

.select {
  height: 34px;
  cursor: pointer;
}

.textarea {
  min-height: 96px;
  resize: vertical;
}

.input:hover,
.textarea:hover,
.select:hover {
  border-color: var(--faint);
}

.input:focus,
.textarea:focus,
.select:focus {
  outline: none;
  border-color: var(--ink);
  box-shadow: 0 0 0 3px var(--marker-wash);
}

.input::placeholder,
.textarea::placeholder {
  color: var(--faint);
}

.input:read-only,
.textarea:read-only {
  background: var(--ground);
  color: var(--muted);
  cursor: default;
}

/* ------------------------------- 标签 ------------------------------- */
/* 3px 直角而非胶囊 —— 读起来像标注，不像 chip */

.tag {
  display: inline-flex;
  align-items: center;
  height: 21px;
  padding: 0 var(--s2);
  border: 1px solid transparent; /* 占位，让描边型标签与填充型同高 */
  border-radius: var(--r-control);
  font-size: var(--t-xs);
  line-height: 1;
  white-space: nowrap;
  background: var(--ground);
  color: var(--muted);
}

/* 面试状态：颜色编码"在流程中的位置"，不是装饰。
   四种状态必须一眼可分 —— 描边 = 还没落定；实底 = 已经落定。 */
.tag--ongoing {
  background: var(--surface);
  border-color: var(--line);
  color: var(--ink-soft);
}

.tag--completed {
  background: #e7eaed;
  color: var(--ink);
}

.tag--evaluating {
  background: var(--marker-wash);
  border-color: var(--marker-line);
  color: #7a5c00;
}

.tag--evaluated {
  background: var(--pass-wash);
  border-color: #bfd9d2;
  color: var(--pass);
}

/* 题目来源：沿用与面试状态同一套"描边 vs 实底"的手法，
   不引入第四个色系 —— 调色板只留给分数与当前位置。 */
.tag--bank {
  background: var(--ground);
  color: var(--muted);
}

.tag--ai {
  background: var(--surface);
  border-color: var(--line);
  color: var(--ink-soft);
}

/* 维度 */
.tag--dim {
  background: none;
  border: 1px solid var(--line);
  color: var(--muted);
}

/* ------------------------------- 表格 ------------------------------- */

.table {
  width: 100%;
  border-collapse: collapse;
  font-size: var(--t-base);
}

.table th {
  text-align: left;
  font-size: var(--t-sm);
  font-weight: 600;
  color: var(--muted);
  padding: var(--s3) var(--s4);
  border-bottom: 1px solid var(--line);
  white-space: nowrap;
}

.table td {
  padding: var(--s3) var(--s4);
  border-bottom: 1px solid var(--line-soft);
  vertical-align: middle;
}

.table tbody tr:last-child td {
  border-bottom: none;
}

.table tbody tr:hover {
  background: #fafbfc;
}

.table .cell-actions {
  text-align: right;
  white-space: nowrap;
}

/* 长文本截断，悬停看全文。
   必须是 block —— max-width 对行内元素无效，用在 <span> 上会失效。 */
.truncate {
  display: block;
  max-width: 30ch;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

/* ------------------------------- 分数 ------------------------------- */
/* 规则 2：衬线体只说数字 */

.score {
  font-family: var(--font-num);
  font-variant-numeric: tabular-nums;
  line-height: 1;
}

.score--hero {
  font-size: var(--t-hero);
  font-weight: 400;
  letter-spacing: -0.02em;
}

.score--lg {
  font-size: var(--t-xl);
}

.score--md {
  font-size: var(--t-lg);
}

/* 表格里需要扫描对齐的分数改用无衬线 + 等宽数字 */
.score--cell {
  font-family: var(--font-ui);
  font-size: var(--t-base);
  font-variant-numeric: tabular-nums;
  font-weight: 600;
}

.is-pass {
  color: var(--pass);
}

.is-watch {
  color: var(--watch);
}

/* ---------------------------- 状态轨 ---------------------------- */
/* 全站的结构脊柱。产品本身有真实的状态机（module-05 §5.4），
   所以横向步骤指示是信息，不是装饰。 */

.rail {
  display: flex;
  list-style: none;
  padding: 0;
  margin: 0 0 var(--s5);
  border-bottom: 1px solid var(--line);
}

.rail-step {
  flex: 1;
  position: relative;
  padding: 0 0 var(--s4);
}

/* 连接线 */
.rail-step::after {
  content: "";
  position: absolute;
  left: 0;
  right: 0;
  bottom: -1px;
  height: 2px;
  background: var(--line);
}

.rail-step:first-child::after {
  left: 0;
}

.rail-label {
  display: inline-block;
  padding: 2px var(--s2);
  font-size: var(--t-base);
  color: var(--faint);
}

/* 已完成：墨色 */
.rail-step.is-done::after {
  background: var(--ink);
}

.rail-step.is-done .rail-label {
  color: var(--ink-soft);
}

/* 当前：荧光笔划过标签 —— 全站唯一的大胆手势 */
.rail-step.is-current::after {
  background: var(--marker);
}

.rail-step.is-current .rail-label {
  background: var(--marker);
  color: var(--ink);
  font-weight: 600;
  border-radius: 2px;
}

/* ---------------------------- 空态 ---------------------------- */

.empty {
  padding: var(--s8) var(--s5);
  text-align: center;
  color: var(--muted);
}

.empty-title {
  font-size: var(--t-md);
  color: var(--ink);
  margin-bottom: var(--s2);
}

.empty-action {
  margin-top: var(--s5);
}

/* ---------------------------- 加载 ---------------------------- */

.spinner {
  width: 14px;
  height: 14px;
  border: 2px solid var(--line);
  border-top-color: var(--ink);
  border-radius: 50%;
  animation: spin 700ms linear infinite;
}

@keyframes spin {
  to {
    transform: rotate(360deg);
  }
}

/* ---------------------------- 进度条 ---------------------------- */

.progress {
  height: 3px;
  background: var(--line);
  border-radius: 2px;
  overflow: hidden;
}

.progress-fill {
  height: 100%;
  background: var(--marker);
  transition: width 240ms ease;
}

/* ---------------------------- 弹窗 ---------------------------- */
/* 投影只给真正浮起来的层 */

.modal-overlay {
  position: fixed;
  inset: 0;
  background: rgba(22, 32, 43, 0.42);
  display: flex;
  align-items: flex-start;
  justify-content: center;
  padding: 9vh var(--s5) var(--s5);
  z-index: 100;
  overflow-y: auto;
}

.modal {
  width: 100%;
  max-width: 520px;
  background: var(--surface);
  border-radius: var(--r-surface);
  box-shadow: var(--shadow-float);
  animation: rise 160ms ease-out both;
}

.modal--wide {
  max-width: 680px;
}

.modal-head {
  display: flex;
  align-items: center;
  padding: var(--s5);
  border-bottom: 1px solid var(--line);
}

.modal-title {
  font-size: var(--t-lg);
  font-weight: 600;
}

.modal-body {
  padding: var(--s5);
  max-height: 62vh;
  overflow-y: auto;
}

.modal-foot {
  display: flex;
  align-items: center;
  justify-content: flex-end;
  gap: var(--s2);
  padding: var(--s4) var(--s5);
  border-top: 1px solid var(--line);
}

/* ---------------------------- 提示 ---------------------------- */

.toast-stack {
  position: fixed;
  top: var(--s5);
  right: var(--s5);
  z-index: 200;
  display: flex;
  flex-direction: column;
  gap: var(--s2);
}

.toast {
  display: flex;
  align-items: flex-start;
  gap: var(--s3);
  min-width: 260px;
  max-width: 400px;
  padding: var(--s3) var(--s4);
  background: var(--surface);
  border: 1px solid var(--line);
  border-left: 3px solid var(--ink);
  border-radius: var(--r-control);
  box-shadow: var(--shadow-float);
  font-size: var(--t-base);
  animation: rise 160ms ease-out both;
}

.toast--error {

  /**
   * 弹窗（module-07 §6）。
   * Esc 关闭；提交中禁用关闭 —— 避免重复提交。
   */

  const { el, mount } = __require('./dom.js');

  /**
   * 打开弹窗。
   * 返回 { close, setBusy, root }。
   */
  function openModal({ title, body, footer, wide = false, onClose }) {
    const overlay = el('div', { class: 'modal-overlay' });
    let busy = false;

    const close = () => {
      if (busy) return; // 提交中不允许关闭
      document.removeEventListener('keydown', onKeydown);
      overlay.remove();
      if (onClose) onClose();
    };

    const onKeydown = (event) => {
      if (event.key === 'Escape') close();
    };

    const panel = el(
      'div',
      { class: `modal${wide ? ' modal--wide' : ''}`, role: 'dialog', 'aria-modal': 'true' },
      el('div', { class: 'modal-head' }, el('div', { class: 'modal-title', text: title })),
      el('div', { class: 'modal-body' }, body),
      footer ? el('div', { class: 'modal-foot' }, footer) : null,
    );

    overlay.append(panel);
    overlay.addEventListener('mousedown', (event) => {
      if (event.target === overlay) close();
    });
    document.addEventListener('keydown', onKeydown);
    document.body.append(overlay);

    // 焦点进第一个可交互元素，键盘用户不必手动 Tab 进来
    const firstField = panel.querySelector('input, select, textarea, button');
    if (firstField) firstField.focus();

    return {
      root: panel,
      close,
      setBusy(value) {
        busy = value;
        overlay.querySelectorAll('button, input, select, textarea').forEach((node) => {
          node.disabled = value;
        });
      },
    };
  }

  /** 二次确认。返回 Promise<boolean>。 */
  function confirmModal({ title, message, confirmLabel = '删除', danger = true }) {
    return new Promise((resolve) => {
      let settled = false;

      const finish = (value) => {
        if (settled) return;
        settled = true;
        handle.close();
        resolve(value);
      };

      const handle = openModal({
        title,
        body: el('p', { class: 'prose', text: message }),
        footer: [
          el('button', { class: 'btn btn--ghost', text: '取消', onClick: () => finish(false) }),
          el('button', {
            class: `btn ${danger ? 'btn--danger' : 'btn--primary'}`,
            text: confirmLabel,
            onClick: () => finish(true),
          }),
        ],
        onClose: () => finish(false),
      });
    });
  }

  exports.openModal = openModal;
  exports.confirmModal = confirmModal;
};

          overall_score: scores.overall_score,
          conclusion: scores.conclusion,
          strengths: scores.strengths,
          weaknesses: scores.weaknesses,
          evaluated_at: scores.evaluated_at,
        };

      }

        state.dimensions = [];
        state.report = null;

    });

    mount(
      main,
      el(
        'div',
        { class: 'page-head' },
        el(
          'div',
          {},
          el('h1', { class: 'h-page', text: '题库' }),
          el('p', { class: 'page-lede' }, '手工维护的题会优先被抽中；AI 在面试创建时补充的题也会收录到这里。'),
        ),
        el(
          'div',
          { class: 'page-head-actions' },
          el('button', {
            class: 'btn btn--primary',
            text: '创建题目',
            disabled: !canCreate,
            title: canCreate ? '' : '请先创建岗位',
            onClick: () => openQuestionModal(positions, null, reload),
          }),
        ),
      ),

      el(
        'div',
        { class: 'panel' },
        el(
          'div',
          { class: 'filterbar' },
          positionFilter,
          dimensionFilter,
          categoryFilter,
          sourceFilter,
          keywordFilter,
          el('span', { class: 'filterbar-spacer' }),
          countNode,
        ),
        el(
          'table',
          { class: 'table' },
          el(
            'thead',
            {},
            el(
              'tr',
              {},
              el('th', { text: '题干' }),
              el('th', { text: '岗位' }),
              el('th', { text: '维度' }),
              el('th', { text: '分类' }),
              el('th', { text: '难度' }),
              el('th', { text: '来源' }),
              el('th', {}),
            ),
          ),
          tableBody,
        ),
      ),
    );

    await reload();
  }

  exports.render = render;
};
