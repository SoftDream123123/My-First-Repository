<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1280">
<title>面试助手 · HR 工作台</title>
<style>
/* ==========================================================================
   设计令牌 —— 「案卷」工作台
   --------------------------------------------------------------------------
   四条规则贯穿整个界面，其余一切服从它们：

   1. 深墨蓝的脊 + 纸白的工作区。脊管身份与导航，工作区管内容。
   2. 品牌靛蓝只用于「身份与操作」；分数色带只用于「评分」；灰阶用于
      一切结构。三者不混用 —— 蓝色出现的地方一定可以点，彩色出现的地方
      一定带信息。
   3. 面板是纸（白底 + 1px 边 + 8px 圆角，无投影）；只有真正浮起来的层
      （弹窗 / toast / 下拉）才有投影。这是对「SaaS 卡片套件」的回避。
   4. 数字用衬线、右对齐、tabular。报表里的数字要能列对齐 —— Cambria 的
      活字数字而不是 Georgia 的老式数字（3/4/7 下沉，读起来像手写）。
   ========================================================================== */

:root {
  /* ---- 脊：深墨蓝 ---- */
  --navy: #12283f;
  --navy-raise: #1c3a5c;
  --navy-line: #27456a;

  /* ---- 纸 ---- */
  --paper: #ffffff;
  --ground: #eff3f7;
  --line: #d6dfe9;
  --line-soft: #e8eef4;

  /* ---- 文字 ---- */
  --ink: #17222e;
  --ink-soft: #35434f;
  --muted: #61717f;
  --faint: #94a2b0;

  /* ---- 品牌靛蓝：身份与操作 ---- */
  --brand: #1f4e8c;
  --brand-deep: #173c6e;
  --brand-lift: #5b93d6;      /* 深底上用的品牌色（脊内） */
  --brand-wash: #eaf1f9;
  --brand-line: #c0d5ec;

  /* ---- 分数带：阈值 6.5 取自产品自身对 strengths 的定义 ---- */
  --pass: #0d6e52;
  --pass-wash: #e4f1eb;
  --watch: #9c6410;
  --watch-wash: #f8eedc;

  /* ---- 破坏性操作 ---- */
  --danger: #a32b1b;
  --danger-wash: #fbeae6;
  --danger-line: #efc9c2;

  /* ---- 字体 ---- */
  /* 离线环境，无外网字体可用。拉丁走 Segoe UI，中文回落到雅黑。 */
  --font-ui: "Segoe UI", "Microsoft YaHei UI", "Microsoft YaHei",
             -apple-system, "PingFang SC", "Hiragino Sans GB", sans-serif;
  /* 只用于数字。Cambria 是 Windows 自带的「文书衬线」，活字数字、
     笔画敦实 —— 报表里的数字该是这个样子。 */
  --font-num: Cambria, Georgia, "Times New Roman", "SimSun", serif;

  /* ---- 字号（1.25 比例，中文基准 15px） ---- */
  --t-xs: 12px;
  --t-sm: 13px;
  --t-base: 15px;
  --t-md: 16px;
  --t-lg: 18px;
  --t-xl: 22px;
  --t-2xl: 28px;
  --t-hero: 56px;

  /* ---- 间距 ---- */
  --s1: 4px;
  --s2: 8px;
  --s3: 12px;
  --s4: 16px;
  --s5: 20px;
  --s6: 24px;
  --s7: 32px;
  --s8: 40px;
  --s9: 56px;

  /* ---- 圆角：按层级区分，不是所有东西同一个值 ---- */
  --r-control: 4px;   /* 按钮、输入、标签 */
  --r-surface: 8px;   /* 面板、弹窗 */

  /* ---- 投影：只给浮层 ---- */
  --shadow-float: 0 12px 32px rgba(18, 40, 63, 0.16),
                  0 2px 6px rgba(18, 40, 63, 0.07);

  /* ---- 布局 ---- */
  --spine-w: 240px;
  --topbar-h: 56px;
  --measure: 34em;    /* 正文行长上限，中文约 34 字 */
}

/* ==========================================================================
   基础层
   ========================================================================== */

*, *::before, *::after { box-sizing: border-box; }

body {
  margin: 0;
  /* 仅 PC（PRD §2）。低于 1280 时横向滚动，不做响应式折叠。 */
  min-width: 1280px;
  font-family: var(--font-ui);
  font-size: var(--t-base);
  line-height: 1.6;
  color: var(--ink);
  background: var(--ground);
}

h1, h2, h3, h4 { margin: 0; font-weight: 700; line-height: 1.35; }
h1 { font-size: var(--t-2xl); letter-spacing: -0.01em; }
h2 { font-size: var(--t-xl); letter-spacing: -0.01em; }
h3 { font-size: var(--t-lg); }
h4 { font-size: var(--t-md); }
p  { margin: 0; }
ol, ul { margin: 0; padding: 0; list-style: none; }

a { color: var(--brand); text-decoration: none; }
a:hover { text-decoration: underline; }

/* 键盘可见焦点 —— 不是可选项 */
:focus-visible {
  outline: 2px solid var(--brand);
  outline-offset: 2px;
  border-radius: var(--r-control);
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: 0.01ms !important;
    transition-duration: 0.01ms !important;
  }
}

/* 数字：衬线 + 表格数字（列对齐） */
.num {
  font-family: var(--font-num);
  font-variant-numeric: lining-nums tabular-nums;
  letter-spacing: 0.01em;
}

.meta { font-size: var(--t-sm); color: var(--muted); }
.hint { font-size: var(--t-sm); color: var(--muted); }
.prose { line-height: 1.75; max-width: var(--measure); }

/* 页面标题区 */
.page-head {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: var(--s6);
  margin-bottom: var(--s6);
}
.page-lede {
  margin-top: var(--s2);
  font-size: 14px;
  color: var(--muted);
  max-width: 62em;
}
.page-head-actions { display: flex; gap: var(--s2); flex: none; padding-top: var(--s1); }

/* ==========================================================================
   组件层
   ========================================================================== */

/* ---- 外壳：脊 + 工作区 ---- */
.shell {
  display: grid;
  grid-template-columns: var(--spine-w) 1fr;
  min-height: 100vh;
}

.spine {
  display: flex;
  flex-direction: column;
  background: var(--navy);
  color: rgba(255, 255, 255, 0.78);
}

.spine-head {
  padding: var(--s5) var(--s5) var(--s5);
  border-bottom: 1px solid var(--navy-line);
}
.spine-mark {
  font-size: var(--t-lg);
  font-weight: 700;
  color: #fff;
  letter-spacing: 0.01em;
}
.spine-sub {
  margin-top: 2px;
  font-size: var(--t-xs);
  color: rgba(255, 255, 255, 0.5);
  letter-spacing: 0.06em;
}

.spine-nav { flex: 1; padding: var(--s4) 0; }
.nav-item {
  display: flex;
  align-items: center;
  gap: var(--s3);
  height: 38px;
  padding: 0 var(--s5);
  border-left: 3px solid transparent;
  font-size: 14px;
  color: rgba(255, 255, 255, 0.74);
}
.nav-item:hover {
  background: rgba(255, 255, 255, 0.05);
  color: #fff;
  text-decoration: none;
}
.nav-item.is-active {
  background: rgba(255, 255, 255, 0.08);
  border-left-color: var(--brand-lift);
  color: #fff;
  font-weight: 600;
}

.spine-foot {
  padding: var(--s4) var(--s5) var(--s5);
  border-top: 1px solid var(--navy-line);
}
.spine-user {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: var(--s2);
  margin-bottom: var(--s3);
}
.spine-username { font-size: 14px; color: #fff; }
.spine-role { font-size: var(--t-xs); color: rgba(255, 255, 255, 0.5); }

.workspace { display: flex; flex-direction: column; min-width: 0; }

.topbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: var(--s4);
  height: var(--topbar-h);
  padding: 0 var(--s7);
  background: var(--paper);
  border-bottom: 1px solid var(--line);
  flex: none;
}
.topbar-context { display: flex; align-items: baseline; gap: var(--s3); min-width: 0; }
.topbar-title { font-size: 14px; font-weight: 600; color: var(--ink); }

.main {
  flex: 1;
  padding: var(--s7) var(--s7) var(--s9);
  max-width: 1240px;
  width: 100%;
}

/* ---- 面板：内容块是纸，不是卡片 ---- */
.panel {
  background: var(--paper);
  border: 1px solid var(--line);
  border-radius: var(--r-surface);
}
.panel + .panel { margin-top: var(--s5); }
.panel-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: var(--s4);
  padding: var(--s4) var(--s5);
  border-bottom: 1px solid var(--line-soft);
}
.panel-title { font-size: var(--t-base); font-weight: 600; color: var(--ink); }
.panel-note { font-size: var(--t-sm); color: var(--muted); }
.panel-body { padding: var(--s5); }
.panel-body--flush { padding: 0; }
.panel-foot {
  padding: var(--s4) var(--s5);
  border-top: 1px solid var(--line-soft);
  display: flex;
  justify-content: flex-end;
  gap: var(--s2);
}

/* ---- 表格 ---- */
.table { width: 100%; border-collapse: collapse; }
.table th {
  padding: var(--s3) var(--s5);
  text-align: left;
  font-size: var(--t-sm);
  font-weight: 600;
  color: var(--ink-soft);
  background: #f7fafc;
  border-bottom: 1px solid var(--line);
  white-space: nowrap;
}
.table td {
  padding: var(--s3) var(--s5);
  border-bottom: 1px solid var(--line-soft);
  vertical-align: middle;
}
.table tbody tr:last-child td { border-bottom: none; }
.table tbody tr:hover { background: #f9fbfd; }
.table .cell-num {
  text-align: right;
  font-family: var(--font-num);
  font-variant-numeric: lining-nums tabular-nums;
}
.table .cell-actions {
  display: flex;
  gap: var(--s1);
  justify-content: flex-end;
  white-space: nowrap;
}
.table strong { font-weight: 600; }

/* ---- 按钮 ---- */
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: var(--s2);
  height: 36px;
  padding: 0 var(--s4);
  border: 1px solid transparent;
  border-radius: var(--r-control);
  font-family: inherit;
  font-size: 14px;
  font-weight: 600;
  line-height: 1;
  cursor: pointer;
  white-space: nowrap;
  transition: background-color 0.12s ease, border-color 0.12s ease;
}
.btn:disabled { cursor: not-allowed; opacity: 0.5; }

.btn--primary { background: var(--brand); color: #fff; }
.btn--primary:hover:not(:disabled) { background: var(--brand-deep); }

.btn--ghost {
  background: var(--paper);
  border-color: var(--line);
  color: var(--ink);
}
.btn--ghost:hover:not(:disabled) { background: #f4f7fa; }

.btn--danger { background: var(--danger); color: #fff; }
.btn--danger:hover:not(:disabled) { background: #8c2416; }

.btn--quiet {
  background: none;
  border-color: transparent;
  color: var(--muted);
  font-weight: 400;
}
.btn--quiet:hover:not(:disabled) { background: #eef2f6; color: var(--ink); }

.btn--wide { width: 100%; }
.btn--sm { height: 30px; padding: 0 var(--s3); font-size: var(--t-sm); }

/* 脊内专用的静音按钮（深底上的次要操作） */
.btn--onspine {
  background: none;
  border-color: var(--navy-line);
  color: rgba(255, 255, 255, 0.72);
  font-weight: 400;
  height: 30px;
  font-size: var(--t-sm);
}
.btn--onspine:hover:not(:disabled) {
  background: var(--navy-raise);
  color: #fff;
}

/* ---- 表单 ---- */
.field { margin-bottom: var(--s5); }
.field-label {
  display: block;
  margin-bottom: var(--s2);
  font-size: var(--t-sm);
  font-weight: 600;
  color: var(--ink-soft);
}
.field-note {
  margin-top: var(--s2);
  font-size: var(--t-xs);
  color: var(--faint);
}
.field-error {
  margin-top: var(--s2);
  font-size: var(--t-xs);
  color: var(--danger);
}
.field-error[hidden] { display: none; }

.input, .select, .textarea {
  width: 100%;
  padding: 0 var(--s3);
  height: 36px;
  font-family: inherit;
  font-size: 14px;
  color: var(--ink);
  background: var(--paper);
  border: 1px solid var(--line);
  border-radius: var(--r-control);
}
.textarea { height: auto; padding: var(--s3); line-height: 1.7; resize: vertical; }
.input::placeholder, .textarea::placeholder { color: var(--faint); }
.input:focus, .select:focus, .textarea:focus {
  outline: none;
  border-color: var(--brand);
  box-shadow: 0 0 0 3px var(--brand-wash);
}
.input:disabled, .select:disabled, .textarea:disabled {
  background: #f4f7fa;
  color: var(--muted);
}
.select { cursor: pointer; }

/* ---- 标签 ---- */
.tag {
  display: inline-flex;
  align-items: center;
  height: 22px;
  padding: 0 var(--s2);
  border: 1px solid transparent;
  border-radius: var(--r-control);
  font-size: var(--t-xs);
  font-weight: 600;
  line-height: 1;
  white-space: nowrap;
}
.tag--draft      { background: #eef2f6; border-color: #dde5ec; color: var(--muted); }
.tag--ongoing    { background: var(--brand-wash); border-color: var(--brand-line); color: var(--brand-deep); }
.tag--completed  { background: #eef2f6; border-color: #dde5ec; color: var(--ink-soft); }
.tag--evaluating { background: var(--watch-wash); border-color: #eadcbe; color: var(--watch); }
.tag--evaluated  { background: var(--pass-wash); border-color: #c6e0d5; color: var(--pass); }
.tag--dim        { background: #f2f6fa; border-color: #e0e8f0; color: var(--ink-soft); }
.tag--off        { background: #eef2f6; border-color: #dde5ec; color: var(--muted); }

.mine-badge { margin-left: var(--s1); font-size: var(--t-xs); color: var(--faint); }

/* ---- 空态 / 加载 ---- */
.empty {
  padding: var(--s9) var(--s5);
  text-align: center;
  color: var(--muted);
  font-size: 14px;
}
.empty-title { font-size: var(--t-md); font-weight: 600; color: var(--ink); margin-bottom: var(--s2); }
.empty-action { margin-top: var(--s5); display: flex; justify-content: center; }

.spinner {
  width: 20px;
  height: 20px;
  border: 2px solid var(--line);
  border-top-color: var(--brand);
  border-radius: 50%;
  animation: spin 0.7s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }

/* ---- 弹窗：真正浮起来的层 ---- */
.modal-overlay {
  position: fixed;
  inset: 0;
  background: rgba(18, 40, 63, 0.42);
  display: flex;
  align-items: flex-start;
  justify-content: center;
  padding: 9vh var(--s6) var(--s6);
  z-index: 40;
}
.modal {
  width: 100%;
  max-width: 460px;
  background: var(--paper);
  border-radius: var(--r-surface);
  box-shadow: var(--shadow-float);
  overflow: hidden;
}
.modal--wide { max-width: 720px; }
.modal-head {
  padding: var(--s5);
  border-bottom: 1px solid var(--line-soft);
}
.modal-title { font-size: var(--t-md); font-weight: 700; }
.modal-body { padding: var(--s5); max-height: 66vh; overflow-y: auto; }
.modal-foot {
  padding: var(--s4) var(--s5);
  border-top: 1px solid var(--line-soft);
  display: flex;
  justify-content: flex-end;
  gap: var(--s2);
  background: #fafcfe;
}

/* ---- Toast ---- */
.toast-stack {
  position: fixed;
  top: var(--s5);
  right: var(--s5);
  display: flex;
  flex-direction: column;
  gap: var(--s2);
  z-index: 60;
}
.toast {
  padding: var(--s3) var(--s4);
  min-width: 220px;
  max-width: 380px;
  background: var(--navy);
  color: #fff;
  font-size: 14px;
  border-radius: var(--r-control);
  box-shadow: var(--shadow-float);
  transition: opacity 0.2s ease;
}
.toast--success { background: var(--pass); }
.toast--error { background: var(--danger); }

/* ---- 状态轨：面试的真实流程，不是装饰性步骤条 ---- */
.rail {
  display: flex;
  background: var(--paper);
  border: 1px solid var(--line);
  border-radius: var(--r-surface);
  overflow: hidden;
}
.rail-step {
  position: relative;
  flex: 1;
  padding: var(--s3) var(--s5) var(--s4);
  border-left: 1px solid var(--line-soft);
}
.rail-step:first-child { border-left: none; }
.rail-index {
  font-family: var(--font-num);
  font-variant-numeric: lining-nums tabular-nums;
  font-size: var(--t-sm);
  color: var(--faint);
  margin-right: var(--s2);
}
.rail-label { font-size: 14px; color: var(--faint); }
.rail-bar {
  position: absolute;
  left: 0; right: 0; bottom: 0;
  height: 3px;
  background: var(--line-soft);
}
.rail-step.is-done .rail-label { color: var(--ink-soft); }
.rail-step.is-done .rail-index { color: var(--muted); }
.rail-step.is-done .rail-bar { background: var(--brand-deep); }
.rail-step.is-current { background: var(--brand-wash); }
.rail-step.is-current .rail-label { color: var(--brand-deep); font-weight: 700; }
.rail-step.is-current .rail-index { color: var(--brand); }
.rail-step.is-current .rail-bar { background: var(--brand); }

/* ==========================================================================
   页面层
   ========================================================================== */

/* ---- 登录页：左侧是产品的真实流程，右侧是表单 ---- */
.login {
  display: grid;
  grid-template-columns: minmax(500px, 46%) 1fr;
  min-height: 100vh;
}
.login-aside {
  background: var(--navy);
  color: #fff;
  padding: var(--s9) var(--s8);
  display: flex;
  flex-direction: column;
}
.login-mark {
  font-size: var(--t-xl);
  font-weight: 700;
  letter-spacing: 0.01em;
}
.login-mark-sub {
  margin-top: var(--s1);
  font-size: var(--t-xs);
  color: rgba(255, 255, 255, 0.5);
  letter-spacing: 0.06em;
}
.login-claim {
  margin-top: var(--s8);
  font-size: var(--t-2xl);
  line-height: 1.5;
  color: #fff;
}
/* 换行位置是写死的，不让浏览器在「同一 / 处」之间断开 */
.login-claim span { display: block; }
.login-flow { margin-top: var(--s8); max-width: 34em; }
.login-flow-item {
  display: grid;
  grid-template-columns: 32px 1fr;
  gap: var(--s4);
  padding: var(--s4) 0;
  border-top: 1px solid var(--navy-line);
}
.login-flow-item:last-child { border-bottom: 1px solid var(--navy-line); }
.login-flow-index {
  font-family: var(--font-num);
  font-variant-numeric: lining-nums tabular-nums;
  font-size: var(--t-lg);
  color: var(--brand-lift);
  line-height: 1.4;
}
.login-flow-label { font-size: 14px; font-weight: 600; color: #fff; }
.login-flow-text {
  margin-top: var(--s1);
  font-size: var(--t-sm);
  color: rgba(255, 255, 255, 0.62);
  line-height: 1.7;
}
.login-aside-foot {
  margin-top: auto;
  padding-top: var(--s7);
  font-size: var(--t-xs);
  color: rgba(255, 255, 255, 0.42);
}
.login-main {
  display: flex;
  align-items: center;
  justify-content: center;
  padding: var(--s8);
  background: var(--paper);
}
.login-card { width: 100%; max-width: 372px; }
.login-card > h2 { font-size: var(--t-xl); }
.login-card-lede { margin: var(--s2) 0 var(--s7); font-size: 14px; color: var(--muted); }
.login-demo {
  margin-top: var(--s6);
  padding: var(--s3) var(--s4);
  background: var(--brand-wash);
  border: 1px solid var(--brand-line);
  border-radius: var(--r-control);
  font-size: var(--t-sm);
  color: var(--brand-deep);
}

/* ---- 未实现的模块占位（原型建设期用） ---- */
.placeholder {
  padding: var(--s9) var(--s6);
  text-align: center;
  background: var(--paper);
  border: 1px dashed var(--line);
  border-radius: var(--r-surface);
}
.placeholder-standalone {
  display: flex;
  align-items: center;
  justify-content: center;
  min-height: 100vh;
  padding: var(--s8);
  background: var(--paper);
}
.placeholder-standalone .placeholder { max-width: 560px; }
.placeholder-title { font-size: var(--t-lg); font-weight: 700; }
.placeholder-text {
  margin-top: var(--s3);
  font-size: 14px;
  color: var(--muted);
}
</style>
</head>
<body>
<div id="app"></div>
<script>
(function () {
  "use strict";
  var __modules = {};

   原型是分批建设的：信息架构（导航）一次给全，页面一块一块补。
   占位页明说「本模块尚未实现」，避免让人误以为功能坏了。
   ========================================================================== */
__modules['./pages/placeholder.js'] = function (exports, __require) {
  const { el, mount } = __require('./dom.js');
  const { contextTitle, createShell } = __require('./components/shell.js');

  function render(container, params) {
    const route = params?.__route;
    const label = route?.label || route?.key || '该页面';

    const notice = el(
      'div',
      { class: 'placeholder' },
      el('p', { class: 'placeholder-title', text: `${label}尚未接入本原型` }),
      el('p', { class: 'placeholder-text', text: '导航一次给全，页面按模块分批补齐。这一块排在后面的模块里。' }),
    );

    // 公开路由（登录页）本来就不套外壳，占位时也不该套
    if (route?.isPublic) {
      mount(container, el('div', { class: 'placeholder-standalone' }, notice));
      return;
    }

    const { root, main } = createShell(contextTitle(label, '建设中'));
    mount(container, root);
    mount(main, notice);
  }

  exports.render = render;
};

/* ==========================================================================
   main.js —— 启动
   ========================================================================== */
__modules['./main.js'] = function (exports, __require) {
  const mock = __require('./mock.js');
  const api = __require('./api.js');
  const { registerPages, start } = __require('./router.js');
  const { toast } = __require('./components/toast.js');

  // 原型模式：装内存后端。?live=1 时走真实 FastAPI。
  if (!api.isLive()) mock.install();

  registerPages({
    login: __require('./pages/login.js'),
    users: __require('./pages/users.js'),
    placeholder: __require('./pages/placeholder.js'),
  });

  // 统一 401 处理：清 token + 跳登录。页面不必各自处理。
  api.setUnauthorizedHandler(() => {
    toast.error('登录状态已失效，请重新登录');
    location.hash = '#/login';
  });

  const app = document.getElementById('app');
  if (!app) throw new Error('找不到挂载点 #app');
  start(app);

  if (!api.isLive()) {
    console.info(
      '%c原型模式%c 数据来自内存 mock。接真实后端：地址后加 ?live=1',
      'background:#1f4e8c;color:#fff;padding:2px 6px;border-radius:3px;font-weight:600',
      'color:#61717f',
    );
  }
};

  __require('./main.js');
})();
</script>
