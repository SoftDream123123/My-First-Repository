<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1280">
<title>面试助手 · HR 工作台</title>
<style>
/* ==========================================================================
   设计令牌 —— 「案卷」工作台
   --------------------------------------------------------------------------
   四条规则贯穿整个界面，其余一切服从它们：

   1. 深墨蓝的脊 + 纸白的工作区。脊管身份与导航，工作区管内容。
   2. 品牌靛蓝只用于「身份与操作」；分数色带只用于「评分」；灰阶用于
      一切结构。三者不混用 —— 蓝色出现的地方一定可以点，彩色出现的地方
      一定带信息。
   3. 面板是纸（白底 + 1px 边 + 8px 圆角，无投影）；只有真正浮起来的层
      （弹窗 / toast / 下拉）才有投影。这是对「SaaS 卡片套件」的回避。
   4. 数字用衬线、右对齐、tabular。报表里的数字要能列对齐 —— Cambria 的
      活字数字而不是 Georgia 的老式数字（3/4/7 下沉，读起来像手写）。
   ========================================================================== */

:root {
  /* ---- 脊：深墨蓝 ---- */
  --navy: #12283f;
  --navy-raise: #1c3a5c;
  --navy-line: #27456a;

  /* ---- 纸 ---- */
  --paper: #ffffff;
  --ground: #eff3f7;
  --line: #d6dfe9;
  --line-soft: #e8eef4;

  /* ---- 文字 ---- */
  --ink: #17222e;
  --ink-soft: #35434f;
  --muted: #61717f;
  --faint: #94a2b0;

  /* ---- 品牌靛蓝：身份与操作 ---- */
  --brand: #1f4e8c;
  --brand-deep: #173c6e;
  --brand-lift: #5b93d6;      /* 深底上用的品牌色（脊内） */
  --brand-wash: #eaf1f9;
  --brand-line: #c0d5ec;

  /* ---- 分数带：阈值 6.5 取自产品自身对 strengths 的定义 ---- */
  --pass: #0d6e52;
  --pass-wash: #e4f1eb;
  --watch: #9c6410;
  --watch-wash: #f8eedc;

  /* ---- 破坏性操作 ---- */
  --danger: #a32b1b;
  --danger-wash: #fbeae6;
  --danger-line: #efc9c2;

  /* ---- 字体 ---- */
  /* 离线环境，无外网字体可用。拉丁走 Segoe UI，中文回落到雅黑。 */
  --font-ui: "Segoe UI", "Microsoft YaHei UI", "Microsoft YaHei",
             -apple-system, "PingFang SC", "Hiragino Sans GB", sans-serif;
  /* 只用于数字。Cambria 是 Windows 自带的「文书衬线」，活字数字、
     笔画敦实 —— 报表里的数字该是这个样子。 */
  --font-num: Cambria, Georgia, "Times New Roman", "SimSun", serif;
  /* 只用于不透明令牌（邀请码）：等宽让 l/1、O/0 这类字符可以逐字核对 */
  --font-code: Consolas, "Cascadia Mono", "Courier New", monospace;

  /* ---- 字号（1.25 比例，中文基准 15px） ---- */
  --t-xs: 12px;
  --t-sm: 13px;
  --t-base: 15px;
  --t-md: 16px;
  --t-lg: 18px;
  --t-xl: 22px;
  --t-2xl: 28px;
  --t-hero: 56px;

  /* ---- 间距 ---- */
  --s1: 4px;
  --s2: 8px;
  --s3: 12px;
  --s4: 16px;
  --s5: 20px;
  --s6: 24px;
  --s7: 32px;
  --s8: 40px;
  --s9: 56px;

  /* ---- 圆角：按层级区分，不是所有东西同一个值 ---- */
  --r-control: 4px;   /* 按钮、输入、标签 */
  --r-surface: 8px;   /* 面板、弹窗 */

  /* ---- 投影：只给浮层 ---- */
  --shadow-float: 0 12px 32px rgba(18, 40, 63, 0.16),
                  0 2px 6px rgba(18, 40, 63, 0.07);

  /* ---- 布局 ---- */
  --spine-w: 240px;
  --topbar-h: 56px;
  --measure: 34em;    /* 正文行长上限，中文约 34 字 */
}

/* ==========================================================================
   基础层
   ========================================================================== */

*, *::before, *::after { box-sizing: border-box; }

/* 显式接管 [hidden]：组件层里 display:grid / flex 的规则与它同优先级，
   靠声明顺序决胜太脆 —— 一处顺序调整就会让「隐藏」失效。 */
[hidden] { display: none !important; }

body {
  margin: 0;
  /* 仅 PC（PRD §2）。低于 1280 时横向滚动，不做响应式折叠。 */
  min-width: 1280px;
  font-family: var(--font-ui);
  font-size: var(--t-base);
  line-height: 1.6;
  color: var(--ink);
  background: var(--ground);
}

h1, h2, h3, h4 { margin: 0; font-weight: 700; line-height: 1.35; }
h1 { font-size: var(--t-2xl); letter-spacing: -0.01em; }
h2 { font-size: var(--t-xl); letter-spacing: -0.01em; }
h3 { font-size: var(--t-lg); }
h4 { font-size: var(--t-md); }
p  { margin: 0; }
ol, ul { margin: 0; padding: 0; list-style: none; }

a { color: var(--brand); text-decoration: none; }
a:hover { text-decoration: underline; }

/* 键盘可见焦点 —— 不是可选项 */
:focus-visible {
  outline: 2px solid var(--brand);
  outline-offset: 2px;
  border-radius: var(--r-control);
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: 0.01ms !important;
    transition-duration: 0.01ms !important;
  }
}

/* 数字：衬线 + 表格数字（列对齐） */
.num {
  font-family: var(--font-num);
  font-variant-numeric: lining-nums tabular-nums;
  letter-spacing: 0.01em;
}

.meta { font-size: var(--t-sm); color: var(--muted); }
.hint { font-size: var(--t-sm); color: var(--muted); }
.prose { line-height: 1.75; max-width: var(--measure); }

/* 页面标题区 */
.page-head {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: var(--s6);
  margin-bottom: var(--s6);
}
.page-lede {
  margin-top: var(--s2);
  font-size: 14px;
  color: var(--muted);
  max-width: 62em;
}
.page-head-actions { display: flex; gap: var(--s2); flex: none; padding-top: var(--s1); }

/* ==========================================================================
   组件层
   ========================================================================== */

/* ---- 外壳：脊 + 工作区 ---- */
.shell {
  display: grid;
  grid-template-columns: var(--spine-w) 1fr;
  min-height: 100vh;
}

.spine {
  display: flex;
  flex-direction: column;
  background: var(--navy);
  color: rgba(255, 255, 255, 0.78);
}

.spine-head {
  padding: var(--s5) var(--s5) var(--s5);
  border-bottom: 1px solid var(--navy-line);
}
.spine-mark {
  font-size: var(--t-lg);
  font-weight: 700;
  color: #fff;
  letter-spacing: 0.01em;
}
.spine-sub {
  margin-top: 2px;
  font-size: var(--t-xs);
  color: rgba(255, 255, 255, 0.5);
  letter-spacing: 0.06em;
}

.spine-nav { flex: 1; padding: var(--s4) 0; }
.nav-item {
  display: flex;
  align-items: center;
  gap: var(--s3);
  height: 38px;
  padding: 0 var(--s5);
  border-left: 3px solid transparent;
  font-size: 14px;
  color: rgba(255, 255, 255, 0.74);
}
.nav-item:hover {
  background: rgba(255, 255, 255, 0.05);
  color: #fff;
  text-decoration: none;
}
.nav-item.is-active {
  background: rgba(255, 255, 255, 0.08);
  border-left-color: var(--brand-lift);
  color: #fff;
  font-weight: 600;
}

.spine-foot {
  padding: var(--s4) var(--s5) var(--s5);
  border-top: 1px solid var(--navy-line);
}
.spine-user {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: var(--s2);
  margin-bottom: var(--s3);
}
.spine-username { font-size: 14px; color: #fff; }
.spine-role { font-size: var(--t-xs); color: rgba(255, 255, 255, 0.5); }

.workspace { display: flex; flex-direction: column; min-width: 0; }

.topbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: var(--s4);
  height: var(--topbar-h);
  padding: 0 var(--s7);
  background: var(--paper);
  border-bottom: 1px solid var(--line);
  flex: none;
}
.topbar-context { display: flex; align-items: baseline; gap: var(--s3); min-width: 0; }
.topbar-title { font-size: 14px; font-weight: 600; color: var(--ink); }

.main {
  flex: 1;
  padding: var(--s7) var(--s7) var(--s9);
  max-width: 1240px;
  width: 100%;
}

/* ---- 面板：内容块是纸，不是卡片 ---- */
.panel {
  background: var(--paper);
  border: 1px solid var(--line);
  border-radius: var(--r-surface);
}
.panel + .panel { margin-top: var(--s5); }
.panel-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: var(--s4);
  padding: var(--s4) var(--s5);
  border-bottom: 1px solid var(--line-soft);
}
.panel-title { font-size: var(--t-base); font-weight: 600; color: var(--ink); }
.panel-note { font-size: var(--t-sm); color: var(--muted); }
.panel-body { padding: var(--s5); }
.panel-body--flush { padding: 0; }
.panel-foot {
  padding: var(--s4) var(--s5);
  border-top: 1px solid var(--line-soft);
  display: flex;
  justify-content: flex-end;
  gap: var(--s2);
}

/* ---- 表格 ---- */
.table { width: 100%; border-collapse: collapse; }
.table th {
  padding: var(--s3) var(--s5);
  text-align: left;
  font-size: var(--t-sm);
  font-weight: 600;
  color: var(--ink-soft);
  background: #f7fafc;
  border-bottom: 1px solid var(--line);
  white-space: nowrap;
}
.table td {
  padding: var(--s3) var(--s5);
  border-bottom: 1px solid var(--line-soft);
  vertical-align: middle;
}
.table tbody tr:last-child td { border-bottom: none; }
.table tbody tr:hover { background: #f9fbfd; }
.table .cell-num {
  text-align: right;
  font-family: var(--font-num);
  font-variant-numeric: lining-nums tabular-nums;
}
.table .cell-actions {
  display: flex;
  gap: var(--s1);
  justify-content: flex-end;
  white-space: nowrap;
}
.table strong { font-weight: 600; }

/* ---- 答题进度：一条细条 + 数字。比单纯一个「3 / 8」更能一眼看出有没有答完 ---- */
.progress { display: flex; align-items: center; gap: var(--s2); }
.progress-track {
  flex: none;
  width: 52px;
  height: 4px;
  border-radius: 2px;
  background: #e4eaf1;
  overflow: hidden;
}
.progress-fill { height: 100%; background: var(--brand); }
.progress-value {
  font-family: var(--font-num);
  font-variant-numeric: lining-nums tabular-nums;
  font-size: var(--t-sm);
  color: var(--ink-soft);
  white-space: nowrap;
}

/* ---- 按钮 ---- */
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: var(--s2);
  height: 36px;
  padding: 0 var(--s4);
  border: 1px solid transparent;
  border-radius: var(--r-control);
  font-family: inherit;
  font-size: 14px;
  font-weight: 600;
  line-height: 1;
  cursor: pointer;
  white-space: nowrap;
  transition: background-color 0.12s ease, border-color 0.12s ease;
}
.btn:disabled { cursor: not-allowed; opacity: 0.5; }

.btn--primary { background: var(--brand); color: #fff; }
.btn--primary:hover:not(:disabled) { background: var(--brand-deep); }

.btn--ghost {
  background: var(--paper);
  border-color: var(--line);
  color: var(--ink);
}
.btn--ghost:hover:not(:disabled) { background: #f4f7fa; }

.btn--danger { background: var(--danger); color: #fff; }
.btn--danger:hover:not(:disabled) { background: #8c2416; }

.btn--quiet {
  background: none;
  border-color: transparent;
  color: var(--muted);
  font-weight: 400;
}
.btn--quiet:hover:not(:disabled) { background: #eef2f6; color: var(--ink); }

.btn--wide { width: 100%; }
.btn--sm { height: 30px; padding: 0 var(--s3); font-size: var(--t-sm); }

/* 脊内专用的静音按钮（深底上的次要操作） */
.btn--onspine {
  background: none;
  border-color: var(--navy-line);
  color: rgba(255, 255, 255, 0.72);
  font-weight: 400;
  height: 30px;
  font-size: var(--t-sm);
}
.btn--onspine:hover:not(:disabled) {
  background: var(--navy-raise);
  color: #fff;
}

/* ---- 表单 ---- */
.field { margin-bottom: var(--s5); }
.field-label {
  display: block;
  margin-bottom: var(--s2);
  font-size: var(--t-sm);
  font-weight: 600;
  color: var(--ink-soft);
}
.field-note {
  margin-top: var(--s2);
  font-size: var(--t-xs);
  color: var(--faint);
}
.field-error {
  margin-top: var(--s2);
  font-size: var(--t-xs);
  color: var(--danger);
}

.input, .select, .textarea {
  width: 100%;
  padding: 0 var(--s3);
  height: 36px;
  font-family: inherit;
  font-size: 14px;
  color: var(--ink);
  background: var(--paper);
  border: 1px solid var(--line);
  border-radius: var(--r-control);
}
.textarea { height: auto; padding: var(--s3); line-height: 1.7; resize: vertical; }
.input::placeholder, .textarea::placeholder { color: var(--faint); }
.input:focus, .select:focus, .textarea:focus {
  outline: none;
  border-color: var(--brand);
  box-shadow: 0 0 0 3px var(--brand-wash);
}
.input:disabled, .select:disabled, .textarea:disabled {
  background: #f4f7fa;
  color: var(--muted);
}
.select { cursor: pointer; }

/* ---- 标签 ---- */
.tag {
  display: inline-flex;
  align-items: center;
  height: 22px;
  padding: 0 var(--s2);
  border: 1px solid transparent;
  border-radius: var(--r-control);
  font-size: var(--t-xs);
  font-weight: 600;
  line-height: 1;
  white-space: nowrap;
}
.tag--draft      { background: #eef2f6; border-color: #dde5ec; color: var(--muted); }
.tag--ongoing    { background: var(--brand-wash); border-color: var(--brand-line); color: var(--brand-deep); }
.tag--completed  { background: #eef2f6; border-color: #dde5ec; color: var(--ink-soft); }
.tag--evaluating { background: var(--watch-wash); border-color: #eadcbe; color: var(--watch); }
.tag--evaluated  { background: var(--pass-wash); border-color: #c6e0d5; color: var(--pass); }
.tag--dim        { background: #f2f6fa; border-color: #e0e8f0; color: var(--ink-soft); }
.tag--off        { background: #eef2f6; border-color: #dde5ec; color: var(--muted); }

.mine-badge { margin-left: var(--s1); font-size: var(--t-xs); color: var(--faint); }

/* ---- 列表 + 案卷：左列选条目，右列看全文 ----
   岗位和面试详情共用这套。JD 与评估维度是成段的内容，塞进表格单元格
   只能靠截断和展开行，两者都不是好读法。 */
.split {
  display: grid;
  grid-template-columns: 300px 1fr;
  gap: var(--s5);
  align-items: start;
}
.split-list {
  background: var(--paper);
  border: 1px solid var(--line);
  border-radius: var(--r-surface);
  overflow: hidden;
}
.split-list-head { padding: var(--s3); border-bottom: 1px solid var(--line-soft); }
.split-list-head .input { height: 32px; }
.split-list-body { max-height: 62vh; overflow-y: auto; }

.split-item {
  display: block;
  width: 100%;
  padding: var(--s3) var(--s4);
  border: none;
  border-left: 3px solid transparent;
  border-bottom: 1px solid var(--line-soft);
  background: none;
  font: inherit;
  text-align: left;
  color: var(--ink);
  cursor: pointer;
}
.split-item:last-child { border-bottom: none; }
.split-item:hover { background: #f7fafc; }
.split-item.is-active { background: var(--brand-wash); border-left-color: var(--brand); }
.split-item-name { font-size: 14px; font-weight: 600; }
.split-item-meta { margin-top: 2px; font-size: var(--t-xs); color: var(--muted); }

.dossier-head {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: var(--s5);
  padding: var(--s5);
  border-bottom: 1px solid var(--line-soft);
}
.dossier-title { font-size: var(--t-xl); font-weight: 700; letter-spacing: -0.01em; }
/* 题干是长句子，不用 22px 粗体 —— 段落级的粗体读起来太压 */
.dossier-question { font-size: 17px; font-weight: 600; line-height: 1.65; max-width: 46em; }
.dossier-meta {
  display: flex;
  align-items: center;
  gap: var(--s3);
  margin-top: var(--s2);
  font-size: var(--t-sm);
  color: var(--muted);
}
.dossier-actions { display: flex; gap: var(--s2); flex: none; }
.dossier-section { padding: var(--s5); }
.dossier-section + .dossier-section { border-top: 1px solid var(--line-soft); }
.dossier-label {
  margin-bottom: var(--s3);
  font-size: var(--t-sm);
  font-weight: 600;
  color: var(--ink-soft);
}
.dossier-text {
  font-size: 14px;
  line-height: 1.8;
  white-space: pre-wrap;
  max-width: 44em;
}
.tag-row { display: flex; flex-wrap: wrap; gap: var(--s2); }

/* ---- 维度编辑器 ---- */
.dim-editor-row {
  display: flex;
  align-items: center;
  gap: var(--s2);
  margin-bottom: var(--s2);
}
.dim-editor-remove {
  flex: none;
  width: 32px;
  height: 32px;
  padding: 0;
  font-size: var(--t-lg);
  line-height: 1;
  color: var(--faint);
}
.dim-editor-remove:hover:not(:disabled) { color: var(--danger); background: var(--danger-wash); }

/* ---- 筛选栏 ---- */
.filterbar {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: var(--s2);
  padding: var(--s3) var(--s5);
  border-bottom: 1px solid var(--line-soft);
  background: #fafcfe;
}
.filterbar .input,
.filterbar .select {
  width: auto;
  min-width: 116px;
  height: 32px;
  font-size: var(--t-sm);
}
.filterbar-grow { flex: 1; }
.filterbar-count { margin-left: auto; font-size: var(--t-sm); color: var(--muted); }

/* ---- 列表更宽的变体（题库的题干较长，左列放不下 300px） ---- */
.split--wide { grid-template-columns: 384px 1fr; }
.split-item-text {
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
  font-size: 14px;
  line-height: 1.6;
  color: var(--ink);
}
.split-item-tags {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: var(--s1);
  margin-top: var(--s2);
}
.split-item-pos { margin-left: var(--s1); font-size: var(--t-xs); color: var(--muted); }

/* ---- 面试详情：题目导航 + 单题编辑 ----
   真实面试是一题一题走的，长滚动列表是错的：HR 要随时知道「问到第几题了」。 */
.detail-layout {
  display: grid;
  grid-template-columns: 268px 1fr;
  gap: var(--s5);
  align-items: start;
  margin-top: var(--s5);
}

.qnav {
  background: var(--paper);
  border: 1px solid var(--line);
  border-radius: var(--r-surface);
  overflow: hidden;
}
.qnav-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: var(--s2);
  padding: var(--s3) var(--s4);
  border-bottom: 1px solid var(--line-soft);
  font-size: var(--t-sm);
  font-weight: 600;
  color: var(--ink-soft);
}
.qnav-count {
  font-family: var(--font-num);
  font-variant-numeric: lining-nums tabular-nums;
  font-weight: 400;
  color: var(--muted);
}
.qnav-list { max-height: 60vh; overflow-y: auto; }

.qnav-item {
  display: grid;
  grid-template-columns: 20px 1fr auto;
  align-items: center;
  gap: var(--s2);
  width: 100%;
  padding: var(--s3) var(--s4);
  border: none;
  border-left: 3px solid transparent;
  border-bottom: 1px solid var(--line-soft);
  background: none;
  font: inherit;
  text-align: left;
  color: var(--ink);
  cursor: pointer;
}
.qnav-item:last-child { border-bottom: none; }
.qnav-item:hover { background: #f7fafc; }
.qnav-item.is-current { background: var(--brand-wash); border-left-color: var(--brand); }
.qnav-num {
  font-family: var(--font-num);
  font-variant-numeric: lining-nums tabular-nums;
  font-size: var(--t-sm);
  color: var(--faint);
}
.qnav-item.is-current .qnav-num { color: var(--brand); }
.qnav-dim {
  font-size: var(--t-sm);
  color: var(--ink-soft);
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.qnav-mark { font-size: var(--t-xs); color: var(--faint); }
.qnav-item.is-answered .qnav-mark { color: var(--pass); font-weight: 600; }

.editor {
  background: var(--paper);
  border: 1px solid var(--line);
  border-radius: var(--r-surface);
  padding: var(--s5);
}
.editor-head { display: flex; align-items: center; gap: var(--s2); }
.editor-seq {
  min-width: 32px;
  font-family: var(--font-num);
  font-variant-numeric: lining-nums tabular-nums;
  font-size: var(--t-lg);
  font-weight: 600;
  color: var(--brand);
}
.editor-question {
  margin-top: var(--s3);
  font-size: 17px;
  font-weight: 600;
  line-height: 1.65;
  max-width: 46em;
}
.editor-answer-head {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: var(--s3);
  margin: var(--s6) 0 var(--s2);
}
.editor .textarea { min-height: 180px; }
.textarea[readonly] { resize: none; background: #fafcfe; color: var(--ink-soft); }
.editor-actions {
  display: flex;
  align-items: center;
  gap: var(--s2);
  margin-top: var(--s3);
}
.editor-pager {
  display: flex;
  justify-content: space-between;
  gap: var(--s2);
  margin-top: var(--s5);
  padding-top: var(--s4);
  border-top: 1px solid var(--line-soft);
}

.save-state { font-size: var(--t-xs); color: var(--faint); }
.save-state.is-saving { color: var(--muted); }
.save-state.is-saved { color: var(--pass); }
.save-state.is-failed { color: var(--danger); font-weight: 600; }

/* ---- 面试详情的参考区：候选人简历 + 作答邀请 ----
   放在作答区下方而不是第三栏：三栏在 1280 宽下会把编辑区挤到 370px。 */
.detail-extras {
  display: grid;
  grid-template-columns: minmax(0, 1fr) 344px;
  gap: var(--s5);
  align-items: start;
  margin-top: var(--s5);
}

.code {
  font-family: var(--font-code);
  font-size: var(--t-sm);
  letter-spacing: 0.02em;
  color: var(--ink);
  word-break: break-all;
}

.invite-item {
  padding: var(--s3) var(--s5) var(--s4);
  border-bottom: 1px solid var(--line-soft);
}
.invite-item:last-child { border-bottom: none; }
.invite-top { display: flex; align-items: center; gap: var(--s2); }
.invite-top .code { flex: 1; min-width: 0; }
.invite-meta {
  display: flex;
  flex-wrap: wrap;
  gap: var(--s3);
  margin-top: var(--s2);
  font-size: var(--t-xs);
  color: var(--muted);
}
.invite-actions { display: flex; gap: var(--s1); flex: none; }
.panel-head-actions { display: flex; gap: var(--s2); flex: none; }

.resume-body {
  max-height: 300px;
  overflow-y: auto;
  padding: var(--s5);
  font-size: 14px;
  line-height: 1.85;
  white-space: pre-wrap;
  color: var(--ink);
}

/* 匹配理由：这是 HR 的评估思路，做成引文样式与题干区分开 */
.match-reason {
  margin-top: var(--s4);
  padding: var(--s3) var(--s4);
  border-left: 3px solid var(--brand-line);
  background: var(--brand-wash);
  border-radius: 0 var(--r-control) var(--r-control) 0;
  font-size: var(--t-sm);
  line-height: 1.75;
  color: var(--brand-deep);
  max-width: 46em;
}
.match-reason b { font-weight: 600; }

/* ---- 单选题的选项（只读视图：标出参考答案是哪一项） ---- */
.option-list {
  border: 1px solid var(--line-soft);
  border-radius: var(--r-control);
  overflow: hidden;
}
.option-item {
  display: flex;
  align-items: flex-start;
  gap: var(--s3);
  padding: var(--s3) var(--s4);
  font-size: 14px;
  line-height: 1.6;
  border-top: 1px solid var(--line-soft);
}
.option-item:first-child { border-top: none; }
.option-key {
  flex: none;
  width: 18px;
  font-family: var(--font-num);
  font-variant-numeric: lining-nums tabular-nums;
  color: var(--faint);
}
.option-item.is-correct { background: var(--brand-wash); }
.option-item.is-correct .option-key { color: var(--brand); }
.option-flag {
  flex: none;
  margin-left: auto;
  font-size: var(--t-xs);
  font-weight: 600;
  color: var(--brand-deep);
}

/* ---- 选项编辑器 ---- */
.choice-row {
  display: flex;
  align-items: center;
  gap: var(--s2);
  margin-bottom: var(--s2);
}
.choice-key {
  flex: none;
  width: 18px;
  font-family: var(--font-num);
  font-variant-numeric: lining-nums tabular-nums;
  font-size: var(--t-sm);
  color: var(--faint);
}

/* ---- 分段控件（题型这种二选一、且会改变表单结构的选择） ---- */
.seg {
  display: inline-flex;
  border: 1px solid var(--line);
  border-radius: var(--r-control);
  overflow: hidden;
}
.seg-btn {
  height: 34px;
  padding: 0 var(--s4);
  border: none;
  background: var(--paper);
  font-family: inherit;
  font-size: 14px;
  color: var(--ink-soft);
  cursor: pointer;
}
.seg-btn + .seg-btn { border-left: 1px solid var(--line); }
.seg-btn:hover:not(:disabled) { background: #f4f7fa; }
.seg-btn.is-on { background: var(--brand); color: #fff; font-weight: 600; }
.seg-btn:disabled { cursor: not-allowed; opacity: 0.5; }

/* ---- 弹窗里的两列表单 ---- */
.form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0 var(--s4); }
.form-grid .field { min-width: 0; }
.form-grid-3 { grid-template-columns: 1fr 1fr 1fr; }
.form-grid-full { grid-column: 1 / -1; }

.meta-row {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: var(--s2);
  margin-top: var(--s3);
  font-size: var(--t-sm);
  color: var(--muted);
}


/* ---- 空态 / 加载 ---- */
.empty {
  padding: var(--s9) var(--s5);
  text-align: center;
  color: var(--muted);
  font-size: 14px;
}
.empty-title { font-size: var(--t-md); font-weight: 600; color: var(--ink); margin-bottom: var(--s2); }
.empty-action { margin-top: var(--s5); display: flex; justify-content: center; }

.spinner {
  width: 20px;
  height: 20px;
  border: 2px solid var(--line);
  border-top-color: var(--brand);
  border-radius: 50%;
  animation: spin 0.7s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }

/* ---- 弹窗：真正浮起来的层 ---- */
.modal-overlay {
  position: fixed;
  inset: 0;
  background: rgba(18, 40, 63, 0.42);
  display: flex;
  align-items: flex-start;
  justify-content: center;
  padding: 9vh var(--s6) var(--s6);
  z-index: 40;
}
.modal {
  width: 100%;
  max-width: 460px;
  background: var(--paper);
  border-radius: var(--r-surface);
  box-shadow: var(--shadow-float);
  overflow: hidden;
}
.modal--wide { max-width: 720px; }
.modal-head {
  padding: var(--s5);
  border-bottom: 1px solid var(--line-soft);
}
.modal-title { font-size: var(--t-md); font-weight: 700; }
.modal-body { padding: var(--s5); max-height: 66vh; overflow-y: auto; }
.modal-foot {
  padding: var(--s4) var(--s5);
  border-top: 1px solid var(--line-soft);
  display: flex;
  justify-content: flex-end;
  gap: var(--s2);
  background: #fafcfe;
}

/* ---- Toast ---- */
.toast-stack {
  position: fixed;
  top: var(--s5);
  right: var(--s5);
  display: flex;
  flex-direction: column;
  gap: var(--s2);
  z-index: 60;
}
.toast {
  padding: var(--s3) var(--s4);
  min-width: 220px;
  max-width: 380px;
  background: var(--navy);
  color: #fff;
  font-size: 14px;
  border-radius: var(--r-control);
  box-shadow: var(--shadow-float);
  transition: opacity 0.2s ease;
}
.toast--success { background: var(--pass); }
.toast--error { background: var(--danger); }

/* ---- 状态轨：面试的真实流程，不是装饰性步骤条 ---- */
.rail {
  display: flex;
  background: var(--paper);
  border: 1px solid var(--line);
  border-radius: var(--r-surface);
  overflow: hidden;
}
.rail-step {
  position: relative;
  flex: 1;
  padding: var(--s3) var(--s5) var(--s4);
  border-left: 1px solid var(--line-soft);
}
.rail-step:first-child { border-left: none; }
.rail-index {
  font-family: var(--font-num);
  font-variant-numeric: lining-nums tabular-nums;
  font-size: var(--t-sm);
  color: var(--faint);
  margin-right: var(--s2);
}
.rail-label { font-size: 14px; color: var(--faint); }
.rail-bar {
  position: absolute;
  left: 0; right: 0; bottom: 0;
  height: 3px;
  background: var(--line-soft);
}
.rail-step.is-done .rail-label { color: var(--ink-soft); }
.rail-step.is-done .rail-index { color: var(--muted); }
.rail-step.is-done .rail-bar { background: var(--brand); }
.rail-step.is-current { background: var(--brand-wash); }
.rail-step.is-current .rail-label { color: var(--brand-deep); font-weight: 700; }
.rail-step.is-current .rail-index { color: var(--brand); }
.rail-step.is-current .rail-bar { background: var(--brand); }

/* ==========================================================================
   页面层
   ========================================================================== */

/* ---- 登录页：左侧是产品的真实流程，右侧是表单 ---- */
.login {
  display: grid;
  grid-template-columns: minmax(500px, 46%) 1fr;
  min-height: 100vh;
}
.login-aside {
  background: var(--navy);
  color: #fff;
  padding: var(--s9) var(--s8);
  display: flex;
  flex-direction: column;
}
.login-mark {
  font-size: var(--t-xl);
  font-weight: 700;
  letter-spacing: 0.01em;
}
.login-mark-sub {
  margin-top: var(--s1);
  font-size: var(--t-xs);
  color: rgba(255, 255, 255, 0.5);
  letter-spacing: 0.06em;
}
.login-claim {
  margin-top: var(--s8);
  font-size: var(--t-2xl);
  line-height: 1.5;
  color: #fff;
}
/* 换行位置是写死的，不让浏览器在「同一 / 处」之间断开 */
.login-claim span { display: block; }
.login-flow { margin-top: var(--s8); max-width: 34em; }
.login-flow-item {
  display: grid;
  grid-template-columns: 32px 1fr;
  gap: var(--s4);
  padding: var(--s4) 0;
  border-top: 1px solid var(--navy-line);
}
.login-flow-item:last-child { border-bottom: 1px solid var(--navy-line); }
.login-flow-index {
  font-family: var(--font-num);
  font-variant-numeric: lining-nums tabular-nums;
  font-size: var(--t-lg);
  color: var(--brand-lift);
  line-height: 1.4;
}
.login-flow-label { font-size: 14px; font-weight: 600; color: #fff; }
.login-flow-text {
  margin-top: var(--s1);
  font-size: var(--t-sm);
  color: rgba(255, 255, 255, 0.62);
  line-height: 1.7;
}
.login-aside-foot {
  margin-top: auto;
  padding-top: var(--s7);
  font-size: var(--t-xs);
  color: rgba(255, 255, 255, 0.42);
}
.login-main {
  display: flex;
  align-items: center;
  justify-content: center;
  padding: var(--s8);
  background: var(--paper);
}
.login-card { width: 100%; max-width: 372px; }
.login-card > h2 { font-size: var(--t-xl); }
.login-card-lede { margin: var(--s2) 0 var(--s7); font-size: 14px; color: var(--muted); }
/* ---- 提示条：说明「接下来会发生什么」，既不是错误也不是警告 ---- */
.note-box {
  padding: var(--s3) var(--s4);
  background: var(--brand-wash);
  border: 1px solid var(--brand-line);
  border-radius: var(--r-control);
  font-size: var(--t-sm);
  line-height: 1.6;
  color: var(--brand-deep);
  /* 一句话的提示条不该横跨 1100px —— 那看着像空横幅 */
  max-width: 46em;
}
.login-card .note-box { margin-top: var(--s6); }

/* ---- 评估报告 ----
   报告的读法是「先结论后证据」：头版给总分与综合结论，右侧是维度形状；
   再往下才是逐题评分这条证据链。
   维度分**不再单出一张表** —— 雷达图的图例每行直接带该维度的评语，
   图给形状、给一眼的比较，图例给数值、给理由，两者是同一件事的两面。
   （PRD §4.12 里 DOCX 的「多维评分表」是那份文件的要求，屏幕上不必照抄。） */
.report-head { display: grid; grid-template-columns: minmax(0, 1fr) 400px; }
.report-head-main { padding: var(--s6); }
/* 图表比左边那一栏矮（4 维的图例横跨底部），居中放，免得顶部堆一块、下面空一块 */
.report-head-side {
  display: flex;
  flex-direction: column;
  justify-content: center;
  padding: var(--s5) var(--s6);
  border-left: 1px solid var(--line-soft);
}

/* 评估进行中时总分还没算出来：给一个小字占位并占住 56px 的高度，
   免得整块在分数落地那一刻跳一下。这里不能用一个 56px 的「—」——
   那个字形在这个字号下就是一条灰杠，读起来像进度条。 */
.report-score { display: flex; align-items: baseline; gap: var(--s2); min-height: var(--t-hero); }
.report-score-pending { font-size: var(--t-xl); font-weight: 600; color: var(--faint); }
.report-score-value {
  font-family: var(--font-num);
  font-variant-numeric: lining-nums tabular-nums;
  font-size: var(--t-hero);
  font-weight: 700;
  line-height: 1;
  letter-spacing: -0.01em;
}
.report-score-value.is-pass { color: var(--pass); }
.report-score-value.is-watch { color: var(--watch); }
.report-score-unit { font-family: var(--font-num); font-size: var(--t-lg); color: var(--muted); }
.report-score-scale { margin-top: var(--s3); font-size: var(--t-sm); color: var(--muted); }
.report-conclusion {
  margin-top: var(--s5);
  padding-top: var(--s5);
  border-top: 1px solid var(--line-soft);
  font-size: 17px;
  line-height: 1.8;
  max-width: 32em;
}

/* 优点 / 待改进：结论正下方的两块，用分数带的方向做标记 —— 与评分的颜色同源 */
.report-finds {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 0 var(--s6);
  margin-top: var(--s5);
  padding-top: var(--s5);
  border-top: 1px solid var(--line-soft);
}
.find-list { display: flex; flex-direction: column; gap: var(--s3); }
.find-item {
  padding-left: var(--s3);
  border-left: 3px solid var(--line);
  font-size: 14px;
  line-height: 1.75;
}
.find-item.is-pass { border-left-color: var(--pass); }
.find-item.is-watch { border-left-color: var(--watch); }

/* 评估三步：真正有先后的过程，因此编号是在编码顺序而不是装饰 */
.stage-list { margin-top: var(--s5); border-top: 1px solid var(--line-soft); }
.stage-list li {
  display: grid;
  grid-template-columns: 26px 1fr;
  gap: var(--s4);
  padding: var(--s3) 0;
  border-bottom: 1px solid var(--line-soft);
}
.stage-list-index {
  font-family: var(--font-num);
  font-variant-numeric: lining-nums tabular-nums;
  font-size: var(--t-lg);
  color: var(--brand);
  line-height: 1.4;
}
.stage-list-label { font-size: 14px; font-weight: 600; }
.stage-list-text { margin-top: var(--s1); font-size: var(--t-sm); line-height: 1.7; color: var(--muted); }

/* 逐题评分：一条可以逐条核对的证据链 */
.score-item { padding: var(--s5); border-top: 1px solid var(--line-soft); }
.score-item:first-child { border-top: none; }
.score-item-head { display: flex; align-items: center; gap: var(--s3); }
.score-seq {
  min-width: 26px;
  font-family: var(--font-num);
  font-variant-numeric: lining-nums tabular-nums;
  font-size: var(--t-lg);
  font-weight: 600;
  color: var(--brand);
}
.score-value {
  margin-left: auto;
  font-family: var(--font-num);
  font-variant-numeric: lining-nums tabular-nums;
  font-size: var(--t-xl);
  font-weight: 700;
  line-height: 1;
}
.score-value.is-pass { color: var(--pass); }
.score-value.is-watch { color: var(--watch); }
.score-question { margin-top: var(--s3); font-size: var(--t-base); font-weight: 600; line-height: 1.7; max-width: 46em; }
.score-comment { margin-top: var(--s3); font-size: 14px; line-height: 1.8; max-width: 44em; }

/* 回答与评估意见各自成块：两块长得像，靠标题分开，不靠猜 */
.score-block,
.prep-field { margin-top: var(--s4); }
.score-block .dossier-label,
.prep-field .dossier-label { margin-bottom: var(--s2); }
.score-block .answer-quote,
.prep-field .score-comment { margin-top: 0; }

.answer-quote {
  margin-top: var(--s2);
  padding: var(--s3) var(--s4);
  background: #f7fafc;
  border: 1px solid var(--line-soft);
  border-radius: var(--r-control);
  font-size: 14px;
  line-height: 1.8;
  white-space: pre-wrap;
  color: var(--ink-soft);
  max-width: 48em;
}
.answer-quote.is-blank { color: var(--muted); }

/* 评估流：只有一条状态行。不做三段的步骤条 ——
   逐题分数自己就是进度，再画一遍是把同一件事说两次。 */
.stream-note {
  display: flex;
  align-items: center;
  gap: var(--s3);
  padding: var(--s3) var(--s5);
  border-bottom: 1px solid var(--line-soft);
  background: #fafcfe;
  font-size: var(--t-sm);
  color: var(--ink-soft);
}
.stream-note.is-failed {
  background: var(--danger-wash);
  border-bottom-color: var(--danger-line);
  color: var(--danger);
}
.stream-note.is-failed .btn { margin-left: auto; }
.stream-dot {
  flex: none;
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: var(--brand);
  animation: stream-pulse 1.3s ease-in-out infinite;
}
@keyframes stream-pulse { 0%, 100% { opacity: 0.3; } 50% { opacity: 1; } }
.stream-count {
  margin-left: auto;
  font-family: var(--font-num);
  font-variant-numeric: lining-nums tabular-nums;
  color: var(--muted);
}

/* 新到的一条只在落地那一下动一次，之后完全安静 */
.just-arrived { animation: arrive 0.28s ease-out; }
@keyframes arrive { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }

/* ---- 雷达图 + 维度图例 ---- */
.radar { display: block; width: 100%; height: auto; }
.radar-grid { fill: none; stroke: var(--line-soft); }
.radar-spoke { stroke: var(--line-soft); }
.radar-area { stroke-width: 2; }
.radar-area.is-pass { fill: var(--pass); fill-opacity: 0.12; stroke: var(--pass); }
.radar-area.is-watch { fill: var(--watch); fill-opacity: 0.12; stroke: var(--watch); }
.radar-dot { stroke: var(--paper); stroke-width: 1.5; }
.radar-dot.is-pass { fill: var(--pass); }
.radar-dot.is-watch { fill: var(--watch); }
.radar-label { font-family: var(--font-ui); font-size: var(--t-xs); fill: var(--muted); }
.radar-hint { padding: var(--s5) 0; font-size: var(--t-sm); color: var(--muted); text-align: center; }

/* 维度图例：横跨面板底部的一行。图给形状，图例给数值与理由。
   auto-fit 是为了让 3–6 个维度都排得下 —— 维度数是岗位定的，不是设计定的。 */
.dim-legend {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
  gap: var(--s4) var(--s6);
  padding: var(--s5) var(--s6) var(--s4);
  border-top: 1px solid var(--line-soft);
}
.dim-legend-row { min-width: 0; }
.dim-legend-top { display: flex; align-items: baseline; gap: var(--s2); }
.dim-legend-name { font-size: 14px; font-weight: 600; }
.dim-legend-score {
  margin-left: auto;
  font-family: var(--font-num);
  font-variant-numeric: lining-nums tabular-nums;
  font-size: var(--t-md);
  font-weight: 700;
}
.dim-legend-score.is-pass { color: var(--pass); }
.dim-legend-score.is-watch { color: var(--watch); }
.dim-legend-comment { margin-top: var(--s1); font-size: var(--t-sm); line-height: 1.7; color: var(--muted); }

/* 维度不足 3 个时雷达围不出形状 —— 改画横条，不硬凑一个三角形 */
.dim-bars { display: flex; flex-direction: column; gap: var(--s5); }
.dim-bar-top { display: flex; align-items: baseline; gap: var(--s2); }
.dim-bar-track { margin-top: var(--s2); height: 6px; border-radius: 3px; background: #e4eaf1; overflow: hidden; }
.dim-bar-fill { height: 100%; }
.dim-bar-fill.is-pass { background: var(--pass); }
.dim-bar-fill.is-watch { background: var(--watch); }

/* ---- 面试准备助手 ----
   提纲是一份要读的东西，不是一块看板：整页内容收在 1000px 内，
   免得面板横跨 1176px 而正文只占左半边。 */
.prep-page { max-width: 1000px; }

.prep-note {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: var(--s4);
  margin-top: var(--s5);
  padding: var(--s3) var(--s5);
  background: var(--paper);
  border: 1px solid var(--line);
  border-radius: var(--r-surface);
  font-size: var(--t-sm);
  color: var(--muted);
}

.prep-stage {
  display: grid;
  grid-template-columns: 84px 1fr;
  gap: var(--s4);
  padding: var(--s4) var(--s5);
  border-top: 1px solid var(--line-soft);
}
.prep-stage:first-child { border-top: none; }

  font-family: var(--font-num);
  font-variant-numeric: lining-nums tabular-nums;
  font-size: var(--t-sm);
  color: var(--brand);
  white-space: nowrap;
}
.prep-phase { font-size: var(--t-base); font-weight: 600; }
.prep-points { margin-top: var(--s2); display: flex; flex-direction: column; gap: var(--s1); }
.prep-points li { position: relative; padding-left: var(--s4); font-size: 14px; line-height: 1.75; color: var(--ink-soft); }

  position: absolute;
  left: 2px;
  top: 11px;
  width: 6px;
  height: 1px;
  background: var(--faint);
}

.prep-focus { padding: var(--s4) var(--s5); border-top: 1px solid var(--line-soft); }
.prep-focus:first-child { border-top: none; }
.prep-focus-text { margin-top: var(--s2); font-size: 14px; line-height: 1.8; max-width: 46em; }
.prep-focus-why { margin-top: var(--s2); font-size: var(--t-sm); line-height: 1.75; color: var(--muted); max-width: 46em; }

.prep-question { padding: var(--s4) var(--s5); border-top: 1px solid var(--line-soft); }
.prep-question:first-child { border-top: none; }
.prep-question-head { display: grid; grid-template-columns: 26px 1fr; gap: var(--s3); }
.prep-question-text { font-size: var(--t-base); font-weight: 600; line-height: 1.7; max-width: 46em; }
.prep-question-body { margin-top: var(--s3); padding-left: 38px; }
.prep-field + .prep-field { margin-top: var(--s3); }

.prep-edit-block {
  margin-bottom: var(--s3);
  padding: var(--s4);
  border: 1px solid var(--line);
  border-radius: var(--r-control);
}
.prep-edit-head { display: flex; align-items: center; gap: var(--s2); }
.prep-edit-head .input { flex: 1; min-width: 0; }
.prep-edit-head .select { width: auto; flex: none; }
.prep-edit-head .mins { flex: none; width: 92px; }
/* 有内容之后 placeholder 就不显示了，字段靠这行小字认 —— 意图与追问长得太像 */
.prep-edit-tag { flex: none; font-size: var(--t-xs); color: var(--muted); }
.prep-edit-label { margin-bottom: var(--s1); font-size: var(--t-xs); color: var(--muted); }
.prep-edit-add { margin-top: var(--s2); }

/* ==========================================================================
   候选人端
   与 HR 侧共用同一套令牌与组件，只补它没有的三样：练习的筛选与进度、
   作答结果的就地反馈、以及「对 / 错 / 未判分」这三态的表达。
   ========================================================================== */

/* ---- 候选人登录 / 激活卡片上的小件 ---- */

.login-alt-row {
  display: flex;
  align-items: center;
  gap: var(--s2);
  margin-top: var(--s3);
  font-size: var(--t-sm);
  color: var(--muted);
}

/* ---- 筛选栏里的实时计数 ---- */
.practice-count { font-size: var(--t-sm); color: var(--muted); white-space: nowrap; }
.practice-count.is-none { color: var(--watch); }

/* ---- 练习进度：页面级的，因此比列表里的细条宽 ---- */
.practice-progress {
  display: flex;
  align-items: center;
  gap: var(--s3);
  margin-top: var(--s5);

  background: var(--paper);
  border: 1px solid var(--line);
  border-radius: var(--r-surface);
}

  line-height: 1.6;

}

  font-variant-numeric: lining-nums tabular-nums;
  font-size: var(--t-2xl);
  font-weight: 700;
  line-height: 1.15;

.summary-label { margin-top: var(--s2); font-size: var(--t-sm); color: var(--muted); }

.summary-bar-value {
  margin-left: auto;
  font-family: var(--font-num);
  font-variant-numeric: lining-nums tabular-nums;
  font-weight: 700;
}
.summary-bar-track { margin-top: var(--s2); height: 6px; border-radius: 3px; background: #e4eaf1; overflow: hidden; }
.summary-bar-fill { height: 100%; background: var(--brand); }

/* ---- 未实现的模块占位（原型建设期用） ---- */
.placeholder {
  padding: var(--s9) var(--s6);
  text-align: center;
  background: var(--paper);
  border: 1px dashed var(--line);
  border-radius: var(--r-surface);
}

  display: flex;
  align-items: center;
  justify-content: center;
  min-height: 100vh;
  padding: var(--s8);
  background: var(--paper);
}

.placeholder-title { font-size: var(--t-lg); font-weight: 700; }
.placeholder-text {
  margin-top: var(--s3);
  font-size: 14px;
  color: var(--muted);
}

/* ==========================================================================
   打印 —— 「导出 PDF」走浏览器打印（PRD §4.12）。
   后端不生成 PDF，所以这份样式要负责把屏幕上的东西整理成一份能直接交出去的
   纸件：拿掉导航、状态轨与操作栏，保住分数色带与雷达图的颜色（它们是内容，
   不是装饰），并避免一条评分被切在两页之间。
   ========================================================================== */
@media print {
  @page { margin: 16mm; }

  body { min-width: 0; background: #fff; }
  .spine,
  .topbar,
  .rail,
  .page-head-actions,
  .stream-note,
  .toast-stack,
  .modal-overlay,
  .no-print { display: none !important; }

  .shell { display: block; }
  .main { padding: 0; max-width: none; }

  /* 浏览器默认会丢掉背景与浅色填充，那样雷达与分数色带就全白了 */
  * { -webkit-print-color-adjust: exact; print-color-adjust: exact; }

  .panel { border-color: #cbd5e0; }
  .report-head,
  .report-finds { break-inside: avoid; }
  .score-item,
  .dim-legend-row,
  .find-item,
  .prep-stage,
  .prep-focus,
  .prep-question { break-inside: avoid; }

  h1, h2, h3, .panel-title { break-after: avoid; }
}

  function normalizeChoiceFields(questionType, rawOptions, rawAnswer) {
    const cleaned = (rawOptions || []).map((o) => String(o).trim());
    for (const item of cleaned) {
      if (!item) return { error: '选项不能为空' };

      if (cleaned.length < MIN_CHOICE_OPTIONS) return { error: `单选题至少需要 ${MIN_CHOICE_OPTIONS} 个选项` };

      if (!cleaned.includes(answer)) {

      return { options: cleaned, reference_answer: answer };
    }

    if (cleaned.length) return { error: '简答题不应包含选项' };
    return { options: [], reference_answer: answer };
