  /** 按维度轮询抽取，让各维度题数尽量平均（对应后端 _round_robin_pick）。 */
  function roundRobinPick(groups, dimensions, count) {
    const cursors = {};
    for (const dim of dimensions) cursors[dim] = 0;

    const picked = [];
    while (picked.length < count) {
      let progressed = false;
      for (const dim of dimensions) {
        if (picked.length >= count) break;
        const index = cursors[dim];
        if (index < groups[dim].length) {
          picked.push(groups[dim][index]);
          cursors[dim] = index + 1;
          progressed = true;
        }
      }
      if (!progressed) break; // 所有维度都抽空了
    }
    return picked;
  }

  /**
   * 题库抽 5 题 + AI 补足到 8 题（对应后端 _assemble_questions）。
   * need_ai = 3 + (5 - 题库实抽数) —— 总题数恒为 8，题库不足时由 AI 补差额。
   * 候选池按 owner 过滤：谁建的面试，就从谁的题库里抽（后端 list_by_position）。
   */
  function assembleQuestions(position, ownerId) {
    const dimensions = position.evaluation_dimensions;
    if (!dimensions.length) return [];

    const candidates = state.questions
      .filter((q) => q.position_id === position.id && q.created_by === ownerId && dimensions.includes(q.dimension))
      .sort((a, b) => a.id - b.id);

    const groups = {};
    for (const dim of dimensions) groups[dim] = [];
    for (const question of candidates) groups[question.dimension].push(question);

    const picked = roundRobinPick(groups, dimensions, QUESTION_COUNT_FROM_BANK);
    const needAi = QUESTION_COUNT_FROM_AI + (QUESTION_COUNT_FROM_BANK - picked.length);

    const taken = new Set(picked.map((q) => q.content));
    const generated = [];
    for (let i = 0; i < needAi; i += 1) {
      const dimension = dimensions[i % dimensions.length];
      const template = AI_QUESTION_TEMPLATES[i % AI_QUESTION_TEMPLATES.length];
      const render = () => template.replace(/\{dim\}/g, dimension).replace(/\{position\}/g, position.name);

      let content = render();
      let variant = 1;
      while (taken.has(content)) { content = `${render()}（变体${variant}）`; variant += 1; }
      taken.add(content);

      generated.push({
        content,
        dimension,
        difficulty: QUESTION_DIFFICULTIES[i % QUESTION_DIFFICULTIES.length],
        source: 'ai',
      });
    }

    return [
      ...picked.map((q) => ({ question_id: q.id, content: q.content, dimension: q.dimension, source: 'bank' })),
      ...generated.map((g) => ({ question_id: null, ...g })),
    ];
  }

  /* 候选人回答的素材。真实面试里会出现的样子 —— 泛泛的占位文本会让
     作答区、评估与报告比实际更「模板」。 */
  const BANK_ANSWERS = {
    1: '先看监控。我会按接口自身、数据库、下游依赖三段拆开看耗时分布，定位到具体环节再决定动作。上一次类似的情况是慢查询把连接池打满了，补了索引就恢复。',
    2: '我们线上用的是可重复读。真遇到过一次幻读：同一个事务里两次查询的结果集不一致，原因是间隙锁没覆盖到新插入的行，后来把那段逻辑改成显式加锁。',
    3: '我会先要到具体的 SQL 和执行计划，确认优化器有没有真的用上这个索引。常见的是回表代价太高，或者条件列的选择性别太差，优化器认为全表扫描反而更快。',
    4: '做过一版实时对账，评审时被指出上游数据延迟不可控。我拉了一段真实数据核对，发现延迟分布确实到分钟级，就改成准实时加定时兜底。',
    5: '我会先问他导出来是给谁看、要解决什么问题。有一次用户的真实需求是要给财务做月度核对，其实缺的是一个定时报表，不是导出按钮。',
    6: '我会约他一起把「做不了」拆开：是排期紧，还是方案有技术风险。排期紧就砍范围先上核心链路，风险高就一起找替代方案。',
    7: '先看埋点和口径有没有变。我遇到过一回是发版时漏埋了一个上报点，数据直接掉了两成。确认口径没问题之后，再按渠道和机型去拆。',
    8: '我会拿他熟悉的场景举例，比如人均下单金额被几个大客户拉高了，中位数才接近大多数用户的真实感受。',
    9: '我会先录一段 Performance，看主线程有没有长任务。如果时间主要花在 Recalculate Style 上，那就是布局抖动，一般是频繁读 offsetHeight 触发的强制同步布局。',
    10: '组件卸载时没有解绑挂在 window 上的监听，整棵组件树都会被全局对象引用住，回收不掉。',
    11: '邀请码要用足够熵的随机串，不能从自增 ID 或时间戳派生，否则拿到一个就能推出下一个。接受的时候用事务把状态从 pending 改成 accepted，保证只能用一次。',
    12: '我会先把他的目标问清楚：他要的到底是哪个结果。然后把我说的「不划算」拆成具体代价，比如后续每次需求都要额外改一遍这个模块。把代价讲具体之后，分歧往往就变成了取舍问题，能一起找第三条路。',
    13: '我们当时按用户 ID 取模分了 16 片，因为绝大多数查询都带用户维度。扩容走双写加灰度读：先加新分片同时写两边，再把读流量一点点切过去，观察一周没问题才停旧分片的写。跨片的分页查询最麻烦，最后单独做了一张汇总表。',
    14: '先看超时的时间分布，有没有集中在某个时间点或某个版本之后；再对比超时请求与正常请求在下游调用上的差异，重点怀疑连接池。我们那次最后发现是连接池配小了，而重试把压力放大成了雪崩 —— 所以「重试能好」本身不是结论。',
  };

  const DIMENSION_ANSWERS = {
    沟通能力: '我习惯先把结论和影响面说清楚，再讲过程。跨团队的时候会提前把接口和边界写成文档，避免口头对齐出偏差。',
    专业能力: '我会先把问题拆成能独立验证的几部分，逐个排掉，最后再合起来看整体表现，而不是一上来就改线上。',
    逻辑思维: '我会先列出自己的假设，再设计一个能证伪它的最小实验，而不是直接动手改。',
    文化契合: '我更看重能不能把问题讲透。团队里有人指出我没想到的点，我会先接受再讨论，而不是先辩护。',
    需求洞察: '我会去看用户实际怎么用，而不是只听他说想要什么。行为比表述可靠。',
    工程素养: '我会先写一个能稳定复现的最小例子，再动手改。没有复现步骤的话，修好了也说不清是不是修对了。',
  };

  /** 按真实出题组装规则，为种子面试生成题目与已作答部分。 */
  function seedInterviews() {
    for (const interview of state.interviews) {
      const position = state.positions.find((p) => p.id === interview.position_id);
      interview.questions = assembleQuestions(position, interview.created_by).map((item, index) => {
        const answered = index < interview.answered;
        return {
          interview_question_id: interview.id * 100 + index + 1,
          seq: index + 1,
          content: item.content,
          dimension: item.dimension,
          source: item.source,
          question_id: item.question_id,
          answer: answered ? (item.question_id ? BANK_ANSWERS[item.question_id] : DIMENSION_ANSWERS[item.dimension]) ?? null : null,
          recorded_at: answered ? interview.created_at : null,
          answer_source: answered ? 'hr' : null,
        };
      });
    }
  }
  seedInterviews();

  /** 原型开关：让依赖 AI 的接口失败，用来走查错误态。?fail=ai 或 localStorage。 */
  function aiFails() {
    if (/[?&]fail=ai(&|$)/.test(location.search)) return true;
    try { return localStorage.getItem('prototype.failAI') === '1'; } catch { return false; }
  }
  exports.setFailAI = function (on) {
    try { on ? localStorage.setItem('prototype.failAI', '1') : localStorage.removeItem('prototype.failAI'); } catch {}
  };

  function visibleInterviews(user) {
    return user.role === 'admin'
      ? state.interviews
      : state.interviews.filter((i) => i.created_by === user.id);
  }

  function locateInterview(user, id) {
    const row = state.interviews.find((i) => i.id === Number(id));
    if (!row) return { error: fail(404, 'NOT_FOUND', '面试不存在') };
    if (user.role !== 'admin' && row.created_by !== user.id) {
      return { error: fail(403, 'FORBIDDEN', '无权限访问该面试') };
    }
    return { row };
  }

  function interviewListItem(interview) {
    const position = state.positions.find((p) => p.id === interview.position_id);
    const questions = interview.questions || [];
    return {
      id: interview.id,
      position_id: interview.position_id,
      position_name: position?.name ?? '—',
      candidate_name: interview.candidate_name,
      candidate_contact: interview.candidate_contact,
      status: interview.status,
      created_at: interview.created_at,
      completed_at: interview.completed_at,
      question_count: questions.length,
      answered_count: questions.filter((q) => q.answer).length,
    };
  }

  function interviewDetail(interview) {
    return {
      ...interviewListItem(interview),
      jd: state.positions.find((p) => p.id === interview.position_id)?.jd ?? '',
      evaluation_dimensions: state.positions.find((p) => p.id === interview.position_id)?.evaluation_dimensions ?? [],
      questions: (interview.questions || []).map((q) => ({
        interview_question_id: q.interview_question_id,
        seq: q.seq,
        content: q.content,
        dimension: q.dimension,
        source: q.source,
        answer: q.answer,
        recorded_at: q.recorded_at,
        answer_source: q.answer_source,
        match_reason: q.match_reason ?? null,
      })),
      resume_id: interview.resume_id ?? null,
    };
  }

  on('GET', '/interviews', ({ user }) => {
    const denied = requireLogin(user);
    if (denied) return denied;
    const rows = visibleInterviews(user).slice()
      .sort((a, b) => (a.created_at < b.created_at ? 1 : -1)); // 新的在前
    return ok(rows.map(interviewListItem));
  });

  on('POST', '/interviews', ({ user, body }) => {
    const denied = requireLogin(user);
    if (denied) return denied;

    const fields = [];
    const name = String(body?.candidate_name ?? '').trim();
    const contact = String(body?.candidate_contact ?? '').trim();
    if (!name) fields.push({ field: 'candidate_name', message: '请填写候选人姓名' });
    else if (name.length > 100) fields.push({ field: 'candidate_name', message: '候选人姓名不能超过 100 个字符' });
    if (contact.length > 200) fields.push({ field: 'candidate_contact', message: '联系方式不能超过 200 个字符' });
    if (fields.length) return fail(400, 'VALIDATION_ERROR', '请求参数不合法', { fields });

    const position = state.positions.find((p) => p.id === Number(body?.position_id));
    if (!position) return fail(404, 'NOT_FOUND', '岗位不存在');
    if (user.role !== 'admin' && position.created_by !== user.id) {
      return fail(403, 'FORBIDDEN', '无权限访问该岗位');
    }
    if (!position.evaluation_dimensions.length) {
      return fail(409, 'BUSINESS_ERROR', '岗位未定义评估维度，无法出题');
    }
    // AI 出题失败 → 整体回滚，面试不落库（后端 create_interview 是单事务）
    if (aiFails()) return fail(502, 'AI_PROVIDER_ERROR', 'AI 服务调用失败，请稍后重试');

    const interview = {
      id: seq.interview++,
      position_id: position.id,
      candidate_name: name,
      candidate_contact: contact || null,
      status: 'ongoing',
      created_at: new Date().toISOString(),
      completed_at: null,
      created_by: user.id,
      resume_id: null,
    };
    interview.questions = assembleQuestions(position, user.id).map((item, index) => ({
      interview_question_id: interview.id * 100 + index + 1,
      seq: index + 1,
      content: item.content,
      dimension: item.dimension,
      source: item.source,
      answer: null,
      recorded_at: null,
      answer_source: null,
    }));

    state.interviews.push(interview);
    return created(interviewDetail(interview));
  });

  on('GET', '/interviews/:id', ({ user, params }) => {
    const denied = requireLogin(user);
    if (denied) return denied;
    const located = locateInterview(user, params.id);
    return located.error || ok(interviewDetail(located.row));
  });

  /* ---- 状态迁移与作答 ---- */

  const STATUS_LABELS = {
    draft: '草稿', ongoing: '进行中', completed: '已完成',
    evaluating: '评估中', evaluated: '已评估',
  };
  /* 与后端 _ALLOWED_TRANSITIONS 逐条一致 —— 注意「评估中」不能直接回退到「进行中」。 */
  const ALLOWED_TRANSITIONS = {
    draft: ['ongoing'],
    ongoing: ['completed'],
    completed: ['evaluating', 'ongoing'],
    evaluating: ['evaluated', 'completed'],
    evaluated: ['evaluating', 'ongoing'],
  };

  function assertTransition(from, to) {
    if ((ALLOWED_TRANSITIONS[from] || []).includes(to)) return null;
    return fail(
      409, 'BUSINESS_ERROR',
      `不允许从「${STATUS_LABELS[from] ?? from}」迁移到「${STATUS_LABELS[to] ?? to}」`,
      { from, to },
    );
  }

  on('PATCH', '/interviews/:id', ({ user, body, params }) => {
    const denied = requireLogin(user);
    if (denied) return denied;

    const located = locateInterview(user, params.id);
    if (located.error) return located.error;
    // 评估中或已评估时不允许改候选人信息 —— 报告已经引用了它
    if (located.row.status === 'evaluating' || located.row.status === 'evaluated') {
      return fail(409, 'BUSINESS_ERROR', '评估中或已评估的面试不可修改候选人信息');
    }

    const fields = [];
    const name = String(body?.candidate_name ?? '').trim();
    const contact = String(body?.candidate_contact ?? '').trim();
    if (!name) fields.push({ field: 'candidate_name', message: '请填写候选人姓名' });
    else if (name.length > 100) fields.push({ field: 'candidate_name', message: '候选人姓名不能超过 100 个字符' });
    if (contact.length > 200) fields.push({ field: 'candidate_contact', message: '联系方式不能超过 200 个字符' });
    if (fields.length) return fail(400, 'VALIDATION_ERROR', '请求参数不合法', { fields });

    located.row.candidate_name = name;
    located.row.candidate_contact = contact || null;
    return ok(interviewDetail(located.row));
  });

  on('POST', '/interviews/:id/answers', ({ user, body, params }) => {
    const denied = requireLogin(user);
    if (denied) return denied;

    const located = locateInterview(user, params.id);
    if (located.error) return located.error;

    // 只有进行中才可改作答 —— 保证评估依据不被篡改（HR 交卷后仍可改，候选人侧才锁定）
    if (located.row.status !== 'ongoing') {
      return fail(409, 'BUSINESS_ERROR', '当前状态下不可修改回答，请先回退到进行中');
    }

    const item = (located.row.questions || [])
      .find((q) => q.interview_question_id === Number(body?.interview_question_id));
    if (!item) return fail(404, 'NOT_FOUND', '题目不属于该面试');
    if (String(body?.content ?? '').length > 10000) {
      return fail(400, 'VALIDATION_ERROR', '回答不能超过 10000 个字符');
    }

    const content = String(body?.content ?? '');
    item.answer = content === '' ? null : content;
    item.recorded_at = content === '' ? null : new Date().toISOString();
    // answer_source 保留「最初从哪条通道进来」——HR 覆盖候选人作答后来源仍是 candidate
    item.answer_source = item.answer_source || 'hr';

    return ok({ ...item, match_reason: item.match_reason ?? null });
  });

  on('POST', '/interviews/:id/complete', ({ user, params }) => {
    const denied = requireLogin(user);
    if (denied) return denied;

    const located = locateInterview(user, params.id);
    if (located.error) return located.error;

    const bad = assertTransition(located.row.status, 'completed');
    if (bad) return bad;

    located.row.status = 'completed';
    located.row.completed_at = new Date().toISOString();
    return ok(interviewDetail(located.row));
  });

  on('POST', '/interviews/:id/rollback', ({ user, params }) => {
    const denied = requireLogin(user);
    if (denied) return denied;

    const located = locateInterview(user, params.id);
    if (located.error) return located.error;

    const bad = assertTransition(located.row.status, 'ongoing');
    if (bad) return bad;

    located.row.status = 'ongoing';
    located.row.completed_at = null;
    return ok(interviewDetail(located.row));
  });

  /* ---- resumes / invitations / 按简历补题 ---- */

  function locateResume(resumeId) {
    return state.resumes.find((r) => r.id === Number(resumeId)) || null;
  }

  /** 派生 expired —— 不回写（后端 _derive_status 同一原则）。 */
  function deriveInvitationStatus(invitation) {
    if (invitation.status === 'pending' && new Date(invitation.expires_at) < new Date()) return 'expired';
    return invitation.status;
  }

  function invitationView(invitation) {
    const owner = state.users.find((u) => u.id === invitation.candidate_user_id);
    return {
      id: invitation.id,
      interview_id: invitation.interview_id,
      code: invitation.code,
      status: deriveInvitationStatus(invitation),
      expires_at: invitation.expires_at,
      accepted_at: invitation.accepted_at,
      candidate_username: owner ? owner.username : null,
      created_at: invitation.created_at,
    };
  }

  const CODE_ALPHABET = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789-_';
  function generateInviteCode() {
    const bytes = new Uint8Array(22);
    crypto.getRandomValues(bytes);
    let out = '';
    for (const byte of bytes) out += CODE_ALPHABET[byte % CODE_ALPHABET.length];
    return out;
  }

  on('GET', '/interviews/:id/invitations', ({ user, params }) => {
    const denied = requireLogin(user);
    if (denied) return denied;
    const located = locateInterview(user, params.id);
    if (located.error) return located.error;
    const rows = state.invitations
      .filter((i) => i.interview_id === located.row.id)
      .sort((a, b) => (a.created_at < b.created_at ? 1 : -1));
    return ok(rows.map(invitationView));
  });

  on('POST', '/interviews/:id/invitations', ({ user, params }) => {
    const denied = requireLogin(user);
    if (denied) return denied;
    const located = locateInterview(user, params.id);
    if (located.error) return located.error;

    // 面试一旦完成，作答通道本就不接受写入，此时发邀请已无意义
    if (located.row.status !== 'ongoing') {
      return fail(409, 'BUSINESS_ERROR', '当前状态下不可生成邀请，请先将面试置为进行中', {
        status: located.row.status,
      });
    }

    const row = {
      id: seq.invitation++,
      interview_id: located.row.id,
      code: generateInviteCode(),
      status: 'pending',
      candidate_user_id: null,
      expires_at: new Date(Date.now() + 7 * 86400000).toISOString(),
      accepted_at: null,
      created_at: new Date().toISOString(),
      created_by: user.id,
    };
    state.invitations.push(row);
    return created(invitationView(row));
  });

  on('DELETE', '/interviews/:id/invitations/:invitationId', ({ user, params }) => {
    const denied = requireLogin(user);
    if (denied) return denied;
    const located = locateInterview(user, params.id);
    if (located.error) return located.error;

    const invitation = state.invitations.find((i) => i.id === Number(params.invitationId));
    if (!invitation || invitation.interview_id !== located.row.id) {
      return fail(404, 'NOT_FOUND', '邀请不存在');
    }
    // 已撤销的再撤一次是幂等（返回当前状态），不报错
    if (invitation.status === 'revoked') return ok(invitationView(invitation));

    invitation.status = 'revoked';
    return ok(invitationView(invitation));
  });

  on('GET', '/interviews/:id/resume', ({ user, params }) => {
    const denied = requireLogin(user);
    if (denied) return denied;
    const located = locateInterview(user, params.id);
    if (located.error) return located.error;

    if (located.row.resume_id == null) {
      // 404 而非 403：前端据此显示「候选人尚未提交简历」，不是「无权限」
      return fail(404, 'NOT_FOUND', '该面试尚未关联简历');
    }
    const resume = locateResume(located.row.resume_id);
    if (!resume) return fail(404, 'NOT_FOUND', '关联的简历已不可用');

    return ok({
      resume_id: resume.id,
      title: resume.title,
      content: resume.content,
      candidate_name: resume.candidate_name,
      candidate_contact: resume.candidate_contact,
      updated_at: resume.updated_at,
    });
  });

  /* 与后端 MockProvider.match_questions_by_resume 同构：维度命中 > 题干重合 > 分类命中。
     以「题干自身」作分母算重合比例 —— 简历可达两万字，用并集做分母会把相似度压成噪声。 */
  const MATCH_WEIGHT_DIMENSION = 3.0;
  const MATCH_WEIGHT_CATEGORY = 1.5;
  const MATCH_WEIGHT_OVERLAP = 2.0;
  const MATCH_OVERLAP_MIN = 0.3;

  function bigrams(text) {
    const normalized = String(text).replace(/\s+/g, '');
    if (normalized.length < 2) return new Set(normalized);
    const out = new Set();
    for (let i = 0; i < normalized.length - 1; i += 1) out.add(normalized.slice(i, i + 2));
    return out;
  }

  function resumeOverlap(questionText, resumeText) {
    const questionGrams = bigrams(questionText);
    if (!questionGrams.size) return 0;
    const resumeGrams = bigrams(resumeText);
    let hit = 0;
    for (const gram of questionGrams) if (resumeGrams.has(gram)) hit += 1;
    return hit / questionGrams.size;
  }

  function matchReason(item, dimensionHit, categoryHit, overlap) {
    if (dimensionHit && overlap >= MATCH_OVERLAP_MIN) {
      return `简历中体现了${item.dimension}相关经历，且本题题干与其表述有重合，属于高相关题目。`;
    }
    if (dimensionHit) return `简历中体现了${item.dimension}相关经历，本题直接考察该维度。`;
    if (categoryHit) return `简历中的${item.category}方向与本题一致。`;
    if (overlap >= MATCH_OVERLAP_MIN) return '本题题干与简历表述有一定重合。';
    return '本题与岗位评估维度相关，作为通用考察项。';
  }

  on('POST', '/interviews/:id/questions/match', ({ user, body, params }) => {
    const denied = requireLogin(user);
    if (denied) return denied;
    const located = locateInterview(user, params.id);
    if (located.error) return located.error;
    const interview = located.row;

    if (interview.status !== 'ongoing') return fail(409, 'BUSINESS_ERROR', '当前状态下不可按简历补题');
    if (interview.resume_id == null) return fail(409, 'BUSINESS_ERROR', '该面试尚未关联简历');

    const position = state.positions.find((p) => p.id === interview.position_id);
    const dimensions = position ? position.evaluation_dimensions : [];
    if (!dimensions.length) return fail(409, 'BUSINESS_ERROR', '岗位未定义评估维度，无法补题');

    const existingIds = new Set((interview.questions || []).map((q) => q.question_id).filter((id) => id != null));
    const candidates = state.questions
      .filter((q) => q.position_id === interview.position_id
        && q.created_by === user.id
        && dimensions.includes(q.dimension)
        && !existingIds.has(q.id))
      .sort((a, b) => a.id - b.id);
    if (!candidates.length) return fail(409, 'BUSINESS_ERROR', '题库中没有可补充的题目');

    // AI 失败 → 数据库零改动（后端在此前后都没有写操作，因此无须补偿）
    if (aiFails()) return fail(502, 'AI_PROVIDER_ERROR', 'AI 服务调用失败，请稍后重试');

    const resume = locateResume(interview.resume_id);
    const resumeText = resume ? resume.content : '';
    const count = Math.max(1, Math.min(20, Number(body?.count) || 3));

    const scored = candidates.map((item) => {
      const dimensionHit = resumeText.includes(item.dimension);
      const categoryHit = resumeText.includes(item.category);
      const overlap = resumeOverlap(item.content, resumeText);
      return {
        item,
        score: MATCH_WEIGHT_DIMENSION * (dimensionHit ? 1 : 0)
          + MATCH_WEIGHT_CATEGORY * (categoryHit ? 1 : 0)
          + MATCH_WEIGHT_OVERLAP * overlap,
        dimensionHit,
        categoryHit,
        overlap,
      };
    });
    // 同分必须有序：按 id 升序兜底，否则结果依赖传入顺序
    scored.sort((a, b) => (b.score - a.score) || (a.item.id - b.item.id));

    const picked = scored.slice(0, count);
    const baseSeq = Math.max(0, ...(interview.questions || []).map((q) => q.seq));

    // 「没有更相关的题」是正当结论，不是故障 → 200 + added_count = 0
    if (!picked.length) {
      return ok({ added_count: 0, added: [], total_questions: (interview.questions || []).length });
    }

    const added = picked.map((row, index) => {
      const item = {
        interview_question_id: interview.id * 1000 + baseSeq + index + 1,
        seq: baseSeq + index + 1,
        content: row.item.content,
        dimension: row.item.dimension,
        source: 'resume_match',
        answer: null,
        recorded_at: null,
        answer_source: null,
        question_id: row.item.id,
        match_reason: matchReason(row.item, row.dimensionHit, row.categoryHit, row.overlap),
      };
      interview.questions.push(item);
      return {
        interview_question_id: item.interview_question_id,
        seq: item.seq,
        content: item.content,
        dimension: item.dimension,
        match_reason: item.match_reason,
      };
    });

    return ok({ added_count: added.length, added, total_questions: interview.questions.length });
  });

  /* ---- 评估与报告 ----
     Mock 的评分是完全确定性的：同一场面试每次评估得到同一份报告，无 Key 也能
     演示与复现。规则是「答得有内容、有一定篇幅 → 分更高」，再按 id 加一个稳定的
     小抖动，让同一场里的分数不至于齐平。真实 Provider 走大模型，接口形状相同。 */

  const reports = new Map();          // interview_id → 报告
  const candidateFeedback = new Map(); // interview_id → 候选人脱敏视图（F9 才读）
  const evaluations = new Map();      // interview_id → 评估任务（含已产生的 SSE 事件）

  const QUESTION_COMMENTS = {
    strong: [
      '回答给出了具体场景与处理过程，能说清判断依据，属于有实操经验的表述。',
      '先讲结论再讲过程，边界情况也考虑到了，看得出是真正做过这件事的人。',
      '提到了取舍的原因 —— 不只说做了什么，还说了为什么这么做。',
    ],
    ok: [
      '方向是对的，但停在「我会怎么做」的层面，缺少一个自己经历过的实例。',
      '要点基本说到了，但用的是通用表述，没体现出与本岗位场景的关联。',
      '回答完整，追问细节时还有多少可讲的，需要下一轮确认。',
    ],
    weak: [
      '多为结论式表述，没有给出判断依据，继续追问也未能落到具体做法上。',
      '回答与题目关联不大，更像是临时组织的语言，缺少准备痕迹。',
      '提到了相关概念，但没说明自己实际处理过什么、结果如何。',
    ],
    poor: [
      '几乎未提供有效信息，无法据此判断该项能力。',
      '仅有一两句笼统的表述，与题目要求相去甚远。',
    ],
  };

  function hashString(text) {
    let hash = 0;
    for (let i = 0; i < text.length; i += 1) hash = (hash * 31 + text.charCodeAt(i)) | 0;
    return Math.abs(hash);
  }
  const round1 = (value) => Math.round(value * 10) / 10;
  const pickBy = (list, seed) => list[hashString(seed) % list.length];

  function scoreBand(score) {
    if (score >= 8) return 'strong';
    if (score >= 6.5) return 'ok';
    if (score >= 4) return 'weak';
    return 'poor';
  }

  function scoreQuestion(question, interview) {
    const text = String(question.answer ?? '').trim();
    if (!text) return 0; // 未作答一律 0 分（PRD §4.5 的 0–10 分制）
    const depth = Math.min(3.4, text.length / 40);
    const jitter = (hashString(`${question.interview_question_id}:${interview.candidate_name}`) % 11) / 10 - 0.5;
    return round1(Math.max(2, Math.min(9.5, 5.2 + depth + jitter)));
  }

  /* 优点 / 待改进是「发现」，不是把图例里的评语再抄一遍 ——
     这是这份报告里唯一一处替 HR 下判断的地方，措辞要能直接写进评审结论。 */
  function strongFinding(dim, score) {
    return score >= 8
      ? `在${dim}上给出了完整的判断依据与处理过程，属于有实操经验的水平。`
      : `${dim}的回答方向正确，且能结合自身经历展开。`;
  }
  function weakFinding(dim, score) {
    return score < 4
      ? `${dim}的回答没有提供有效信息，建议下一轮直接把问题落到具体项目上。`
      : `${dim}停留在通用表述，缺少可核实的细节。`;
  }

  function buildEvaluation(interview) {
    const position = state.positions.find((p) => p.id === interview.position_id);
    const dimensions = position ? position.evaluation_dimensions : [];
    const questions = interview.questions || [];

    const questionScores = questions.map((q) => {
      const score = scoreQuestion(q, interview);
      return {
        interview_question_id: q.interview_question_id,
        score,
        comment: score === 0
          ? '本题未作答，按 0 分计。'
          : pickBy(QUESTION_COMMENTS[scoreBand(score)], String(q.interview_question_id)),
      };
    });

    const dimensionScores = dimensions.map((dim) => {
      const scores = questions.filter((q) => q.dimension === dim).map((q) => scoreQuestion(q, interview));
      const score = scores.length ? round1(scores.reduce((a, b) => a + b, 0) / scores.length) : 0;
      const band = scoreBand(score);
      const comment = {
        strong: `${dim}上表现稳定，多个问题都能落到具体做法与结果上。`,
        ok: `${dim}基本达到要求，个别问题停留在概念层面，缺少实例支撑。`,
        weak: `${dim}是本场较弱的环节，回答多为泛泛而谈，追问后仍无细节。`,
        poor: `${dim}方面几乎没有可用信息。`,
      }[band];
      return { dimension: dim, score, comment };
    });

    const overall = dimensionScores.length
      ? round1(dimensionScores.reduce((sum, d) => sum + d.score, 0) / dimensionScores.length)
      : 0;
    const best = dimensionScores.filter((d) => d.score >= 6.5).sort((a, b) => b.score - a.score).slice(0, 2);
    const worst = dimensionScores.filter((d) => d.score < 6.5).sort((a, b) => a.score - b.score).slice(0, 2);

    const verdict = overall >= 8 ? '与岗位要求高度匹配，建议进入下一轮。'
      : overall >= 6.5 ? '基本符合岗位要求，建议结合团队需要重点确认列出的薄弱项。'
      : overall >= 4.5 ? '与岗位要求存在明显差距，建议谨慎推进。'
      : '本轮表现与岗位要求差距较大，不建议继续推进。';
    const lead = best.length
      ? `${interview.candidate_name}在${best.map((d) => d.dimension).join('、')}上表现扎实`
      : `${interview.candidate_name}本轮未体现出明显优势`;
    const tail = worst.length
      ? `${worst.map((d) => d.dimension).join('、')}是需要进一步确认的部分。`
      : '各维度表现较为均衡。';

    return {
      interview_id: interview.id,
      overall_score: overall,
      conclusion: `${lead}，${tail}${verdict}`,
      strengths: best.map((d) => strongFinding(d.dimension, d.score)),
      weaknesses: worst.map((d) => weakFinding(d.dimension, d.score)),
      question_scores: questionScores,
      dimension_scores: dimensionScores,
    };
  }

  /** 候选人脱敏视图：只含结论、优点、待改进，不含任何分数（PRD §4.9）。 */
  function feedbackFrom(report) {
    return {
      interview_id: report.interview_id,
      conclusion: report.conclusion,
      strengths: report.strengths,
      weaknesses: report.weaknesses,
      generated_at: new Date().toISOString(),
    };
  }

  function pushEvent(job, event, data) { job.events.push({ event, data }); }

  /**
   * 启动一次评估。任务在「后台」跑（不阻塞请求），产出的事件进缓冲 ——
   * 前端中途断开再连，靠这份缓冲续上，而不是从头再演一遍（PRD §7）。
   */
  function startEvaluation(interview) {
    const report = buildEvaluation(interview);
    const job = { interview_id: interview.id, events: [], done: false, report };
    evaluations.set(interview.id, job);
    interview.status = 'evaluating';

    (async () => {
      await sleep(240);

      // 真实 Provider 会重试 1 次再判失败（PRD §7）；Mock 直接判失败。
      // 失败时状态回退 completed，既有作答与题目一律不动，HR 可重新触发。
      if (aiFails()) {
        interview.status = 'completed';
        pushEvent(job, 'error', {
          code: 'AI_PROVIDER_ERROR',
          message: 'AI 服务调用失败，本次评估未完成，可重新触发',
        });
        job.done = true;
        return;
      }

      pushEvent(job, 'stage', { stage: 'question_scores', total: report.question_scores.length });
      for (const item of report.question_scores) {
        await sleep(240 + Math.random() * 260);
        pushEvent(job, 'question_score', item);
      }

      pushEvent(job, 'stage', { stage: 'dimension_scores' });
      for (const item of report.dimension_scores) {
        await sleep(400 + Math.random() * 200);
        pushEvent(job, 'dimension_score', item);
      }

      pushEvent(job, 'stage', { stage: 'report' });
      await sleep(620);
      pushEvent(job, 'report', {
        overall_score: report.overall_score,
        conclusion: report.conclusion,
        strengths: report.strengths,
        weaknesses: report.weaknesses,
      });

      reports.set(interview.id, report);
      candidateFeedback.set(interview.id, feedbackFrom(report)); // 候选人端 F9 才读
      interview.status = 'evaluated';
      await sleep(200);
      pushEvent(job, 'done', { status: 'evaluated' });
      job.done = true;
    })();

    return job;
  }

  /** 把任务的事件缓冲变成一条 SSE 流：先补发已有的，再等新的。 */
  function eventStream(job, signal) {
    const encoder = new TextEncoder();
    let stopped = false;
    // 这条 fetch 是拦截出来的，原生 AbortController 挂不到它上面，
    // 得自己接住 abort —— 否则页面走了事件还在往一个没人读的流里灌
    if (signal) signal.addEventListener('abort', () => { stopped = true; }, { once: true });

    return new ReadableStream({
      async start(controller) {
        let cursor = 0;
        try {
          for (;;) {
            while (cursor < job.events.length) {
              const item = job.events[cursor];
              cursor += 1;
              controller.enqueue(encoder.encode(`event: ${item.event}\ndata: ${JSON.stringify(item.data)}\n\n`));
            }
            if (job.done || stopped) break;
            await sleep(120);
          }
          controller.close();
        } catch {
          // 客户端已断开：任务照跑、缓冲还在，只是没人可推
        }
      },
    });
  }

  on('POST', '/interviews/:id/evaluate', ({ user, params }) => {
    const denied = requireLogin(user);
    if (denied) return denied;
    const located = locateInterview(user, params.id);
    if (located.error) return located.error;

    const bad = assertTransition(located.row.status, 'evaluating');
    if (bad) return bad;

    startEvaluation(located.row);
    // 地址不带 /api 前缀，前端可直接交给 api.stream()
    return ok({ stream_url: `/interviews/${located.row.id}/evaluation/stream` });
  });

  on('GET', '/interviews/:id/evaluation/stream', ({ user, params, signal }) => {
    const denied = requireLogin(user);
    if (denied) return denied;
    const located = locateInterview(user, params.id);
    if (located.error) return located.error;

    if (located.row.status !== 'evaluating') {
      return fail(409, 'BUSINESS_ERROR', '该面试当前不在评估中');
    }
    // 停在「评估中」但没有任务：说明这个进程里任务丢了（原型重开后就是这种情况），
    // 就地补一次，而不是让页面卡在一个没有来源的进度上
    const job = evaluations.get(located.row.id) || startEvaluation(located.row);
    return { status: 200, stream: eventStream(job, signal) };
  });

  on('GET', '/interviews/:id/report', ({ user, params }) => {
    const denied = requireLogin(user);
    if (denied) return denied;
    const located = locateInterview(user, params.id);
    if (located.error) return located.error;

    const report = reports.get(located.row.id);
    if (!report) return fail(404, 'NOT_FOUND', '该面试尚未生成评估报告');
    return ok(report);
  });

  /* ---- 面试前准备助手 ---- */

  const preps = new Map(); // interview_id → 提纲
  let prepVariant = 0;

  /* 预案最多取 6 题，因此这两组各备 6 条 —— 少一条就会有两题拿到同一段话，
     一眼看出是套模板。 */
  const PREP_FOLLOWUPS = [
    ['如果条件反过来（流量再涨十倍、时间只给一半），你会怎么调整？', '这件事最坏会到什么程度，你当时怎么兜底？'],
    ['当时有没有别的方案？你为什么没选那个？', '如果重来一次，你会改哪一步？'],
    ['你怎么验证自己的判断是对的？', '这个结论有没有反例？'],
    ['这部分是你独立负责的，还是团队一起做的？你具体做了哪一块？', '当时有谁提过不同意见，最后怎么定的？'],
    ['这件事是你推动的，还是被安排做的？', '过程中最难的一步是什么，你当时怎么过的？'],
    ['如果让你现在重做一遍，第一步会不一样吗？', '这套做法在你们团队是通例，还是只有你这么做？'],
  ];

  /* 措辞按序号轮换。四段一模一样的句子会让「AI 生成的提纲」当场露馅 ——
     真实 Provider 会写得比这更活，Mock 至少不能句句同构。 */
  const PREP_FOCUS = [
    '把本场题目追问到具体做法与结果，而不是停在概念上。',
    '从他的叙述里找证据：做了什么、为什么这么做、结果如何。',
    '分清是「真的做过」还是「听过同事做」—— 追问到他自己负责的那部分。',
    '看深度不看广度：允许只讲一件事，但要能讲到底。',
    '留意前后说法是否一致，尤其是数字与时间线。',
  ];

  const PREP_REASON = {
    withResume: [
      '简历里有可交叉核实的经历，需确认表述与事实一致。',
      '简历提到了对应项目，可让他把细节讲透。',
      '注意核实简历里的数字与结果是怎么来的。',
      '简历中这段经历的时间与职责需要进一步确认。',
    ],
    noResume: [
      '本场未关联简历，需靠追问建立事实基础。',
      '没有简历可对照，先让他自述一遍经历。',
      '未关联简历，重点看自述内容前后是否自洽。',
      '本场没有简历，追问时留意说法前后是否一致。',
    ],
  };

  const PREP_INTENT = [
    '看他能不能讲清自己实际做了什么、依据是什么，而不是给出一个通用答案。',
    '重点在过程：遇到过什么阻力、怎么解决的、事后有没有复盘。',
    '留意有没有具体的数字或结果支撑，还是只有定性描述。',
    '观察他讲的是「我们做了什么」还是「我做了什么」。',
    '分辨他讲的是「标准做法」还是「他当时的做法」—— 后者才有信息量。',
    '答得快就追问一层原理；答得含糊，就把场景缩到他真正做过的那一段。',
  ];

  /** 每个维度一个阶段，阶段的切入点轮换着写，别让四段话长得一模一样。 */
  const PREP_DIM_POINT = [
    '从本场题目切入，追问到具体做法与结果',
    '让他举一个自己主导的例子，再往下追问两层',
    '先问做法，再问为什么这么做，最后问结果',
    '用一道情景题验证，看他的思路有没有落在实际约束上',
  ];

  function buildPrep(interview, position, resume) {
    const dims = position ? position.evaluation_dimensions : [];
    const questions = interview.questions || [];
    // Mock 每生成一次换一批措辞，好让「重新生成」在演示里看得出确实覆盖了；
    // 真实 Provider 是确定性的，同一输入产出同一份提纲。
    prepVariant += 1;
    const variant = prepVariant;

    const opening = variant % 2 === 0
      ? ['确认求职意向与期望到岗时间', '说明本场流程、时长与后续安排']
      : ['请候选人用三分钟讲清最近一段工作的主要职责', '确认求职意向与期望到岗时间'];

    const outline = [
      { phase: '开场与自我介绍', minutes: 5, points: opening },
      {
        phase: resume ? '经历核实' : '经历了解',
        minutes: resume ? 15 : 8,
        points: resume
          ? ['围绕简历中的核心项目追问职责边界', '核实简历里提到的数字与结果是怎么来的']
          : ['没有简历可对照，请候选人按时间线自述经历', '记录需要后续交叉核对的说法'],
      },
      ...dims.map((dim, index) => ({
        phase: `重点验证：${dim}`,
        minutes: 8,
        points: [
          PREP_DIM_POINT[(index + variant) % PREP_DIM_POINT.length],
          `记录${dim}上的判断依据，作为多维评分的输入`,
        ],
      })),
      { phase: '候选人提问与收尾', minutes: 5, points: ['回答候选人关于团队与岗位的问题', '说明后续流程与大致时间'] },
    ];

    const focusPoints = dims.map((dim, index) => {
      const reasons = resume ? PREP_REASON.withResume : PREP_REASON.noResume;
      return {
        dimension: dim,
        focus: PREP_FOCUS[(index + variant) % PREP_FOCUS.length],
        reason: `岗位「${position.name}」把${dim}列为评估维度；${reasons[(index + variant) % reasons.length]}`,
      };
    });

    const source = questions.length
      ? questions.slice(0, 6).map((q) => ({ question: q.content, dimension: q.dimension }))
      : dims.map((dim) => ({ question: `请结合一段具体经历，说明你在${dim}方面是怎么做的。`, dimension: dim }));

    const questionPlan = source.map((item, index) => ({
      question: item.question,
      intent: PREP_INTENT[(index + variant) % PREP_INTENT.length],
      followups: PREP_FOLLOWUPS[(index + variant) % PREP_FOLLOWUPS.length],
    }));

    return {
      interview_id: interview.id,
      outline,
      focus_points: focusPoints,
      question_plan: questionPlan,
      generated_at: new Date().toISOString(),
      edited_at: null,
    };
  }

  /** 准备助手是面试的前置工作稿，与状态机正交：只有「完成」之后才冻结（PRD §4.11）。 */
  const PREP_OPEN_STATUSES = ['draft', 'ongoing'];
  const PREP_FROZEN = '面试已完成，准备提纲随之定稿；如需修改，请先回退到进行中';

  function validatePrep(body) {
    const fields = [];
    const outline = body?.outline;
    const focus = body?.focus_points;
    const plan = body?.question_plan;

    if (!Array.isArray(outline) || !outline.length) {
      fields.push({ field: 'outline', message: '面试提纲至少要保留一个阶段' });
    } else if (outline.some((s) => !String(s?.phase ?? '').trim())) {
      fields.push({ field: 'outline', message: '阶段名称不能为空' });
    } else if (outline.some((s) => !(Number(s?.minutes) > 0))) {
      fields.push({ field: 'outline', message: '每个阶段都要填分钟数，且需大于 0' });
    }

    if (!Array.isArray(focus)) fields.push({ field: 'focus_points', message: '考察重点格式不正确' });
    else if (focus.some((f) => !String(f?.dimension ?? '').trim())) {
      fields.push({ field: 'focus_points', message: '考察重点的维度不能为空' });
    }

    if (!Array.isArray(plan)) fields.push({ field: 'question_plan', message: '问题预案格式不正确' });
    else if (plan.some((p) => !String(p?.question ?? '').trim())) {
      fields.push({ field: 'question_plan', message: '预案里的问题不能为空' });
    }

    return fields;
  }

  on('GET', '/interviews/:id/prep', ({ user, params }) => {
    const denied = requireLogin(user);
    if (denied) return denied;
    const located = locateInterview(user, params.id);
    if (located.error) return located.error;

    const prep = preps.get(located.row.id);
    if (!prep) return fail(404, 'NOT_FOUND', '该面试尚未生成准备提纲');
    return ok(prep);
  });

  on('POST', '/interviews/:id/prep', ({ user, params }) => {
    const denied = requireLogin(user);
    if (denied) return denied;
    const located = locateInterview(user, params.id);
    if (located.error) return located.error;

    if (!PREP_OPEN_STATUSES.includes(located.row.status)) return fail(409, 'BUSINESS_ERROR', PREP_FROZEN);

    const position = state.positions.find((p) => p.id === located.row.position_id);
    const resume = located.row.resume_id != null ? locateResume(located.row.resume_id) : null;
    const prep = buildPrep(located.row, position, resume);
    preps.set(located.row.id, prep); // 重新生成即整体覆盖（PRD §4.11）
    return ok(prep);
  });

  on('PUT', '/interviews/:id/prep', ({ user, body, params }) => {
    const denied = requireLogin(user);
    if (denied) return denied;
    const located = locateInterview(user, params.id);
    if (located.error) return located.error;

    if (!PREP_OPEN_STATUSES.includes(located.row.status)) return fail(409, 'BUSINESS_ERROR', PREP_FROZEN);

    const prep = preps.get(located.row.id);
    if (!prep) return fail(404, 'NOT_FOUND', '该面试尚未生成准备提纲');

    const fields = validatePrep(body);
    if (fields.length) return fail(400, 'VALIDATION_ERROR', '请求参数不合法', { fields });

    // 三个字段整体替换，不做字段级合并
    prep.outline = body.outline.map((s) => ({ phase: s.phase.trim(), minutes: Number(s.minutes), points: s.points || [] }));
    prep.focus_points = body.focus_points.map((f) => ({
      dimension: f.dimension.trim(), focus: String(f.focus ?? ''), reason: String(f.reason ?? ''),
    }));
    prep.question_plan = body.question_plan.map((p) => ({
      question: p.question.trim(), intent: String(p.intent ?? ''), followups: p.followups || [],
    }));
    prep.edited_at = new Date().toISOString();
    return ok(prep);
  });

  /* 种子数据要自洽：已评估的面试得有一份对应的报告，其中一场还要有一份现成的
     准备提纲 —— 页面进来就能看到「定稿后只读」这条分支，而不只是个空态。 */
  function seedEvaluations() {
    for (const interview of state.interviews) {
      if (interview.status !== 'evaluated') continue;
      const report = buildEvaluation(interview);
      reports.set(interview.id, report);
      candidateFeedback.set(interview.id, feedbackFrom(report));
    }
  }
  seedEvaluations();

  (function seedPrep() {
    const interview = state.interviews.find((i) => i.id === 1);
    if (!interview) return;
    const position = state.positions.find((p) => p.id === interview.position_id);
    preps.set(interview.id, buildPrep(interview, position, null));
  })();

  /* ==========================================================================
     候选人侧：自助注册、邀请码激活、刷题

     判分与后端 practice.service._grade 的四条分支逐条同构：
       空作答        → 0 分，且不调 AI
       单选          → 本地比对，10 / 0，解析取题库的 explanation
       简答无参考答案 → 标**未判分**（is_correct = null），不是判错
       简答有参考答案 → 按 MockProvider.grade_practice_answer：字符二元组
                        Jaccard × 10，阈值同为 6.5
     这样原型里判出的分数与真实运行是同一件事，而不是「看着像」。
     ========================================================================== */

  const PASS_THRESHOLD = 6.5;
  const PRACTICE_DEFAULT_SIZE = 5;
  const PRACTICE_MAX_SIZE = 20;
  const SESSION_LIST_LIMIT = 20;
  const PRACTICE_ANSWER_MAX = 10000;
  const SELF_REGISTER_OFF_MESSAGE = '候选人自助注册已关闭，请使用邀请码激活';

  /** 原型开关：关掉自助注册，用来走查「注册关闭」这条分支。?reg=off */
  function selfRegisterOff() {
    if (/[?&]reg=off(&|$)/.test(location.search)) return true;
    try { return localStorage.getItem('prototype.selfRegisterOff') === '1'; } catch { return false; }
  }
  exports.setSelfRegisterOff = function (on) {
    try {
      if (on) localStorage.setItem('prototype.selfRegisterOff', '1');
      else localStorage.removeItem('prototype.selfRegisterOff');
    } catch { /* 忽略 */ }
  };

  /** 字符二元组 Jaccard 相似度 = |A ∩ B| / |A ∪ B|（与 MockProvider._similarity 同构）。 */
  function jaccard(left, right) {
    const a = bigrams(left);
    const b = bigrams(right);
    const union = new Set([...a, ...b]);
    if (!union.size) return 0;
    let hit = 0;
    for (const gram of a) if (b.has(gram)) hit += 1;
    return hit / union.size;
  }

  function practiceExplanation(score) {
    if (score >= 8) return '回答与参考答案高度吻合，要点覆盖完整。';
    if (score >= PASS_THRESHOLD) return '回答覆盖了主要要点，个别细节仍可补充。';
    if (score > 0) return '回答与参考答案的要点重合较少，建议对照参考答案补充关键内容。';
    return '回答与参考答案没有重合，建议重新作答。';
  }

  /** 建候选人账号：同名 candidate 复用、同名 admin/hr 硬拒绝（与 auth service 同构）。 */
  function createCandidateAccount(username, password) {
    const existing = state.users.find((u) => u.username === username);
    if (existing) {
      // 复用已存在的 candidate，不校验密码 —— 否则「凭邀请码重置他人密码」
      // 会成为一条越权路径（auth.schemas 的同一决定）
      if (existing.role === 'candidate') return { row: existing };
      return { error: fail(409, 'BUSINESS_ERROR', '用户名已被占用') };
    }
    const row = {
      id: seq.user++,
      username,
      password,
      role: 'candidate',
      is_active: true,
      created_at: new Date().toISOString(),
    };
    state.users.push(row);
    return { row };
  }

  function validateCredentials(body) {
    const fields = [];
    const username = String(body?.username ?? '').trim();
    const password = String(body?.password ?? '');
    if (!username || username.length > 50) {
      fields.push({ field: 'username', message: '用户名长度需在 1–50 位之间' });
    }
    if (password.length < 8 || password.length > 128) {
      fields.push({ field: 'password', message: '密码长度需在 8–128 位之间' });
    }
    return { fields, username, password };
  }

  on('POST', '/auth/register', ({ body }) => {
    const { fields, username, password } = validateCredentials(body);
    if (fields.length) return fail(400, 'VALIDATION_ERROR', '请求参数不合法', { fields });

    if (selfRegisterOff()) {
      // detail.reason 与后端一致：前端据此把「去激活」那条路摆出来（module-15 §4.1）
      return fail(409, 'BUSINESS_ERROR', SELF_REGISTER_OFF_MESSAGE, { reason: 'self_register_disabled' });
    }

    const built = createCandidateAccount(username, password);
    if (built.error) return built.error;
    return created(publicUser(built.row));
  });

  /** 候选人看到的面试（不含 HR 评语与评分明细）。F9 的列表与详情共用。 */
  function candidateInterviewView(interview) {
    const position = state.positions.find((p) => p.id === interview.position_id);
    const questions = interview.questions || [];
    return {
      id: interview.id,
      position_name: position?.name ?? '—',
      status: interview.status,
      question_count: questions.length,
      answered_count: questions.filter((q) => q.answer != null).length,
      submitted: candidateSubmittedAt(interview) != null,
      created_at: interview.created_at,
    };
  }

  /** 交卷事实落在作答上（answer.submitted_at），不是面试状态上（PRD §5.1）。 */
  function candidateSubmittedAt(interview) {
    const stamps = (interview.questions || []).map((q) => q.submitted_at).filter(Boolean);
    return stamps.length ? stamps.sort()[stamps.length - 1] : null;
  }

  on('POST', '/candidate/invitations/:code/accept', ({ user, body, params }) => {
    const denied = requireLogin(user);
    if (denied) return denied;

    const invitation = state.invitations.find((i) => i.code === params.code);
    // 码不存在 / 已撤销 / 已接受 / 已过期 → **同一文案**，且响应里不出现任何面试
    // 信息。否则这个端点就成了邀请码探测接口（module-12 §5.3 的同一处理）。
    if (!invitation || deriveInvitationStatus(invitation) !== 'pending') {
      return fail(409, 'BUSINESS_ERROR', '邀请码无效或已失效');
    }

    const { fields, username, password } = validateCredentials(body);
    if (fields.length) return fail(400, 'VALIDATION_ERROR', '请求参数不合法', { fields });

    const built = createCandidateAccount(username, password);
    if (built.error) return built.error;
    const candidate = built.row;

    if (state.invitations.some((i) => i.interview_id === invitation.interview_id
      && i.candidate_user_id === candidate.id && i.status === 'accepted')) {
      return fail(409, 'BUSINESS_ERROR', '你已接受过该面试的邀请');
    }

    invitation.status = 'accepted';
    invitation.candidate_user_id = candidate.id;
    invitation.accepted_at = new Date().toISOString();

    const interview = state.interviews.find((i) => i.id === invitation.interview_id);
    return ok({ interview_id: interview.id, interview: candidateInterviewView(interview) });
  });

  /* ---- 刷题：筛选项、取题、会话、判分 ---- */

  function practiceFilterFrom(query) {
    return {
      position_id: query.position_id ? Number(query.position_id) : null,
      category: query.category || null,
      dimension: query.dimension || null,
      difficulty: query.difficulty || null,
      question_type: query.question_type || null,
    };
  }

  /**
   * 取题池是**全库**，不按 created_by 过滤 —— 必须与 /candidate/positions 同口径，
   * 否则会出现「下拉里有的岗位，选了却取不到题」。
   */
  function practiceCandidates(filters) {
    return state.questions.filter((q) => {
      if (filters.position_id != null && q.position_id !== filters.position_id) return false;
      if (filters.category && q.category !== filters.category) return false;
      if (filters.dimension && q.dimension !== filters.dimension) return false;
      if (filters.difficulty && q.difficulty !== filters.difficulty) return false;
      if (filters.question_type && q.question_type !== filters.question_type) return false;
      return true;
    }).sort((a, b) => a.id - b.id);
  }

  /** 与 PracticeQuestionOut 一致：**不含** reference_answer / explanation。 */
  function practiceQuestionView(question) {
    return {
      id: question.id,
      position_id: question.position_id,
      category: question.category,
      dimension: question.dimension,
      difficulty: question.difficulty,
      content: question.content,
      question_type: question.question_type,
      options: question.options || [],
      tags: question.tags || [],
    };
  }

  function practiceItemsOf(sessionId) {
    return state.practiceItems.filter((i) => i.session_id === sessionId).sort((a, b) => a.seq - b.seq);
  }

  /** 与 practice.service._accuracy 一致：分母是**已判分**数，无已判分时为 null。 */
  function accuracyOf(correct, scored) {
    return scored > 0 ? Math.round((correct / scored) * 1000) / 1000 : null;
  }

  function practiceCounters(session) {
    const items = practiceItemsOf(session.id);
    const answered = items.filter((i) => i.user_answer != null);
    return {
      total: items.length,
      answered_count: answered.length,
      correct_count: answered.filter((i) => i.is_correct === true).length,
    };
  }

  function sessionView(session) {
    const counters = practiceCounters(session);
    return {
      id: session.id,
      status: session.status,
      position_id: session.position_id,
      category: session.category,
      dimension: session.dimension,
      difficulty: session.difficulty,
      question_type: session.question_type,
      ...counters,
      started_at: session.started_at,
      finished_at: session.finished_at,
    };
  }

  function sessionListItem(session) {
    const position = state.positions.find((p) => p.id === session.position_id);
    return {
      session_id: session.id,
      status: session.status,
      position_name: position?.name ?? null,
      category: session.category,
      dimension: session.dimension,
      difficulty: session.difficulty,
      question_type: session.question_type,
      ...practiceCounters(session),
      started_at: session.started_at,
      finished_at: session.finished_at,
    };
  }

  /** 与 PracticeItemOut 一致：未提交就不下发解析与参考答案（不下发 ≠ 前端不显示）。 */
  function practiceItemView(item) {
    const question = state.questions.find((q) => q.id === item.question_id);
    const submitted = item.user_answer != null;
    return {
      item_id: item.id,
      seq: item.seq,
      question: {
        id: item.question_id,
        position_id: question ? question.position_id : 0,
        category: question ? question.category : '',
        dimension: item.dimension_snapshot,
        difficulty: question ? question.difficulty : '',
        content: item.content_snapshot,
        question_type: item.question_type,
        options: item.options_snapshot || [],
        tags: question ? (question.tags || []) : [],
      },
      user_answer: item.user_answer,
      is_correct: item.is_correct,
      score: item.score,
      explanation: submitted ? item.explanation : null,
      reference_answer: submitted ? item.reference_answer_snapshot : null,
    };
  }

  function sessionDetailView(session) {
    return {
      session: sessionView(session),
      items: practiceItemsOf(session.id).map(practiceItemView),
      resume_id: session.resume_id ?? null,
      resume_match_applied: false,
    };
  }

  /**
   * 简答题的 Mock 判分。
   *
   * **刻意不复用后端的纯 Jaccard**：后端 MockProvider 用二元组 Jaccard，实际效果
   * 是「不把参考答案抄一遍就接近 0 分」—— 一段认真写的 60 字回答通常只有
   * 0.1 量级的相似度，折成 1 分。那在原型里会造出「认真作答却全错」的画面，
   * 把 UI 本身要看的东西盖掉。
   *
   * 页面契约只关心 is_correct / score / explanation 三个字段，绝对值口径不影响
   * 页面代码；且接真实后端时（?live=1）这段判分整体被后端替换。因此这里选一个
   * 能产出分数梯度的规则：篇幅（答没答够）+ 与参考答案的重合度（贴不贴题）。
   */
  function practiceScore(reference, text) {
    const depth = Math.min(1, text.length / Math.max(40, reference.length));
    const overlap = Math.min(1, jaccard(reference, text) * 3);
    return Math.round(Math.min(10, 10 * (0.45 * depth + 0.9 * overlap)) * 10) / 10;
  }

  /** 与 practice.service._grade 的四条分支同构，返回 { is_correct, score, explanation }。 */
  function gradePracticeItem(item, userAnswer) {
    const text = String(userAnswer ?? '').trim();
    if (!text) return { is_correct: false, score: 0, explanation: '未作答' };

    const reference = String(item.reference_answer_snapshot ?? '').trim();
    if (item.question_type === 'single_choice') {
      // 单选不消耗 AI，因此解析只能取题库的 explanation（可能为 null）
      const question = state.questions.find((q) => q.id === item.question_id);
      const correct = text === reference;
      return {
        is_correct: correct,
        score: correct ? 10 : 0,
        explanation: question ? question.explanation : null,
      };
    }
    if (!reference) {
      return { is_correct: null, score: null, explanation: '该题暂无参考答案，本次不判分' };
    }
    // PRD §7：AI 判分失败**不阻塞作答**，标记为未判分、可稍后重判
    if (aiFails()) {
      return { is_correct: null, score: null, explanation: 'AI 判分暂时不可用，本题稍后可重判' };
    }
    const score = practiceScore(reference, text);
    return { is_correct: score >= PASS_THRESHOLD, score, explanation: practiceExplanation(score) };
  }

  function applyGrade(item, grade) {
    item.is_correct = grade.is_correct;
    item.score = grade.score;
    item.explanation = grade.explanation;
  }

  function itemResultView(item, session) {
    return {
      item_id: item.id,
      seq: item.seq,
      user_answer: item.user_answer,
      is_correct: item.is_correct,
      score: item.score,
      // 正确答案只在单选题有意义（前端据此标出正确选项）
      correct_answer: item.question_type === 'single_choice' ? item.reference_answer_snapshot : null,
      reference_answer: item.reference_answer_snapshot,
      explanation: item.explanation,
      progress: practiceCounters(session),
    };
  }

  function locateSession(user, id) {
    const row = state.practiceSessions.find((s) => s.id === Number(id));
    if (!row) return { error: fail(404, 'NOT_FOUND', '练习不存在') };
    if (row.candidate_user_id !== user.id) return { error: fail(403, 'FORBIDDEN', '无权访问该练习') };
    return { row };
  }

  on('GET', '/candidate/positions', ({ user }) => {
    const denied = requireLogin(user);
    if (denied) return denied;
    // 只给「至少有一道题的岗位」：候选人拿不到岗位接口，且取题取全库，
    // 两个口径必须一致，否则 UI 表达不出接口真正支持的筛选范围（PRD §4.7）
    return ok(state.positions
      .map((p) => ({
        id: p.id,
        name: p.name,
        question_count: state.questions.filter((q) => q.position_id === p.id).length,
      }))
      .filter((p) => p.question_count > 0)
      .sort((a, b) => a.id - b.id));
  });

  on('GET', '/practice/questions', ({ user, query }) => {
    const denied = requireLogin(user);
    if (denied) return denied;
    let rows = practiceCandidates(practiceFilterFrom(query));
    if (query.limit) rows = rows.slice(0, Number(query.limit));
    return ok(rows.map(practiceQuestionView));
  });

  on('GET', '/practice/sessions', ({ user, query }) => {
    const denied = requireLogin(user);
    if (denied) return denied;
    let rows = state.practiceSessions.filter((s) => s.candidate_user_id === user.id);
    if (query.status) rows = rows.filter((s) => s.status === query.status);
    const limit = Number(query.limit) || SESSION_LIST_LIMIT;
    return ok(rows
      .slice()
      .sort((a, b) => (a.started_at < b.started_at ? 1 : -1)) // 新的在前
      .slice(0, limit)
      .map(sessionListItem));
  });

  on('POST', '/practice/sessions', ({ user, body }) => {
    const denied = requireLogin(user);
    if (denied) return denied;

    const filters = {
      position_id: body?.position_id != null ? Number(body.position_id) : null,
      category: body?.category || null,
      dimension: body?.dimension || null,
      difficulty: body?.difficulty || null,
      question_type: body?.question_type || null,
    };
    const size = Math.min(PRACTICE_MAX_SIZE, Math.max(1, Number(body?.size) || PRACTICE_DEFAULT_SIZE));
    const picked = practiceCandidates(filters).slice(0, size);

    // 取不到题**不创建会话** —— 留一个空会话只会让「继续练习」指向一片空白
    if (!picked.length) {
      return fail(409, 'BUSINESS_ERROR', '没有符合条件的题目，请调整筛选条件');
    }

    const now = new Date().toISOString();
    const session = {
      id: seq.practice++,
      candidate_user_id: user.id,
      position_id: filters.position_id,
      category: filters.category,
      dimension: filters.dimension,
      difficulty: filters.difficulty,
      question_type: filters.question_type,
      resume_id: body?.resume_id ?? null,
      status: 'ongoing',
      started_at: now,
      finished_at: null,
    };
    state.practiceSessions.push(session);

    picked.forEach((question, index) => {
      state.practiceItems.push({
        id: seq.practiceItem++,
        session_id: session.id,
        seq: index + 1,
        question_id: question.id,
        // 写题目快照：题库删改不影响进行中与历史练习的复看（PRD §5.2）
        content_snapshot: question.content,
        options_snapshot: (question.options || []).slice(),
        reference_answer_snapshot: question.reference_answer,
        dimension_snapshot: question.dimension,
        question_type: question.question_type,
        user_answer: null,
        is_correct: null,
        score: null,
        explanation: null,
        answered_at: null,
      });
    });

    return created(sessionDetailView(session));
  });

  on('GET', '/practice/sessions/:id', ({ user, params }) => {
    const denied = requireLogin(user);

        el('label', { class: 'field-label', for: 'question-content', text: '题干' }),
        contentInput,
        el('p', { class: 'field-note', text: '5–2000 字。' }),
        contentError),

      choiceAnswerBlock,
      shortAnswerBlock,
      el('div', { class: 'field' },
        el('label', { class: 'field-label', for: 'question-explanation', text: '解析' }),
        explanationInput),

          categoryInput, categoryError),
        el('div', { class: 'field' },
          el('label', { class: 'field-label', for: 'question-difficulty', text: '难度' }),
          difficultySelect),

        el('label', { class: 'field-label', for: 'question-tags', text: '标签' }),

      const requestNo = ++reloadNo;

      try {
        rows = await api.get(query());
      } catch (error) {
        if (requestNo === reloadNo) toast.error(error.message);
        return;
      }
      if (requestNo !== reloadNo) return; // 已经有更新的请求发出，这次的结果作废

      if (!questions.some((q) => q.id === selectedId)) selectedId = questions[0]?.id ?? null;

            class: `split-item${question.id === selectedId ? ' is-active' : ''}`,

          },
            el('div', { class: 'split-item-text', text: question.content }),
            el('div', { class: 'split-item-tags' },
              el('span', { class: 'tag tag--dim', text: TYPE_LABELS[question.question_type] ?? question.question_type }),
              el('span', { class: 'tag tag--dim', text: DIFFICULTY_LABELS[question.difficulty] ?? question.difficulty }),
              el('span', { class: 'split-item-pos', text: position?.name ?? '—' }),
            ),
          ),

        el('div', { class: 'dossier-label', text: label }),
        node);

              el('span', { class: 'tag tag--dim', text: TYPE_LABELS[question.question_type] ?? question.question_type }),

                  el('span', { text }),
                  text === answer ? el('span', { class: 'option-flag', text: '参考答案' }) : null,
                ),

          title: '重新生成参考答案？',
          message: '生成会覆盖这道题现有的参考答案与解析，且不可撤销。',
          confirmLabel: '重新生成',

    /* ---------------------------- 筛选栏 ---------------------------- */

    function selectFilter(options, key, ariaLabel) {
      const node = el(
        'select',
        { class: 'select', 'aria-label': ariaLabel, onChange: (event) => { filters[key] = event.target.value; reload(); } },
        options.map(([value, text]) => el('option', { value, text })),
      );
      return node;
    }

    function textFilter(key, placeholder, grow) {
      return el('input', {
        class: `input${grow ? ' filterbar-grow' : ''}`,
        placeholder,
        'aria-label': placeholder,
        onInput: (event) => { filters[key] = event.target.value.trim(); reload(); },
      });
    }

    // 维度与分类都是**精确匹配**（后端 == 比较），所以给下拉而不是自由输入 ——
    // 自由输入要求用户一字不差地敲对，否则筛出来是空的却看不出为什么。
    const dimensionOptions = [['', '全部维度']];
    const seenDimensions = new Set();
    for (const position of positions) {
      for (const dimension of position.evaluation_dimensions) {
        if (!seenDimensions.has(dimension)) { seenDimensions.add(dimension); dimensionOptions.push([dimension, dimension]); }
      }
    }
    const categoryOptions = [['', '全部分类']];
    for (const question of questions) {
      if (!categoryOptions.some(([value]) => value === question.category)) {
        categoryOptions.push([question.category, question.category]);
      }
    }

    const filterbar = el('div', { class: 'filterbar' },
      selectFilter([['', '全部岗位'], ...positions.map((p) => [String(p.id), p.name])], 'position_id', '按岗位筛选'),
      selectFilter([['', '全部题型'], ['single_choice', TYPE_LABELS.single_choice], ['short_answer', TYPE_LABELS.short_answer]], 'question_type', '按题型筛选'),
      selectFilter(dimensionOptions, 'dimension', '按维度筛选'),
      selectFilter(categoryOptions, 'category', '按分类筛选'),
      selectFilter([['', '全部来源'], ['bank', '手工'], ['ai', 'AI']], 'source', '按来源筛选'),
      textFilter('keyword', '搜索题干', true),
      countNode,
    );

    mount(
      main,
      el('div', { class: 'page-head' },
        el('div', {},
          el('h1', { text: '题库' }),
          el('p', { class: 'page-lede' }, '手工维护的题会优先被抽中；AI 在面试创建时补充的题也会收录到这里。'),
        ),
        el('div', { class: 'page-head-actions' },
          el('button', {
            class: 'btn btn--primary',
            text: '创建题目',
            disabled: !positions.length,
            title: positions.length ? '' : '请先创建岗位',
            onClick: create,
          })),
      ),
      el('div', { class: 'panel' }, filterbar, bodyHost),
    );

    await reload();
  }

  exports.render = render;
};
