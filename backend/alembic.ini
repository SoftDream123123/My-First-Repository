# Alembic configuration
# NOTE: this file is read by configparser using the system locale encoding,
# so it must stay pure ASCII (Chinese comments here break on GBK Windows).
#
# The database URL is intentionally NOT stored here - alembic/env.py reads it
# from the application settings (.env), avoiding two sources of truth.

[alembic]
script_location = alembic
prepend_sys_path = .
path_separator = os

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
