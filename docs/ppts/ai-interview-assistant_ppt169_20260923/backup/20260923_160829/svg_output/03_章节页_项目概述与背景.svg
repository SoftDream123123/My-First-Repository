<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <defs>
    <linearGradient id="deepGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B2E52"/>
      <stop offset="100%" stop-color="#1565C0"/>
    </linearGradient>
  </defs>

  <g id="bg-deep">
    <rect width="1280" height="720" fill="url(#deepGradient)"/>
  </g>

  <g id="bg-decor">
    <rect x="0" y="0" width="6" height="720" fill="#F57C00" fill-opacity="0.85"/>
    <rect x="700" y="180" width="1" height="360" fill="#EAF2FB" fill-opacity="0.16"/>
  </g>

  <g id="section-marker">
    <text x="88" y="330" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="150" font-weight="700" fill="#EAF2FB" fill-opacity="0.14">01</text>
    <rect x="88" y="372" width="56" height="5" fill="#F57C00"/>
  </g>

  <g id="section-title">
    <text x="88" y="440" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="44" font-weight="700" fill="#FFFFFF">项目概述与背景</text>
    <text x="88" y="484" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="18" fill="#EAF2FB" fill-opacity="0.72">它解决什么问题，从哪来，边界画在哪</text>
  </g>

  <g id="section-index">
    <text x="784" y="268" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="13" font-weight="600" fill="#EAF2FB" fill-opacity="0.5" letter-spacing="3">本节内容</text>
    <text x="784" y="318" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="18" fill="#EAF2FB" fill-opacity="0.88">产品定位与它解决的问题</text>
    <text x="1216" y="318" text-anchor="end" font-family="Consolas, Courier New, monospace" font-size="14" fill="#EAF2FB" fill-opacity="0.45">P04</text>
    <line x1="784" y1="340" x2="1216" y2="340" stroke="#EAF2FB" stroke-opacity="0.14" stroke-width="1"/>

    <text x="784" y="374" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="18" fill="#EAF2FB" fill-opacity="0.88">三条业务闭环</text>
    <text x="1216" y="374" text-anchor="end" font-family="Consolas, Courier New, monospace" font-size="14" fill="#EAF2FB" fill-opacity="0.45">P05</text>
    <line x1="784" y1="396" x2="1216" y2="396" stroke="#EAF2FB" stroke-opacity="0.14" stroke-width="1"/>

    <text x="784" y="430" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="18" fill="#EAF2FB" fill-opacity="0.88">前世今生：MVP-1 → MVP-5 演进</text>
    <text x="1216" y="430" text-anchor="end" font-family="Consolas, Courier New, monospace" font-size="14" fill="#EAF2FB" fill-opacity="0.45">P06</text>
    <line x1="784" y1="452" x2="1216" y2="452" stroke="#EAF2FB" stroke-opacity="0.14" stroke-width="1"/>

    <text x="784" y="486" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="18" fill="#EAF2FB" fill-opacity="0.88">刻意画出的边界</text>
    <text x="1216" y="486" text-anchor="end" font-family="Consolas, Courier New, monospace" font-size="14" fill="#EAF2FB" fill-opacity="0.45">P07</text>
    <line x1="784" y1="508" x2="1216" y2="508" stroke="#EAF2FB" stroke-opacity="0.14" stroke-width="1"/>
  </g>

  <g id="footer">
    <text x="88" y="658" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="11" fill="#EAF2FB" fill-opacity="0.45">AI 智能面试助手 · 技术解构</text>
    <text x="1216" y="658" text-anchor="end" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="11" fill="#EAF2FB" fill-opacity="0.45">P03 / 35</text>
