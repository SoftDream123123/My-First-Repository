<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <defs>
    <linearGradient id="headerRule" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1565C0"/>
      <stop offset="100%" stop-color="#1565C0" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <g id="bg-base">
    <rect width="1280" height="720" fill="#FFFFFF"/>
  </g>

  <g id="header">
    <text x="64" y="82" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="32" font-weight="700" fill="#1565C0">模块⑤ resume：问题与解决（上传的安全边界）</text>
    <text x="1216" y="82" text-anchor="end" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="14" fill="#93A1B0">04 核心模块技术讲解</text>
    <line x1="64" y1="104" x2="1216" y2="104" stroke="url(#headerRule)" stroke-width="3"/>
  </g>

  <g id="footer">
    <line x1="64" y1="636" x2="1216" y2="636" stroke="#DCE5EE" stroke-width="1"/>
    <text x="64" y="658" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="11" fill="#93A1B0">AI 智能面试助手 · 技术解构</text>
    <text x="1216" y="658" text-anchor="end" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="11" fill="#93A1B0">P30 / 35</text>
  </g>

  <g id="row-1">
    <rect x="64" y="148" width="440" height="90" rx="8" fill="#C62828" fill-opacity="0.06"/>
    <rect x="64" y="148" width="4" height="90" fill="#C62828"/>
    <rect x="84" y="158" width="60" height="20" rx="4" fill="#C62828" fill-opacity="0.12"/>
    <text x="114" y="173" text-anchor="middle" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="11" font-weight="700" fill="#C62828">问题一</text>
    <text x="84" y="196" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="12" fill="#1F2733">改了扩展名就能绕过类型检查 —— 扩展名</text>
    <text x="84" y="214" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="12" fill="#1F2733">由客户端提供，把任意文件改个名字上传</text>
    <text x="84" y="232" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="12" fill="#1F2733">即可通过第一道检查。</text>

    <rect x="520" y="148" width="696" height="90" rx="8" fill="#2E7D32" fill-opacity="0.06"/>
    <rect x="520" y="148" width="4" height="90" fill="#2E7D32"/>
    <rect x="536" y="158" width="52" height="20" rx="4" fill="#2E7D32" fill-opacity="0.12"/>
    <text x="562" y="173" text-anchor="middle" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="11" font-weight="700" fill="#2E7D32">解法</text>
    <text x="536" y="196" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="12" fill="#1F2733">扩展名白名单之外，再按<tspan font-weight="700" fill="#2E7D32">文件头魔数</tspan>复核：PDF 必须以 <tspan font-family="Consolas, Courier New, monospace" fill="#2E7D32">%PDF-</tspan> 开头，</text>
    <text x="536" y="214" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="12" fill="#1F2733">DOCX 是 ZIP 容器、必须以 <tspan font-family="Consolas, Courier New, monospace" fill="#2E7D32">PK\x03\x04</tspan> 开头。两道都过才进入解析 ——</text>
    <text x="536" y="232" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="12" fill="#5A6B7D">客户端提供的文件名从此不再被信任。</text>
  </g>

  <g id="row-2">
    <rect x="64" y="246" width="440" height="90" rx="8" fill="#C62828" fill-opacity="0.06"/>
    <rect x="64" y="246" width="4" height="90" fill="#C62828"/>
    <rect x="84" y="256" width="60" height="20" rx="4" fill="#C62828" fill-opacity="0.12"/>
    <text x="114" y="271" text-anchor="middle" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="11" font-weight="700" fill="#C62828">问题二</text>
    <text x="84" y="294" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="12" fill="#1F2733">ZIP bomb —— 上传体积上限拦不住它：</text>
    <text x="84" y="312" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="12" fill="#1F2733">5 MB 的压缩包可以解出几个 GB。而 DOCX</text>
    <text x="84" y="330" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="12" fill="#1F2733">本质上就是一个 ZIP 容器。</text>

    <rect x="520" y="246" width="696" height="90" rx="8" fill="#2E7D32" fill-opacity="0.06"/>
    <rect x="520" y="246" width="4" height="90" fill="#2E7D32"/>
    <rect x="536" y="256" width="52" height="20" rx="4" fill="#2E7D32" fill-opacity="0.12"/>
    <text x="562" y="271" text-anchor="middle" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="11" font-weight="700" fill="#2E7D32">解法</text>
    <text x="536" y="294" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="12" fill="#1F2733">单独设<tspan font-weight="700" fill="#2E7D32">解压后展开体积上限 50 MB</tspan>，用 ZIP 中央目录的 <tspan font-family="Consolas, Courier New, monospace" fill="#2E7D32">file_size</tspan> 求和来判断 ——</text>
    <text x="536" y="312" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="12" fill="#1F2733"><tspan font-weight="700" fill="#2E7D32">不解压</tspan>，所以这道检查本身几乎不吃内存。上传体积与展开体积是两把不同的尺子：</text>
    <text x="536" y="330" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="12" fill="#5A6B7D">前者防带宽与磁盘，后者防内存与解压炸弹。</text>
  </g>

  <g id="row-3">
    <rect x="64" y="344" width="440" height="90" rx="8" fill="#C62828" fill-opacity="0.06"/>
    <rect x="64" y="344" width="4" height="90" fill="#C62828"/>
    <rect x="84" y="354" width="60" height="20" rx="4" fill="#C62828" fill-opacity="0.12"/>
    <text x="114" y="369" text-anchor="middle" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="11" font-weight="700" fill="#C62828">问题三</text>
    <text x="84" y="392" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="12" fill="#1F2733">加密 PDF 被误判为损坏 —— 很多导出工具</text>
    <text x="84" y="410" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="12" fill="#1F2733">默认给 PDF 加<tspan font-weight="700">空密码</tspan>，只看 is_encrypted</text>
    <text x="84" y="428" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="12" fill="#1F2733">会误伤一批正常文件。</text>

    <rect x="520" y="344" width="696" height="90" rx="8" fill="#2E7D32" fill-opacity="0.06"/>
    <rect x="520" y="344" width="4" height="90" fill="#2E7D32"/>
    <rect x="536" y="354" width="52" height="20" rx="4" fill="#2E7D32" fill-opacity="0.12"/>
    <text x="562" y="369" text-anchor="middle" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="11" font-weight="700" fill="#2E7D32">解法</text>
    <text x="536" y="392" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="12" fill="#1F2733">判定条件改为「已加密 <tspan font-weight="700" fill="#2E7D32">且</tspan> 空密码解不开」：先尝试 <tspan font-family="Consolas, Courier New, monospace" fill="#2E7D32">reader.decrypt("")</tspan>，</text>
    <text x="536" y="410" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="12" fill="#1F2733">成功就视为可读。只有真正需要密码的文件才拒收 —— 判据从「是否加密」收紧为</text>
    <text x="536" y="428" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="12" fill="#5A6B7D">「是否连空密码都打不开」。</text>
  </g>

  <g id="row-4">
    <rect x="64" y="442" width="440" height="90" rx="8" fill="#C62828" fill-opacity="0.06"/>
    <rect x="64" y="442" width="4" height="90" fill="#C62828"/>
    <rect x="84" y="452" width="60" height="20" rx="4" fill="#C62828" fill-opacity="0.12"/>
    <text x="114" y="467" text-anchor="middle" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="11" font-weight="700" fill="#C62828">问题四</text>
    <text x="84" y="490" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="12" fill="#1F2733">扫描件 PDF 解析出空字符串 —— 看起来像</text>
    <text x="84" y="508" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="12" fill="#1F2733">「解析成功但没内容」，用户不知道下一</text>
    <text x="84" y="526" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="12" fill="#1F2733">步该干什么。</text>

    <rect x="520" y="442" width="696" height="90" rx="8" fill="#2E7D32" fill-opacity="0.06"/>
    <rect x="520" y="442" width="4" height="90" fill="#2E7D32"/>
    <rect x="536" y="452" width="52" height="20" rx="4" fill="#2E7D32" fill-opacity="0.12"/>
    <text x="562" y="467" text-anchor="middle" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="11" font-weight="700" fill="#2E7D32">解法</text>
    <text x="536" y="490" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="12" fill="#1F2733">归一化后为空即报 400，文案点明「这可能是<tspan font-weight="700" fill="#2E7D32">扫描件</tspan>」并提示改用粘贴；</text>
    <text x="536" y="508" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="12" fill="#1F2733">.doc 旧格式、.txt、图片同样在类型检查处被点名拒收，而不是走到解析才失败 ——</text>
    <text x="536" y="526" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="12" fill="#5A6B7D">错误要落在最接近原因的那一道检查上。</text>
  </g>

  <g id="closing-band">
    <rect x="64" y="546" width="1152" height="78" rx="8" fill="#E3EDF9"/>
    <use data-icon="tabler-outline/flask" x="84" y="560" width="22" height="22" fill="#1565C0" stroke-width="2"/>
    <text x="116" y="576" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="14" font-weight="700" fill="#1565C0">为什么这里可以写宽 except</text>
    <text x="116" y="598" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="12" fill="#1F2733">pypdf 与 python-docx 在损坏文件上抛出的异常谱系不稳定（PdfReadError / ValueError / xml 层等），逐个枚举必然漏。</text>
    <text x="116" y="618" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="12" fill="#1F2733">此处兜底是安全的：本模块<tspan font-weight="700" fill="#2E7D32">不落库、不落盘</tspan>，宽捕获不会掩盖数据损坏，只会把「读不出来」如实告诉上传方。</text>
  </g>
</svg>
