<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <defs>
    <linearGradient id="headerRule" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1565C0"/>
      <stop offset="100%" stop-color="#1565C0" stop-opacity="0"/>
    </linearGradient>
    <marker id="arrowBlue" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1565C0"/>
    </marker>
    <marker id="arrowGray" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#93A1B0"/>
    </marker>
  </defs>

  <g id="bg-base">
    <rect width="1280" height="720" fill="#FFFFFF"/>
  </g>

  <g id="header">
    <text x="64" y="82" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="32" font-weight="700" fill="#1565C0">模块① ai：序列图与「只挑不生成」的结构性保证</text>
    <text x="1216" y="82" text-anchor="end" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="14" fill="#93A1B0">04 核心模块技术讲解</text>
    <line x1="64" y1="104" x2="1216" y2="104" stroke="url(#headerRule)" stroke-width="3"/>
  </g>

  <g id="footer">
    <line x1="64" y1="636" x2="1216" y2="636" stroke="#DCE5EE" stroke-width="1"/>
    <text x="64" y="658" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="11" fill="#93A1B0">AI 智能面试助手 · 技术解构</text>
    <text x="1216" y="658" text-anchor="end" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="11" fill="#93A1B0">P21 / 35</text>
  </g>

  <g id="seq-lifelines">
    <rect x="80" y="160" width="140" height="40" rx="6" fill="#E3EDF9" stroke="#1565C0" stroke-width="1"/>
    <text x="150" y="184" text-anchor="middle" font-family="Consolas, Courier New, monospace" font-size="12" font-weight="700" fill="#1565C0">evaluation.service</text>
    <line x1="150" y1="200" x2="150" y2="396" stroke="#DCE5EE" stroke-width="1.5" stroke-dasharray="5,5"/>

    <rect x="330" y="160" width="140" height="40" rx="6" fill="#E3EDF9" stroke="#1565C0" stroke-width="1"/>
    <text x="400" y="184" text-anchor="middle" font-family="Consolas, Courier New, monospace" font-size="12" font-weight="700" fill="#1565C0">factory</text>
    <line x1="400" y1="200" x2="400" y2="396" stroke="#DCE5EE" stroke-width="1.5" stroke-dasharray="5,5"/>

    <rect x="585" y="160" width="140" height="40" rx="6" fill="#E3EDF9" stroke="#1565C0" stroke-width="1"/>
    <text x="655" y="184" text-anchor="middle" font-family="Consolas, Courier New, monospace" font-size="12" font-weight="700" fill="#1565C0">AIProvider</text>
    <line x1="655" y1="200" x2="655" y2="396" stroke="#DCE5EE" stroke-width="1.5" stroke-dasharray="5,5"/>

    <rect x="830" y="160" width="140" height="40" rx="6" fill="#E3EDF9" stroke="#1565C0" stroke-width="1"/>
    <text x="900" y="184" text-anchor="middle" font-family="Consolas, Courier New, monospace" font-size="12" font-weight="700" fill="#1565C0">Mock / OpenAI</text>
    <line x1="900" y1="200" x2="900" y2="396" stroke="#DCE5EE" stroke-width="1.5" stroke-dasharray="5,5"/>

    <rect x="1060" y="160" width="140" height="40" rx="6" fill="#E3EDF9" stroke="#1565C0" stroke-width="1"/>
    <text x="1130" y="184" text-anchor="middle" font-family="Consolas, Courier New, monospace" font-size="12" font-weight="700" fill="#1565C0">on_event</text>
    <line x1="1130" y1="200" x2="1130" y2="396" stroke="#DCE5EE" stroke-width="1.5" stroke-dasharray="5,5"/>
  </g>

  <g id="seq-activations">
    <rect x="144" y="214" width="12" height="176" fill="#1565C0" fill-opacity="0.18"/>
    <rect x="394" y="222" width="12" height="40" fill="#1565C0" fill-opacity="0.18"/>
    <rect x="649" y="276" width="12" height="74" fill="#1565C0" fill-opacity="0.18"/>
    <rect x="894" y="304" width="12" height="18" fill="#1565C0" fill-opacity="0.18"/>
    <rect x="1124" y="360" width="12" height="18" fill="#1565C0" fill-opacity="0.18"/>
  </g>

  <g id="seq-messages">
    <line x1="156" y1="232" x2="392" y2="232" stroke="#1565C0" stroke-width="1.5" marker-end="url(#arrowBlue)"/>
    <text x="274" y="226" text-anchor="middle" font-family="Consolas, Courier New, monospace" font-size="12" fill="#1565C0">1  get_provider()</text>

    <line x1="394" y1="258" x2="158" y2="258" stroke="#93A1B0" stroke-width="1.5" stroke-dasharray="6,4" marker-end="url(#arrowGray)"/>
    <text x="276" y="252" text-anchor="middle" font-family="Consolas, Courier New, monospace" font-size="12" fill="#5A6B7D">2  provider（缓存单例）</text>

    <line x1="156" y1="286" x2="647" y2="286" stroke="#1565C0" stroke-width="1.5" marker-end="url(#arrowBlue)"/>
    <text x="401" y="280" text-anchor="middle" font-family="Consolas, Courier New, monospace" font-size="12" fill="#1565C0">3  evaluate_answer(dimension, question, answer)</text>

    <line x1="661" y1="312" x2="892" y2="312" stroke="#1565C0" stroke-width="1.5" marker-end="url(#arrowBlue)"/>
    <text x="776" y="306" text-anchor="middle" font-family="Consolas, Courier New, monospace" font-size="12" fill="#1565C0">4  httpx 调用（真实分支）</text>

    <line x1="649" y1="342" x2="158" y2="342" stroke="#93A1B0" stroke-width="1.5" stroke-dasharray="6,4" marker-end="url(#arrowGray)"/>
    <text x="403" y="336" text-anchor="middle" font-family="Consolas, Courier New, monospace" font-size="12" fill="#5A6B7D">5  QuestionScoreResult(score, comment)</text>

    <line x1="156" y1="368" x2="1122" y2="368" stroke="#1565C0" stroke-width="1.5" marker-end="url(#arrowBlue)"/>
    <text x="639" y="362" text-anchor="middle" font-family="Consolas, Courier New, monospace" font-size="12" fill="#1565C0">6  on_event(...) 发布 SSE 事件</text>
  </g>

  <g id="problem-1">
    <rect x="64" y="416" width="440" height="100" rx="8" fill="#C62828" fill-opacity="0.06"/>
    <rect x="64" y="416" width="4" height="100" fill="#C62828"/>
    <rect x="84" y="432" width="52" height="22" rx="4" fill="#C62828" fill-opacity="0.12"/>
    <text x="110" y="448" text-anchor="middle" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="11" font-weight="700" fill="#C62828">问题</text>
    <text x="84" y="478" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="13" fill="#1F2733">AI 有可能「编造」一道题库里根本不</text>
    <text x="84" y="500" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="13" fill="#1F2733">存在的题，用它冒充匹配结果 —— 让</text>
    <text x="84" y="522" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="13" fill="#1F2733">HR 以为这道题是从自己题库里挑的。</text>
  </g>

  <g id="solution-1">
    <rect x="524" y="416" width="692" height="100" rx="8" fill="#2E7D32" fill-opacity="0.06"/>
    <rect x="524" y="416" width="4" height="100" fill="#2E7D32"/>
    <rect x="544" y="432" width="52" height="22" rx="4" fill="#2E7D32" fill-opacity="0.12"/>
    <text x="570" y="448" text-anchor="middle" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="11" font-weight="700" fill="#2E7D32">解法</text>
    <text x="544" y="478" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="13" fill="#1F2733">两层<tspan font-weight="700" fill="#2E7D32">结构性保证</tspan>，不靠 prompt 自觉 ——</text>
    <text x="544" y="500" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="13" fill="#1F2733">① 返回类型 <tspan font-family="Consolas, Courier New, monospace" fill="#2E7D32">MatchedQuestion</tspan> 只有 question_id 与 reason，<tspan font-weight="700">没有题面字段</tspan> —— 编造在结构上无从表达</text>
    <text x="544" y="522" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="13" fill="#1F2733">② 解析时按池内 id 集合过滤，池外 id 全部丢弃；若返回内容却一条都没留下，抛错而非静默返回空数组</text>
  </g>

  <g id="problem-2">
    <rect x="64" y="528" width="440" height="96" rx="8" fill="#C62828" fill-opacity="0.06"/>
    <rect x="64" y="528" width="4" height="96" fill="#C62828"/>
    <rect x="84" y="544" width="52" height="22" rx="4" fill="#C62828" fill-opacity="0.12"/>
    <text x="110" y="560" text-anchor="middle" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="11" font-weight="700" fill="#C62828">问题</text>
    <text x="84" y="590" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="13" fill="#1F2733">真实 Provider 调用失败时，</text>
    <text x="84" y="612" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="13" fill="#1F2733">要不要自动降级到 Mock？</text>
  </g>

  <g id="solution-2">
    <rect x="524" y="528" width="692" height="96" rx="8" fill="#2E7D32" fill-opacity="0.06"/>
    <rect x="524" y="528" width="4" height="96" fill="#2E7D32"/>
    <rect x="544" y="544" width="52" height="22" rx="4" fill="#2E7D32" fill-opacity="0.12"/>
    <text x="570" y="560" text-anchor="middle" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="11" font-weight="700" fill="#2E7D32">解法</text>
    <text x="544" y="590" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="13" fill="#1F2733"><tspan font-weight="700" fill="#2E7D32">绝不降级</tspan>。静默降级会把规则模板的输出伪装成 AI 评估结果，既误导用户又掩盖故障。</text>
    <text x="544" y="612" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="13" fill="#1F2733">失败即 <tspan font-family="Consolas, Courier New, monospace" fill="#C62828">502 AI_PROVIDER_ERROR</tspan>，由用户重试 —— 「没有」与「坏了」必须可区分。</text>
  </g>
</svg>
