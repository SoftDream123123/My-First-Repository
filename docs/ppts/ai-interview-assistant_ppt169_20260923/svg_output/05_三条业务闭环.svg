<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <defs>
    <linearGradient id="headerRule" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1565C0"/>
      <stop offset="100%" stop-color="#1565C0" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <g id="bg-base">
    <rect width="1280" height="720" fill="#FFFFFF"/>
  </g>

  <g id="header">
    <text x="64" y="82" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="32" font-weight="700" fill="#1565C0">三条业务闭环</text>
    <text x="1216" y="82" text-anchor="end" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="14" fill="#93A1B0">01 项目概述与背景</text>
    <line x1="64" y1="104" x2="1216" y2="104" stroke="url(#headerRule)" stroke-width="3"/>
  </g>

  <g id="footer">
    <line x1="64" y1="636" x2="1216" y2="636" stroke="#DCE5EE" stroke-width="1"/>
    <text x="64" y="658" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="11" fill="#93A1B0">AI 智能面试助手 · 技术解构</text>
    <text x="1216" y="658" text-anchor="end" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="11" fill="#93A1B0">P05 / 35</text>
  </g>

  <g id="pillar-hr">
    <rect x="64" y="148" width="368" height="412" rx="8" fill="#FFFFFF" stroke="#DCE5EE" stroke-width="1"/>
    <path d="M 72 148 h 352 a 8 8 0 0 1 8 8 v 64 h -368 v -64 a 8 8 0 0 1 8 -8 Z" fill="#1565C0" fill-opacity="0.10"/>
    <use data-icon="tabler-outline/briefcase" x="88" y="168" width="26" height="26" fill="#1565C0" stroke-width="2"/>
    <text x="126" y="188" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="20" font-weight="700" fill="#1565C0">HR 闭环</text>
    <line x1="88" y1="220" x2="408" y2="220" stroke="#DCE5EE" stroke-width="1"/>

    <line x1="102" y1="247" x2="102" y2="467" stroke="#1565C0" stroke-opacity="0.28" stroke-width="1" stroke-dasharray="4,4"/>
    <circle cx="102" cy="247" r="11" fill="#1565C0"/>
    <text x="102" y="251" text-anchor="middle" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="11" font-weight="700" fill="#FFFFFF">1</text>
    <text x="126" y="252" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="15" fill="#1F2733">建岗位（名称 + JD + 维度）</text>

    <circle cx="102" cy="291" r="11" fill="#1565C0"/>
    <text x="102" y="295" text-anchor="middle" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="11" font-weight="700" fill="#FFFFFF">2</text>
    <text x="126" y="296" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="15" fill="#1F2733">建面试并同步出题</text>

    <circle cx="102" cy="335" r="11" fill="#1565C0"/>
    <text x="102" y="339" text-anchor="middle" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="11" font-weight="700" fill="#FFFFFF">3</text>
    <text x="126" y="340" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="15" fill="#1F2733">逐题录入或修订回答</text>

    <circle cx="102" cy="379" r="11" fill="#1565C0"/>
    <text x="102" y="383" text-anchor="middle" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="11" font-weight="700" fill="#FFFFFF">4</text>
    <text x="126" y="384" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="15" fill="#1F2733">标记完成，收口本场面试</text>

    <circle cx="102" cy="423" r="11" fill="#1565C0"/>
    <text x="102" y="427" text-anchor="middle" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="11" font-weight="700" fill="#FFFFFF">5</text>
    <text x="126" y="428" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="15" fill="#1F2733">触发流式评估（SSE）</text>

    <circle cx="102" cy="467" r="11" fill="#1565C0"/>
    <text x="102" y="471" text-anchor="middle" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="11" font-weight="700" fill="#FFFFFF">6</text>
    <text x="126" y="472" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="15" fill="#1F2733">读报告，导出 DOCX / PDF</text>

    <line x1="88" y1="500" x2="408" y2="500" stroke="#DCE5EE" stroke-width="1"/>
    <text x="88" y="528" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="13" fill="#5A6B7D">产出：面试记录 · 评估报告 · 导出件</text>
  </g>

  <g id="pillar-candidate">
    <rect x="456" y="148" width="368" height="412" rx="8" fill="#FFFFFF" stroke="#DCE5EE" stroke-width="1"/>
    <path d="M 464 148 h 352 a 8 8 0 0 1 8 8 v 64 h -368 v -64 a 8 8 0 0 1 8 -8 Z" fill="#00897B" fill-opacity="0.10"/>
    <use data-icon="tabler-outline/user-check" x="480" y="168" width="26" height="26" fill="#00897B" stroke-width="2"/>
    <text x="518" y="188" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="20" font-weight="700" fill="#00897B">候选人闭环</text>
    <line x1="480" y1="220" x2="800" y2="220" stroke="#DCE5EE" stroke-width="1"/>

    <line x1="494" y1="247" x2="494" y2="467" stroke="#00897B" stroke-opacity="0.28" stroke-width="1" stroke-dasharray="4,4"/>
    <circle cx="494" cy="247" r="11" fill="#00897B"/>
    <text x="494" y="251" text-anchor="middle" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="11" font-weight="700" fill="#FFFFFF">1</text>
    <text x="518" y="252" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="15" fill="#1F2733">凭邀请码激活（公开端点）</text>

    <circle cx="494" cy="291" r="11" fill="#00897B"/>
    <text x="494" y="295" text-anchor="middle" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="11" font-weight="700" fill="#FFFFFF">2</text>
    <text x="518" y="296" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="15" fill="#1F2733">录入简历（粘贴或上传）</text>

    <circle cx="494" cy="335" r="11" fill="#00897B"/>
    <text x="494" y="339" text-anchor="middle" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="11" font-weight="700" fill="#FFFFFF">3</text>
    <text x="518" y="340" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="15" fill="#1F2733">关联到本场面试</text>

    <circle cx="494" cy="379" r="11" fill="#00897B"/>
    <text x="494" y="383" text-anchor="middle" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="11" font-weight="700" fill="#FFFFFF">4</text>
    <text x="518" y="384" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="15" fill="#1F2733">在线作答（实时保存）</text>

    <circle cx="494" cy="423" r="11" fill="#00897B"/>
    <text x="494" y="427" text-anchor="middle" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="11" font-weight="700" fill="#FFFFFF">5</text>
    <text x="518" y="428" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="15" fill="#1F2733">交卷（幂等，锁定通道）</text>

    <circle cx="494" cy="467" r="11" fill="#00897B"/>
    <text x="494" y="471" text-anchor="middle" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="11" font-weight="700" fill="#FFFFFF">6</text>
    <text x="518" y="472" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="15" fill="#1F2733">等 HR 收口，读脱敏反馈</text>

    <line x1="480" y1="500" x2="800" y2="500" stroke="#DCE5EE" stroke-width="1"/>
    <text x="480" y="528" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="13" fill="#5A6B7D">产出：脱敏反馈 · 刷题记录</text>
  </g>

  <g id="pillar-resume">
    <rect x="848" y="148" width="368" height="412" rx="8" fill="#FFFFFF" stroke="#DCE5EE" stroke-width="1"/>
    <path d="M 856 148 h 352 a 8 8 0 0 1 8 8 v 64 h -368 v -64 a 8 8 0 0 1 8 -8 Z" fill="#F57C00" fill-opacity="0.10"/>
    <use data-icon="tabler-outline/file-text" x="872" y="168" width="26" height="26" fill="#F57C00" stroke-width="2"/>
    <text x="910" y="188" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="20" font-weight="700" fill="#F57C00">简历驱动链路</text>
    <line x1="872" y1="220" x2="1192" y2="220" stroke="#DCE5EE" stroke-width="1"/>

    <line x1="886" y1="247" x2="886" y2="467" stroke="#F57C00" stroke-opacity="0.28" stroke-width="1" stroke-dasharray="4,4"/>
    <circle cx="886" cy="247" r="11" fill="#F57C00"/>
    <text x="886" y="251" text-anchor="middle" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="11" font-weight="700" fill="#FFFFFF">1</text>
    <text x="910" y="252" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="15" fill="#1F2733">HR 建面试并发邀请码</text>

    <circle cx="886" cy="291" r="11" fill="#F57C00"/>
    <text x="886" y="295" text-anchor="middle" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="11" font-weight="700" fill="#FFFFFF">2</text>
    <text x="910" y="296" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="15" fill="#1F2733">候选人激活并录简历</text>

    <circle cx="886" cy="335" r="11" fill="#F57C00"/>
    <text x="886" y="339" text-anchor="middle" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="11" font-weight="700" fill="#FFFFFF">3</text>
    <text x="910" y="340" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="15" fill="#1F2733">候选人把简历关联到面试</text>

    <circle cx="886" cy="379" r="11" fill="#F57C00"/>
    <text x="886" y="383" text-anchor="middle" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="11" font-weight="700" fill="#FFFFFF">4</text>
    <text x="910" y="384" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="15" fill="#1F2733">HR 读到简历，按简历补题</text>

    <circle cx="886" cy="423" r="11" fill="#F57C00"/>
    <text x="886" y="427" text-anchor="middle" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="11" font-weight="700" fill="#FFFFFF">5</text>
    <text x="910" y="428" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="15" fill="#1F2733">生成准备提纲，进入面试</text>

    <circle cx="886" cy="467" r="11" fill="#F57C00"/>
    <text x="886" y="471" text-anchor="middle" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="11" font-weight="700" fill="#FFFFFF">6</text>
    <text x="910" y="472" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="15" fill="#1F2733">评估 → 报告</text>

    <line x1="872" y1="500" x2="1192" y2="500" stroke="#DCE5EE" stroke-width="1"/>
    <text x="872" y="528" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="13" fill="#5A6B7D">产出：HR 可读的候选人简历</text>
  </g>

  <g id="conclusion-band">
    <rect x="64" y="580" width="1152" height="44" rx="8" fill="#E3EDF9"/>
    <use data-icon="tabler-outline/bulb" x="84" y="590" width="24" height="24" fill="#1565C0" stroke-width="2"/>
    <text x="120" y="608" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="16" fill="#1F2733">简历由<tspan font-weight="700" fill="#F57C00">候选人单侧提交</tspan> —— 被 HR 侧（补题）与候选人侧（刷题推荐）<tspan font-weight="700" fill="#1565C0">两个方向消费</tspan></text>
  </g>
</svg>
