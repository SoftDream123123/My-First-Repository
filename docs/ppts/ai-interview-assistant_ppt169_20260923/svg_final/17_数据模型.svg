  <g id="feedback-panel">
    <path fill="#FFFFFF" stroke="#DCE5EE" stroke-width="1" d="M892,364 H1208 A8,8 0 0 1 1216,372 V516 A8,8 0 0 1 1208,524 H892 A8,8 0 0 1 884,516 V372 A8,8 0 0 1 892,364 Z" />
    <text x="904" y="392" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="14" font-weight="700" fill="#F57C00">为什么独立成表</text>
    <text x="904" y="418" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="12" fill="#1F2733">candidate_feedback 没有做成</text>
    <text x="904" y="440" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="12" fill="#1F2733">report 的几个列 —— 两份文本</text>
    <text x="904" y="462" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="12" fill="#1F2733">受众不同（一个含去留判断），</text>
    <text x="904" y="484" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="12" fill="#1F2733">独立成表让<tspan font-weight="700" fill="#F57C00">可见性边界落在表这一层</tspan>：</text>
    <text x="904" y="506" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="12" fill="#1F2733">HR 报告接口结构上读不到它。</text>
  </g>

  <g id="omission-panel">
    <path fill="#F2F6FA" d="M892,540 H1208 A8,8 0 0 1 1216,548 V624 A8,8 0 0 1 1208,632 H892 A8,8 0 0 1 884,624 V548 A8,8 0 0 1 892,540 Z" />
    <text x="904" y="566" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="14" font-weight="700" fill="#C62828">两处刻意缺失</text>
    <text x="904" y="592" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="12" fill="#1F2733">不设 <tspan font-family="Consolas, Courier New, monospace" fill="#C62828">updated_at</tspan> —— 重评即整行重建</text>
    <text x="904" y="616" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="12" fill="#1F2733">不存总分 —— 改档位不必重新生成</text>
  </g>
