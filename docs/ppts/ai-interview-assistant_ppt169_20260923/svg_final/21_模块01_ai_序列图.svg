<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <defs>
    <linearGradient id="headerRule" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1565C0" />
      <stop offset="100%" stop-color="#1565C0" stop-opacity="0" />
    </linearGradient>
    <marker id="arrowBlue" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1565C0" />
    </marker>
    <marker id="arrowGray" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#93A1B0" />
    </marker>
  </defs>

  <g id="bg-base">
    <rect width="1280" height="720" fill="#FFFFFF" />
  </g>

  <g id="header">
    <text x="64" y="82" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="32" font-weight="700" fill="#1565C0">模块① ai：序列图与「只挑不生成」的结构性保证</text>
    <text x="1216" y="82" text-anchor="end" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="14" fill="#93A1B0">04 核心模块技术讲解</text>
    <line x1="64" y1="104" x2="1216" y2="104" stroke="url(#headerRule)" stroke-width="3" />
  </g>

  <g id="footer">
    <line x1="64" y1="636" x2="1216" y2="636" stroke="#DCE5EE" stroke-width="1" />
    <text x="64" y="658" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="11" fill="#93A1B0">AI 智能面试助手 · 技术解构</text>
    <text x="1216" y="658" text-anchor="end" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="11" fill="#93A1B0">P21 / 35</text>
  </g>

  <g id="seq-lifelines">
    <path fill="#E3EDF9" stroke="#1565C0" stroke-width="1" d="M86,160 H214 A6,6 0 0 1 220,166 V194 A6,6 0 0 1 214,200 H86 A6,6 0 0 1 80,194 V166 A6,6 0 0 1 86,160 Z" />
    <text x="150" y="184" text-anchor="middle" font-family="Consolas, Courier New, monospace" font-size="12" font-weight="700" fill="#1565C0">evaluation.service</text>
    <line x1="150" y1="200" x2="150" y2="396" stroke="#DCE5EE" stroke-width="1.5" stroke-dasharray="5,5" />

    <path fill="#E3EDF9" stroke="#1565C0" stroke-width="1" d="M336,160 H464 A6,6 0 0 1 470,166 V194 A6,6 0 0 1 464,200 H336 A6,6 0 0 1 330,194 V166 A6,6 0 0 1 336,160 Z" />
    <text x="400" y="184" text-anchor="middle" font-family="Consolas, Courier New, monospace" font-size="12" font-weight="700" fill="#1565C0">factory</text>
    <line x1="400" y1="200" x2="400" y2="396" stroke="#DCE5EE" stroke-width="1.5" stroke-dasharray="5,5" />

    <path fill="#E3EDF9" stroke="#1565C0" stroke-width="1" d="M591,160 H719 A6,6 0 0 1 725,166 V194 A6,6 0 0 1 719,200 H591 A6,6 0 0 1 585,194 V166 A6,6 0 0 1 591,160 Z" />
    <text x="655" y="184" text-anchor="middle" font-family="Consolas, Courier New, monospace" font-size="12" font-weight="700" fill="#1565C0">AIProvider</text>
    <line x1="655" y1="200" x2="655" y2="396" stroke="#DCE5EE" stroke-width="1.5" stroke-dasharray="5,5" />

    <path fill="#E3EDF9" stroke="#1565C0" stroke-width="1" d="M836,160 H964 A6,6 0 0 1 970,166 V194 A6,6 0 0 1 964,200 H836 A6,6 0 0 1 830,194 V166 A6,6 0 0 1 836,160 Z" />
    <text x="900" y="184" text-anchor="middle" font-family="Consolas, Courier New, monospace" font-size="12" font-weight="700" fill="#1565C0">Mock / OpenAI</text>
    <line x1="900" y1="200" x2="900" y2="396" stroke="#DCE5EE" stroke-width="1.5" stroke-dasharray="5,5" />

    <path fill="#E3EDF9" stroke="#1565C0" stroke-width="1" d="M1066,160 H1194 A6,6 0 0 1 1200,166 V194 A6,6 0 0 1 1194,200 H1066 A6,6 0 0 1 1060,194 V166 A6,6 0 0 1 1066,160 Z" />
    <text x="1130" y="184" text-anchor="middle" font-family="Consolas, Courier New, monospace" font-size="12" font-weight="700" fill="#1565C0">on_event</text>
    <line x1="1130" y1="200" x2="1130" y2="396" stroke="#DCE5EE" stroke-width="1.5" stroke-dasharray="5,5" />
  </g>

  <g id="seq-activations">
    <rect x="144" y="214" width="12" height="176" fill="#1565C0" fill-opacity="0.18" />
    <rect x="394" y="222" width="12" height="40" fill="#1565C0" fill-opacity="0.18" />
    <rect x="649" y="276" width="12" height="74" fill="#1565C0" fill-opacity="0.18" />
    <rect x="894" y="304" width="12" height="18" fill="#1565C0" fill-opacity="0.18" />
    <rect x="1124" y="360" width="12" height="18" fill="#1565C0" fill-opacity="0.18" />
  </g>

  <g id="seq-messages">
    <line x1="156" y1="232" x2="392" y2="232" stroke="#1565C0" stroke-width="1.5" marker-end="url(#arrowBlue)" />
    <text x="274" y="226" text-anchor="middle" font-family="Consolas, Courier New, monospace" font-size="12" fill="#1565C0">1  get_provider()</text>

    <line x1="394" y1="258" x2="158" y2="258" stroke="#93A1B0" stroke-width="1.5" stroke-dasharray="6,4" marker-end="url(#arrowGray)" />
    <text x="276" y="252" text-anchor="middle" font-family="Consolas, Courier New, monospace" font-size="12" fill="#5A6B7D">2  provider（缓存单例）</text>

    <line x1="156" y1="286" x2="647" y2="286" stroke="#1565C0" stroke-width="1.5" marker-end="url(#arrowBlue)" />
    <text x="401" y="280" text-anchor="middle" font-family="Consolas, Courier New, monospace" font-size="12" fill="#1565C0">3  evaluate_answer(dimension, question, answer)</text>

    <line x1="661" y1="312" x2="892" y2="312" stroke="#1565C0" stroke-width="1.5" marker-end="url(#arrowBlue)" />
    <text x="776" y="306" text-anchor="middle" font-family="Consolas, Courier New, monospace" font-size="12" fill="#1565C0">4  httpx 调用（真实分支）</text>

    <line x1="649" y1="342" x2="158" y2="342" stroke="#93A1B0" stroke-width="1.5" stroke-dasharray="6,4" marker-end="url(#arrowGray)" />
    <text x="403" y="336" text-anchor="middle" font-family="Consolas, Courier New, monospace" font-size="12" fill="#5A6B7D">5  QuestionScoreResult(score, comment)</text>

    <line x1="156" y1="368" x2="1122" y2="368" stroke="#1565C0" stroke-width="1.5" marker-end="url(#arrowBlue)" />
    <text x="639" y="362" text-anchor="middle" font-family="Consolas, Courier New, monospace" font-size="12" fill="#1565C0">6  on_event(...) 发布 SSE 事件</text>
  </g>

  <g id="problem-1">
    <path fill="#C62828" fill-opacity="0.06" d="M72,416 H496 A8,8 0 0 1 504,424 V508 A8,8 0 0 1 496,516 H72 A8,8 0 0 1 64,508 V424 A8,8 0 0 1 72,416 Z" />
    <rect x="64" y="416" width="4" height="100" fill="#C62828" />
    <path fill="#C62828" fill-opacity="0.12" d="M88,432 H132 A4,4 0 0 1 136,436 V450 A4,4 0 0 1 132,454 H88 A4,4 0 0 1 84,450 V436 A4,4 0 0 1 88,432 Z" />
    <text x="110" y="448" text-anchor="middle" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="11" font-weight="700" fill="#C62828">问题</text>
    <text x="84" y="478" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="13" fill="#1F2733">AI 有可能「编造」一道题库里根本不</text>
    <text x="84" y="500" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="13" fill="#1F2733">存在的题，用它冒充匹配结果 —— 让</text>
    <text x="84" y="522" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="13" fill="#1F2733">HR 以为这道题是从自己题库里挑的。</text>
  </g>

  <g id="solution-1">
    <path fill="#2E7D32" fill-opacity="0.06" d="M532,416 H1208 A8,8 0 0 1 1216,424 V508 A8,8 0 0 1 1208,516 H532 A8,8 0 0 1 524,508 V424 A8,8 0 0 1 532,416 Z" />
    <rect x="524" y="416" width="4" height="100" fill="#2E7D32" />
    <path fill="#2E7D32" fill-opacity="0.12" d="M548,432 H592 A4,4 0 0 1 596,436 V450 A4,4 0 0 1 592,454 H548 A4,4 0 0 1 544,450 V436 A4,4 0 0 1 548,432 Z" />
    <text x="570" y="448" text-anchor="middle" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="11" font-weight="700" fill="#2E7D32">解法</text>
    <text x="544" y="478" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="13" fill="#1F2733">两层<tspan font-weight="700" fill="#2E7D32">结构性保证</tspan>，不靠 prompt 自觉 ——</text>
    <text x="544" y="500" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="13" fill="#1F2733">① 返回类型 <tspan font-family="Consolas, Courier New, monospace" fill="#2E7D32">MatchedQuestion</tspan> 只有 question_id 与 reason，<tspan font-weight="700">没有题面字段</tspan> —— 编造在结构上无从表达</text>
    <text x="544" y="522" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="13" fill="#1F2733">② 解析时按池内 id 集合过滤，池外 id 全部丢弃；若返回内容却一条都没留下，抛错而非静默返回空数组</text>
  </g>

  <g id="problem-2">
    <path fill="#C62828" fill-opacity="0.06" d="M72,528 H496 A8,8 0 0 1 504,536 V616 A8,8 0 0 1 496,624 H72 A8,8 0 0 1 64,616 V536 A8,8 0 0 1 72,528 Z" />
    <rect x="64" y="528" width="4" height="96" fill="#C62828" />
    <path fill="#C62828" fill-opacity="0.12" d="M88,544 H132 A4,4 0 0 1 136,548 V562 A4,4 0 0 1 132,566 H88 A4,4 0 0 1 84,562 V548 A4,4 0 0 1 88,544 Z" />
    <text x="110" y="560" text-anchor="middle" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="11" font-weight="700" fill="#C62828">问题</text>
    <text x="84" y="590" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="13" fill="#1F2733">真实 Provider 调用失败时，</text>
    <text x="84" y="612" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="13" fill="#1F2733">要不要自动降级到 Mock？</text>
  </g>

  <g id="solution-2">
    <path fill="#2E7D32" fill-opacity="0.06" d="M532,528 H1208 A8,8 0 0 1 1216,536 V616 A8,8 0 0 1 1208,624 H532 A8,8 0 0 1 524,616 V536 A8,8 0 0 1 532,528 Z" />
    <rect x="524" y="528" width="4" height="96" fill="#2E7D32" />
    <path fill="#2E7D32" fill-opacity="0.12" d="M548,544 H592 A4,4 0 0 1 596,548 V562 A4,4 0 0 1 592,566 H548 A4,4 0 0 1 544,562 V548 A4,4 0 0 1 548,544 Z" />
    <text x="570" y="560" text-anchor="middle" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="11" font-weight="700" fill="#2E7D32">解法</text>
    <text x="544" y="590" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="13" fill="#1F2733"><tspan font-weight="700" fill="#2E7D32">绝不降级</tspan>。静默降级会把规则模板的输出伪装成 AI 评估结果，既误导用户又掩盖故障。</text>
    <text x="544" y="612" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="13" fill="#1F2733">失败即 <tspan font-family="Consolas, Courier New, monospace" fill="#C62828">502 AI_PROVIDER_ERROR</tspan>，由用户重试 —— 「没有」与「坏了」必须可区分。</text>
  </g>
</svg>