    <text x="992" y="247" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="11" fill="#5A6B7D">端点不得越层直接访问数据</text>

    <circle cx="974" cy="300" r="9" fill="#C62828" fill-opacity="0.12" />
    <path d="M 971,297 L 977,303 M 977,297 L 971,303" stroke="#C62828" stroke-width="1.6" fill="none" stroke-linecap="round" />
    <text x="992" y="305" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="13" font-weight="700" fill="#1F2733">repository 不依赖上层</text>
    <text x="992" y="325" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="11" fill="#5A6B7D">不得 import service / router</text>

    <circle cx="974" cy="378" r="9" fill="#C62828" fill-opacity="0.12" />
    <path d="M 971,375 L 977,381 M 977,375 L 971,381" stroke="#C62828" stroke-width="1.6" fill="none" stroke-linecap="round" />
    <text x="992" y="383" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="13" font-weight="700" fill="#1F2733">service 无 db.execute</text>
    <text x="992" y="403" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="11" fill="#5A6B7D">SQL 只允许出现在 repository</text>

    <circle cx="974" cy="456" r="9" fill="#C62828" fill-opacity="0.12" />
    <path d="M 971,453 L 977,459 M 977,453 L 971,459" stroke="#C62828" stroke-width="1.6" fill="none" stroke-linecap="round" />
    <text x="992" y="461" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="13" font-weight="700" fill="#1F2733">ai 不依赖业务模块</text>
    <text x="992" y="481" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="11" fill="#5A6B7D">因此可脱离数据库单测</text>

