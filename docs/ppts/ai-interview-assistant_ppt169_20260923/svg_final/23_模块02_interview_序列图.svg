    <text x="64" y="658" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="11" fill="#93A1B0">AI 智能面试助手 · 技术解构</text>
    <text x="1216" y="658" text-anchor="end" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="11" fill="#93A1B0">P23 / 35</text>
  </g>

  <g id="seq-lifelines">
    <path fill="#E3EDF9" stroke="#1565C0" stroke-width="1" d="M66,160 H174 A6,6 0 0 1 180,166 V194 A6,6 0 0 1 174,200 H66 A6,6 0 0 1 60,194 V166 A6,6 0 0 1 66,160 Z" />
    <text x="120" y="184" text-anchor="middle" font-family="Consolas, Courier New, monospace" font-size="12" font-weight="700" fill="#1565C0">HR（浏览器）</text>
    <line x1="120" y1="200" x2="120" y2="406" stroke="#DCE5EE" stroke-width="1.5" stroke-dasharray="5,5" />

    <path fill="#E3EDF9" stroke="#1565C0" stroke-width="1" d="M330,160 H438 A6,6 0 0 1 444,166 V194 A6,6 0 0 1 438,200 H330 A6,6 0 0 1 324,194 V166 A6,6 0 0 1 330,160 Z" />
    <text x="384" y="184" text-anchor="middle" font-family="Consolas, Courier New, monospace" font-size="12" font-weight="700" fill="#1565C0">interview.service</text>
    <line x1="384" y1="200" x2="384" y2="406" stroke="#DCE5EE" stroke-width="1.5" stroke-dasharray="5,5" />

    <path fill="#E3EDF9" stroke="#1565C0" stroke-width="1" d="M594,160 H702 A6,6 0 0 1 708,166 V194 A6,6 0 0 1 702,200 H594 A6,6 0 0 1 588,194 V166 A6,6 0 0 1 594,160 Z" />
    <text x="648" y="184" text-anchor="middle" font-family="Consolas, Courier New, monospace" font-size="12" font-weight="700" fill="#1565C0">question.service</text>
    <line x1="648" y1="200" x2="648" y2="406" stroke="#DCE5EE" stroke-width="1.5" stroke-dasharray="5,5" />

    <path fill="#E3EDF9" stroke="#1565C0" stroke-width="1" d="M858,160 H966 A6,6 0 0 1 972,166 V194 A6,6 0 0 1 966,200 H858 A6,6 0 0 1 852,194 V166 A6,6 0 0 1 858,160 Z" />
    <text x="912" y="184" text-anchor="middle" font-family="Consolas, Courier New, monospace" font-size="12" font-weight="700" fill="#1565C0">ai（Provider）</text>
    <line x1="912" y1="200" x2="912" y2="406" stroke="#DCE5EE" stroke-width="1.5" stroke-dasharray="5,5" />

    <path fill="#E3EDF9" stroke="#1565C0" stroke-width="1" d="M1096,160 H1204 A6,6 0 0 1 1210,166 V194 A6,6 0 0 1 1204,200 H1096 A6,6 0 0 1 1090,194 V166 A6,6 0 0 1 1096,160 Z" />
    <text x="1150" y="184" text-anchor="middle" font-family="Consolas, Courier New, monospace" font-size="12" font-weight="700" fill="#1565C0">repository</text>
    <line x1="1150" y1="200" x2="1150" y2="406" stroke="#DCE5EE" stroke-width="1.5" stroke-dasharray="5,5" />
  </g>

  <g id="seq-activations">
    <rect x="114" y="208" width="12" height="191" fill="#1565C0" fill-opacity="0.18" />
    <rect x="378" y="210" width="12" height="189" fill="#1565C0" fill-opacity="0.18" />
    <rect x="642" y="258" width="12" height="16" fill="#1565C0" fill-opacity="0.18" />
    <rect x="642" y="333" width="12" height="16" fill="#1565C0" fill-opacity="0.18" />
    <rect x="906" y="309" width="12" height="16" fill="#1565C0" fill-opacity="0.18" />
    <rect x="1144" y="234" width="12" height="16" fill="#1565C0" fill-opacity="0.18" />
    <rect x="1144" y="359" width="12" height="16" fill="#1565C0" fill-opacity="0.18" />
  </g>

  <g id="seq-messages">
    <line x1="126" y1="216" x2="376" y2="216" stroke="#1565C0" stroke-width="1.5" marker-end="url(#arrowBlue)" />
    <text x="251" y="210" text-anchor="middle" font-family="Consolas, Courier New, monospace" font-size="13" fill="#1565C0">1  POST /interviews</text>

    <line x1="390" y1="241" x2="1142" y2="241" stroke="#1565C0" stroke-width="1.5" marker-end="url(#arrowBlue)" />
    <text x="766" y="235" text-anchor="middle" font-family="Consolas, Courier New, monospace" font-size="13" fill="#1565C0">2  get_position()  读岗位与评估维度</text>

    <line x1="390" y1="266" x2="640" y2="266" stroke="#1565C0" stroke-width="1.5" marker-end="url(#arrowBlue)" />
    <text x="515" y="260" text-anchor="middle" font-family="Consolas, Courier New, monospace" font-size="13" fill="#1565C0">3  list_candidates_for_position()</text>

    <line x1="642" y1="291" x2="392" y2="291" stroke="#93A1B0" stroke-width="1.5" stroke-dasharray="6,4" marker-end="url(#arrowGray)" />
    <text x="517" y="285" text-anchor="middle" font-family="Consolas, Courier New, monospace" font-size="13" fill="#5A6B7D">4  候选池（已按 id 升序）</text>

    <line x1="390" y1="316" x2="904" y2="316" stroke="#1565C0" stroke-width="1.5" marker-end="url(#arrowBlue)" />
    <text x="647" y="310" text-anchor="middle" font-family="Consolas, Courier New, monospace" font-size="13" fill="#1565C0">5  generate_questions(need_ai)</text>

    <line x1="390" y1="341" x2="640" y2="341" stroke="#1565C0" stroke-width="1.5" marker-end="url(#arrowBlue)" />
    <text x="515" y="335" text-anchor="middle" font-family="Consolas, Courier New, monospace" font-size="13" fill="#1565C0">6  bulk_create_from_ai()</text>

    <line x1="390" y1="366" x2="1142" y2="366" stroke="#1565C0" stroke-width="1.5" marker-end="url(#arrowBlue)" />
    <text x="766" y="360" text-anchor="middle" font-family="Consolas, Courier New, monospace" font-size="13" fill="#1565C0">7  create_questions(items)</text>

    <line x1="378" y1="391" x2="128" y2="391" stroke="#93A1B0" stroke-width="1.5" stroke-dasharray="6,4" marker-end="url(#arrowGray)" />
    <text x="253" y="385" text-anchor="middle" font-family="Consolas, Courier New, monospace" font-size="13" fill="#5A6B7D">8  置 ongoing + db.commit()</text>
  </g>

  <g id="problem-1">
    <path fill="#C62828" fill-opacity="0.06" d="M72,424 H496 A8,8 0 0 1 504,432 V512 A8,8 0 0 1 496,520 H72 A8,8 0 0 1 64,512 V432 A8,8 0 0 1 72,424 Z" />
    <rect x="64" y="424" width="4" height="96" fill="#C62828" />
    <path fill="#C62828" fill-opacity="0.12" d="M88,440 H132 A4,4 0 0 1 136,444 V458 A4,4 0 0 1 132,462 H88 A4,4 0 0 1 84,458 V444 A4,4 0 0 1 88,440 Z" />
    <text x="110" y="456" text-anchor="middle" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="11" font-weight="700" fill="#C62828">问题</text>
    <text x="84" y="486" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="13" fill="#1F2733">出题后题目列表就写死了 —— 没有换题、</text>
    <text x="84" y="508" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="13" fill="#1F2733">也没有删题接口。但候选人的简历是在</text>
    <text x="84" y="530" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="13" fill="#1F2733">面试创建之后才提交的，那时才知道该考什么。</text>
  </g>

  <g id="solution-1">
    <path fill="#2E7D32" fill-opacity="0.06" d="M532,424 H1208 A8,8 0 0 1 1216,432 V512 A8,8 0 0 1 1208,520 H532 A8,8 0 0 1 524,512 V432 A8,8 0 0 1 532,424 Z" />
    <rect x="524" y="424" width="4" height="96" fill="#2E7D32" />
    <path fill="#2E7D32" fill-opacity="0.12" d="M548,440 H592 A4,4 0 0 1 596,444 V458 A4,4 0 0 1 592,462 H548 A4,4 0 0 1 544,458 V444 A4,4 0 0 1 548,440 Z" />
    <text x="570" y="456" text-anchor="middle" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="11" font-weight="700" fill="#2E7D32">解法</text>
    <text x="544" y="486" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="13" fill="#1F2733">把「按简历补题」设计为<tspan font-weight="700" fill="#2E7D32">唯一的加题例外</tspan>，且<tspan font-weight="700">只追加、不改动既有题目</tspan>：</text>
    <text x="544" y="508" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="13" fill="#1F2733">seq 续接本场最大值，<tspan font-family="Consolas, Courier New, monospace" fill="#2E7D32">source_snapshot</tspan> 记为 resume_match，</text>
    <text x="544" y="530" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="13" fill="#1F2733">match_reason 写入 AI 给出的理由 —— 补的每一题都能追溯到依据。</text>
  </g>

  <g id="problem-2">
    <path fill="#C62828" fill-opacity="0.06" d="M72,528 H496 A8,8 0 0 1 504,536 V616 A8,8 0 0 1 496,624 H72 A8,8 0 0 1 64,616 V536 A8,8 0 0 1 72,528 Z" />
    <rect x="64" y="528" width="4" height="96" fill="#C62828" />
    <path fill="#C62828" fill-opacity="0.12" d="M88,544 H132 A4,4 0 0 1 136,548 V562 A4,4 0 0 1 132,566 H88 A4,4 0 0 1 84,562 V548 A4,4 0 0 1 88,544 Z" />
    <text x="110" y="560" text-anchor="middle" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="11" font-weight="700" fill="#C62828">问题</text>
    <text x="84" y="590" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="13" fill="#1F2733">HR 连点几次「按简历补题」，</text>
    <text x="84" y="612" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="13" fill="#1F2733">会不会出一堆重复题？</text>
  </g>

  <g id="solution-2">
    <path fill="#2E7D32" fill-opacity="0.06" d="M532,528 H1208 A8,8 0 0 1 1216,536 V616 A8,8 0 0 1 1208,624 H532 A8,8 0 0 1 524,616 V536 A8,8 0 0 1 532,528 Z" />
    <rect x="524" y="528" width="4" height="96" fill="#2E7D32" />
    <path fill="#2E7D32" fill-opacity="0.12" d="M548,544 H592 A4,4 0 0 1 596,548 V562 A4,4 0 0 1 592,566 H548 A4,4 0 0 1 544,562 V548 A4,4 0 0 1 548,544 Z" />
    <text x="570" y="560" text-anchor="middle" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="11" font-weight="700" fill="#2E7D32">解法</text>
    <text x="544" y="590" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="13" fill="#1F2733"><tspan font-weight="700" fill="#2E7D32">幂等的准确含义</tspan>：候选池剔除本场已有的 <tspan font-family="Consolas, Courier New, monospace" fill="#2E7D32">question_id</tspan>，故不会出重复题；</text>
    <text x="544" y="612" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="13" fill="#1F2733">但池子变小后 AI 会挑下一批，所以每次调用都会再加 count 题 —— 界面必须显示本场总数。</text>
  </g>
</svg>