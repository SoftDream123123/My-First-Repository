<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <defs>
    <linearGradient id="headerRule" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1565C0" />
      <stop offset="100%" stop-color="#1565C0" stop-opacity="0" />
    </linearGradient>
  </defs>

  <g id="bg-base">
    <rect width="1280" height="720" fill="#FFFFFF" />
  </g>

  <g id="header">
    <text x="64" y="82" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="32" font-weight="700" fill="#1565C0">已知局限与踩过的坑</text>
    <text x="1216" y="82" text-anchor="end" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="14" fill="#93A1B0">05 收获与展望</text>
    <line x1="64" y1="104" x2="1216" y2="104" stroke="url(#headerRule)" stroke-width="3" />
  </g>

  <g id="footer">
    <line x1="64" y1="636" x2="1216" y2="636" stroke="#DCE5EE" stroke-width="1" />
    <text x="64" y="658" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="11" fill="#93A1B0">AI 智能面试助手 · 技术解构</text>
    <text x="1216" y="658" text-anchor="end" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="11" fill="#93A1B0">P34 / 35</text>
  </g>

  <g id="limit-1">
    <path fill="#F2F6FA" d="M72,148 H1208 A8,8 0 0 1 1216,156 V220 A8,8 0 0 1 1208,228 H72 A8,8 0 0 1 64,220 V156 A8,8 0 0 1 72,148 Z" />
    <rect x="64" y="148" width="4" height="80" fill="#F57C00" />
    
  <g transform="translate(88.0, 164.0) scale(0.9166666666666666)" fill="none" stroke="#F57C00" stroke-width="2">
    <path d="M3 7a3 3 0 0 1 3 -3h12a3 3 0 0 1 3 3v2a3 3 0 0 1 -3 3h-12a3 3 0 0 1 -3 -3" />
    <path d="M3 15a3 3 0 0 1 3 -3h12a3 3 0 0 1 3 3v2a3 3 0 0 1 -3 3h-12a3 3 0 0 1 -3 -3l0 -2" />
    <path d="M7 8l0 .01" />
    <path d="M7 16l0 .01" />
  </g>
    <text x="124" y="180" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="16" font-weight="700" fill="#1F2733">单进程部署是硬约束</text>
    <text x="124" y="202" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="12" fill="#1F2733">SSE 运行注册表与刷题限流计数都在进程内，因此必须 <tspan font-family="Consolas, Courier New, monospace" fill="#C62828">--workers 1</tspan>。</text>
    <text x="124" y="220" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="12" fill="#5A6B7D">代价：要支持多 worker，须改用 Redis pub/sub 或 Celery + 结果后端。</text>
  </g>

  <g id="limit-2">
    <path fill="#F2F6FA" d="M72,236 H1208 A8,8 0 0 1 1216,244 V308 A8,8 0 0 1 1208,316 H72 A8,8 0 0 1 64,308 V244 A8,8 0 0 1 72,236 Z" />
    <rect x="64" y="236" width="4" height="80" fill="#F57C00" />
    
  <g transform="translate(88.0, 252.0) scale(0.9166666666666666)" fill="none" stroke="#F57C00" stroke-width="2">
    <path d="M12 8l0 4l2 2" />
    <path d="M3.05 11a9 9 0 1 1 .5 4m-.5 5v-5h5" />
  </g>
    <text x="124" y="268" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="16" font-weight="700" fill="#1F2733">评估与作答都不留历史版本</text>
    <text x="124" y="290" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="12" fill="#1F2733">同一面试只保留最近一次评估结果；HR 覆盖候选人作答时只保留最新内容。</text>
    <text x="124" y="308" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="12" fill="#5A6B7D">代价：无法回溯「上一次评估给了多少分」，也无从对比候选人的修改轨迹。</text>
  </g>

  <g id="limit-3">
    <path fill="#F2F6FA" d="M72,324 H1208 A8,8 0 0 1 1216,332 V396 A8,8 0 0 1 1208,404 H72 A8,8 0 0 1 64,396 V332 A8,8 0 0 1 72,324 Z" />
    <rect x="64" y="324" width="4" height="80" fill="#F57C00" />
    
  <g transform="translate(88.0, 340.0) scale(0.9166666666666666)" fill="none" stroke="#F57C00" stroke-width="2">
    <path d="M16.555 3.843l3.602 3.602a2.877 2.877 0 0 1 0 4.069l-2.643 2.643a2.877 2.877 0 0 1 -4.069 0l-.301 -.301l-6.558 6.558a2 2 0 0 1 -1.239 .578l-.175 .008h-1.172a1 1 0 0 1 -.993 -.883l-.007 -.117v-1.172a2 2 0 0 1 .467 -1.284l.119 -.13l.414 -.414h2v-2h2v-2l2.144 -2.144l-.301 -.301a2.877 2.877 0 0 1 0 -4.069l2.643 -2.643a2.877 2.877 0 0 1 4.069 0" />
    <path d="M15 9h.01" />
  </g>
    <text x="124" y="356" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="16" font-weight="700" fill="#1F2733">邀请码明文存储</text>
    <text x="124" y="378" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="12" fill="#1F2733">HR 需要在系统内复制并转达，因此无法哈希存储。</text>
    <text x="124" y="396" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="12" fill="#5A6B7D">缓解：长码（约 128 位熵）+ 短有效期 + 一次性 + 可撤销，四者叠加使用。</text>
  </g>

  <g id="limit-4">
    <path fill="#F2F6FA" d="M72,412 H1208 A8,8 0 0 1 1216,420 V484 A8,8 0 0 1 1208,492 H72 A8,8 0 0 1 64,484 V420 A8,8 0 0 1 72,412 Z" />
    <rect x="64" y="412" width="4" height="80" fill="#F57C00" />
    
  <g transform="translate(88.0, 428.0) scale(0.9166666666666666)" fill="none" stroke="#F57C00" stroke-width="2">
    <path d="M12 3l9.5 7l-3.5 11h-12l-3.5 -11l9.5 -7" />
    <path d="M12 7.5l5.5 4l-2.5 5.5h-6.5l-2 -5.5l5.5 -4" />
    <path d="M2.5 10l9.5 3l9.5 -3" />
    <path d="M12 3v10l6 8" />
    <path d="M6 21l6 -8" />
  </g>
    <text x="124" y="444" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="16" font-weight="700" fill="#1F2733">刷题推荐只从池内挑</text>
    <text x="124" y="466" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="12" fill="#1F2733">候选池是 <tspan font-family="Consolas, Courier New, monospace">min(size×4, 100)</tspan> 条；超出池上限时，排在后面的题永远进不了推荐。</text>
    <text x="124" y="484" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="12" fill="#5A6B7D">代价：题库越大，长尾题目越难被练到 —— 这是一次有意的成本取舍。</text>
  </g>

  <g id="limit-5">
    <path fill="#F2F6FA" d="M72,500 H1208 A8,8 0 0 1 1216,508 V572 A8,8 0 0 1 1208,580 H72 A8,8 0 0 1 64,572 V508 A8,8 0 0 1 72,500 Z" />
    <rect x="64" y="500" width="4" height="80" fill="#F57C00" />
    
  <g transform="translate(88.0, 516.0) scale(0.9166666666666666)" fill="none" stroke="#F57C00" stroke-width="2">
    <path d="M4 17v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2 -2v-2" />
    <path d="M7 9l5 -5l5 5" />
    <path d="M12 4l0 12" />
  </g>
    <text x="124" y="532" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="16" font-weight="700" fill="#1F2733">上传体积上限拦不住「服务器已经收完的请求体」</text>
    <text x="124" y="554" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="12" fill="#1F2733">Starlette 在进入视图函数前已把请求体缓冲下来，<tspan font-family="Consolas, Courier New, monospace">read(limit+1)</tspan> 省的是<tspan font-weight="700">我们的</tspan>内存，不是服务器的。</text>
    <text x="124" y="572" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="12" fill="#5A6B7D">真正在请求发出前拦住大文件的是前端那道 <tspan font-family="Consolas, Courier New, monospace">file.size</tspan> 预检 —— 这是前后端各一半的防线。</text>
  </g>

  <g id="closing-band">
    <path fill="#C62828" fill-opacity="0.07" d="M72,592 H1208 A8,8 0 0 1 1216,600 V624 A8,8 0 0 1 1208,632 H72 A8,8 0 0 1 64,624 V600 A8,8 0 0 1 72,592 Z" />
    
  <g transform="translate(84.0, 600.0) scale(0.9166666666666666)" fill="none" stroke="#C62828" stroke-width="2">
    <path d="M9 9v-1a3 3 0 0 1 6 0v1" />
    <path d="M8 9h8a6 6 0 0 1 1 3v3a5 5 0 0 1 -10 0v-3a6 6 0 0 1 1 -3" />
    <path d="M3 13l4 0" />
    <path d="M17 13l4 0" />
    <path d="M12 20l0 -6" />
    <path d="M4 19l3.35 -2" />
    <path d="M20 19l-3.35 -2" />
    <path d="M4 7l3.75 2.4" />
    <path d="M20 7l-3.75 2.4" />
  </g>
    <text x="116" y="617" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="13" fill="#1F2733">一条测试方法上的教训：变异检查（把缺陷植回去、断言必须失败）至今做了 <tspan font-weight="700" fill="#C62828">33 次</tspan>，抓出 5 个真 bug + 6 处原型与真实契约的偏差 —— 其中一个是<tspan font-weight="700" fill="#C62828">看截图看出来的</tspan>，断言当时是绿的。</text>
  </g>
</svg>