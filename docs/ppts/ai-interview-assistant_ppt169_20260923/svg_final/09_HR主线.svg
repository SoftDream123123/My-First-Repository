    <text x="220" y="564" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="14" fill="#5A6B7D">回退目标由「库里有没有旧报告」决定：有则回 evaluated，无则回 completed</text>
