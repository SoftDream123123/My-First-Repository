  </g>
    <text x="896" y="552" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="14" font-weight="700" fill="#F57C00">签名刻意不接 user</text>
    <text x="868" y="578" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="12" fill="#1F2733">绑定到哪个账号由请求体的 username</text>
    <text x="868" y="598" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="12" fill="#1F2733">决定，与调用者身份无关。签名里放一个</text>
    <text x="868" y="616" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="12" fill="#5A6B7D">不用的 user 会误导「绑定当前登录者」。</text>
  </g>
</svg>