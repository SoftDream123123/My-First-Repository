    <path fill="#FFFFFF" stroke="#DCE5EE" stroke-width="1" d="M932,398 H1042 A4,4 0 0 1 1046,402 V422 A4,4 0 0 1 1042,426 H932 A4,4 0 0 1 928,422 V402 A4,4 0 0 1 932,398 Z" />
    <text x="987" y="417" text-anchor="middle" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="12" fill="#1F2733">已接受</text>
    <path fill="#FFFFFF" stroke="#DCE5EE" stroke-width="1" d="M1062,398 H1172 A4,4 0 0 1 1176,402 V422 A4,4 0 0 1 1172,426 H1062 A4,4 0 0 1 1058,422 V402 A4,4 0 0 1 1062,398 Z" />
