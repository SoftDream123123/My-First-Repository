  <g id="header">
    <text x="64" y="82" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="32" font-weight="700" fill="#1565C0">模块④ interview：作答邀请的并发接受</text>
    <text x="1216" y="82" text-anchor="end" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="14" fill="#93A1B0">04 核心模块技术讲解</text>
    <line x1="64" y1="104" x2="1216" y2="104" stroke="url(#headerRule)" stroke-width="3" />
  </g>

  <g id="footer">
    <line x1="64" y1="636" x2="1216" y2="636" stroke="#DCE5EE" stroke-width="1" />
    <text x="64" y="658" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="11" fill="#93A1B0">AI 智能面试助手 · 技术解构</text>
    <text x="1216" y="658" text-anchor="end" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="11" fill="#93A1B0">P27 / 35</text>
  </g>

  <g id="code-block">
    <rect x="64" y="182" width="536" height="318" fill="#F2F6FA" />
    <path d="M 72 148 h 520 a 8 8 0 0 1 8 8 v 26 h -536 v -26 a 8 8 0 0 1 8 -8 Z" fill="#E3EDF9" />
    
  <g transform="translate(80.0, 156.0) scale(0.8333333333333334)" fill="none" stroke="#1565C0" stroke-width="2">
    <path d="M5 4l-2 2l2 2" />
    <path d="M12 4l2 2l-2 2" />
    <path d="M8 8l1 -4" />
    <path d="M17 6a2 2 0 0 1 2 2v10a2 2 0 0 1 -2 2h-10a2 2 0 0 1 -2 -2v-7" />
  </g>
    <text x="108" y="171" font-family="Consolas, Courier New, monospace" font-size="12" fill="#1565C0">backend/app/interview/service.py:1094-1116</text>
    <path fill="none" stroke="#DCE5EE" stroke-width="1" d="M72,148 H592 A8,8 0 0 1 600,156 V492 A8,8 0 0 1 592,500 H72 A8,8 0 0 1 64,492 V156 A8,8 0 0 1 72,148 Z" />

    <text x="84" y="202" font-family="Consolas, Courier New, monospace" font-size="14" fill="#1F2733">candidate = auth_service.create_candidate_account(</text>
    <text x="84" y="218" font-family="Consolas, Courier New, monospace" font-size="14" fill="#1F2733">    db, username, password</text>
    <text x="84" y="234" font-family="Consolas, Courier New, monospace" font-size="14" fill="#1F2733">)</text>
    <text x="84" y="250" font-family="Consolas, Courier New, monospace" font-size="14" fill="#C62828"># ---- 临界区：一次性接受必须串行化 ----</text>
    <text x="84" y="266" font-family="Consolas, Courier New, monospace" font-size="14" fill="#93A1B0"># 加锁放在 create_candidate_account 之后：</text>
    <text x="84" y="282" font-family="Consolas, Courier New, monospace" font-size="14" fill="#93A1B0"># 新建账号会 commit，而 commit 释放本事务</text>
    <text x="84" y="298" font-family="Consolas, Courier New, monospace" font-size="14" fill="#93A1B0"># 已持有的锁 —— 先加锁等于白加。</text>
    <text x="84" y="314" font-family="Consolas, Courier New, monospace" font-size="14" fill="#F57C00">repository.lock_interview(db, invitation.interview_id)</text>
    <text x="84" y="330" font-family="Consolas, Courier New, monospace" font-size="14" fill="#93A1B0"># 用当前读：本事务快照可能早于并发事务的提交，</text>
    <text x="84" y="346" font-family="Consolas, Courier New, monospace" font-size="14" fill="#93A1B0"># 快照读会漏判这条已被写入的接受记录。</text>
    <text x="84" y="362" font-family="Consolas, Courier New, monospace" font-size="14" fill="#1F2733">if repository.get_accepted_invitation(</text>
    <text x="84" y="378" font-family="Consolas, Courier New, monospace" font-size="14" fill="#1F2733">    db, invitation.interview_id, candidate.id, for_update=True</text>
    <text x="84" y="394" font-family="Consolas, Courier New, monospace" font-size="14" fill="#1F2733">) is not None:</text>
    <text x="84" y="410" font-family="Consolas, Courier New, monospace" font-size="14" fill="#C62828">    raise BusinessError("你已接受过该面试的邀请")</text>
    <text x="84" y="426" font-family="Consolas, Courier New, monospace" font-size="14" fill="#93A1B0"># 同一条码被并发接受：拿到锁后重新当前读，</text>
    <text x="84" y="442" font-family="Consolas, Courier New, monospace" font-size="14" fill="#93A1B0"># 确认它仍是 pending。</text>
    <text x="84" y="458" font-family="Consolas, Courier New, monospace" font-size="14" fill="#1F2733">invitation = repository.get_invitation_by_code(</text>
    <text x="84" y="474" font-family="Consolas, Courier New, monospace" font-size="14" fill="#1F2733">    db, code, for_update=True</text>
  </g>

  <g id="concurrency-diagram">
    <path fill="#FFFFFF" stroke="#1565C0" stroke-width="1.5" d="M654,168 H882 A6,6 0 0 1 888,174 V206 A6,6 0 0 1 882,212 H654 A6,6 0 0 1 648,206 V174 A6,6 0 0 1 654,168 Z" />
