    <text x="768" y="204" text-anchor="middle" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="11" fill="#5A6B7D">同一候选人的第一条码</text>

    <path fill="#FFFFFF" stroke="#1565C0" stroke-width="1.5" d="M934,168 H1162 A6,6 0 0 1 1168,174 V206 A6,6 0 0 1 1162,212 H934 A6,6 0 0 1 928,206 V174 A6,6 0 0 1 934,168 Z" />
    <text x="1048" y="187" text-anchor="middle" font-family="Consolas, Courier New, monospace" font-size="13" fill="#1565C0">请求 B  accept(code₂)</text>
    <text x="1048" y="204" text-anchor="middle" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="11" fill="#5A6B7D">同一候选人的第二条码</text>

    <line x1="768" y1="212" x2="768" y2="228" stroke="#1565C0" stroke-width="1.5" marker-end="url(#arrowBlue)" />
    <line x1="1048" y1="212" x2="1048" y2="228" stroke="#1565C0" stroke-width="1.5" marker-end="url(#arrowBlue)" />

    <path fill="#C62828" fill-opacity="0.10" stroke="#C62828" stroke-width="1.5" d="M654,232 H1162 A6,6 0 0 1 1168,238 V262 A6,6 0 0 1 1162,268 H654 A6,6 0 0 1 648,262 V238 A6,6 0 0 1 654,232 Z" />
    
  <g transform="translate(666.0, 241.0) scale(0.75)" fill="none" stroke="#C62828" stroke-width="2">
    <path d="M5 13a2 2 0 0 1 2 -2h10a2 2 0 0 1 2 2v6a2 2 0 0 1 -2 2h-10a2 2 0 0 1 -2 -2v-6" />
    <path d="M11 16a1 1 0 1 0 2 0a1 1 0 0 0 -2 0" />
