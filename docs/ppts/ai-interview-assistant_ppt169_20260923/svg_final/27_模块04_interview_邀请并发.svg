    <path fill="#FFFFFF" stroke="#DCE5EE" stroke-width="1" d="M802,398 H912 A4,4 0 0 1 916,402 V422 A4,4 0 0 1 912,426 H802 A4,4 0 0 1 798,422 V402 A4,4 0 0 1 802,398 Z" />
