  </g>
    <text x="694" y="255" font-family="Consolas, Courier New, monospace" font-size="13" font-weight="700" fill="#C62828">SELECT … FOR UPDATE</text>
    <text x="1150" y="255" text-anchor="end" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="12" fill="#C62828">面试行锁 · 串行化同一场面试的接受</text>

    <line x1="768" y1="268" x2="768" y2="284" stroke="#1565C0" stroke-width="1.5" marker-end="url(#arrowBlue)" />
    <line x1="1048" y1="268" x2="1048" y2="284" stroke="#1565C0" stroke-width="1.5" marker-end="url(#arrowBlue)" />

    <path fill="#2E7D32" fill-opacity="0.08" stroke="#2E7D32" stroke-width="1.5" d="M654,288 H882 A6,6 0 0 1 888,294 V326 A6,6 0 0 1 882,332 H654 A6,6 0 0 1 648,326 V294 A6,6 0 0 1 654,288 Z" />
    <text x="768" y="308" text-anchor="middle" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="13" font-weight="700" fill="#2E7D32">① 先到者：写入绑定 → 200</text>
    <text x="768" y="325" text-anchor="middle" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="11" fill="#5A6B7D">接受记录落库</text>

    <path fill="#C62828" fill-opacity="0.08" stroke="#C62828" stroke-width="1.5" d="M934,288 H1162 A6,6 0 0 1 1168,294 V326 A6,6 0 0 1 1162,332 H934 A6,6 0 0 1 928,326 V294 A6,6 0 0 1 934,288 Z" />
    <text x="1048" y="308" text-anchor="middle" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="13" font-weight="700" fill="#C62828">② 后到者：复查命中 → 拒绝</text>
    <text x="1048" y="325" text-anchor="middle" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="11" fill="#5A6B7D">「你已接受过该面试的邀请」</text>
  </g>

  <g id="invalidation-panel">
