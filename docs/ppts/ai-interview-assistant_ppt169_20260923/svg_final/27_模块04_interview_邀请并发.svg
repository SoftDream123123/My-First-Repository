    <text x="668" y="452" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="13" fill="#1F2733">响应里<tspan font-weight="700" fill="#C62828">不出现任何面试信息</tspan> —— 否则这个公开端点会变成邀请码探测接口。</text>
    <text x="668" y="476" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="13" fill="#1F2733">码为 <tspan font-family="Consolas, Courier New, monospace" fill="#1565C0">secrets.token_urlsafe(16)</tspan>：22 个 URL-safe 字符、约 128 位熵。</text>
  </g>

  <g id="design-decisions">
    <path fill="#FFFFFF" stroke="#DCE5EE" stroke-width="1" d="M72,520 H424 A8,8 0 0 1 432,528 V616 A8,8 0 0 1 424,624 H72 A8,8 0 0 1 64,616 V528 A8,8 0 0 1 72,520 Z" />
    
  <g transform="translate(84.0, 536.0) scale(0.8333333333333334)" fill="none" stroke="#00897B" stroke-width="2">
    <path d="M16.555 3.843l3.602 3.602a2.877 2.877 0 0 1 0 4.069l-2.643 2.643a2.877 2.877 0 0 1 -4.069 0l-.301 -.301l-6.558 6.558a2 2 0 0 1 -1.239 .578l-.175 .008h-1.172a1 1 0 0 1 -.993 -.883l-.007 -.117v-1.172a2 2 0 0 1 .467 -1.284l.119 -.13l.414 -.414h2v-2h2v-2l2.144 -2.144l-.301 -.301a2.877 2.877 0 0 1 0 -4.069l2.643 -2.643a2.877 2.877 0 0 1 4.069 0" />
