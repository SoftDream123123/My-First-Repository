    <text x="112" y="552" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="14" font-weight="700" fill="#00897B">accept 是公开端点</text>
    <text x="84" y="578" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="12" fill="#1F2733">拿码的人往往<tspan font-weight="700">还没有账号</tspan>；要求他</text>
    <text x="84" y="598" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="12" fill="#1F2733">先登录才能激活，会让整条邀请链</text>
    <text x="84" y="616" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="12" fill="#5A6B7D">自相矛盾（没账号 → 没 token）。</text>

    <path fill="#FFFFFF" stroke="#DCE5EE" stroke-width="1" d="M464,520 H816 A8,8 0 0 1 824,528 V616 A8,8 0 0 1 816,624 H464 A8,8 0 0 1 456,616 V528 A8,8 0 0 1 464,520 Z" />
    
