    <text x="668" y="384" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="14" font-weight="700" fill="#1565C0">四种失效原因 · 返回同一文案</text>
    <path fill="#FFFFFF" stroke="#DCE5EE" stroke-width="1" d="M672,398 H782 A4,4 0 0 1 786,402 V422 A4,4 0 0 1 782,426 H672 A4,4 0 0 1 668,422 V402 A4,4 0 0 1 672,398 Z" />
