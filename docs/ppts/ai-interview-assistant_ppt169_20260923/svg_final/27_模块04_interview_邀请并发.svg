    <path d="M8 7a4 4 0 1 0 8 0a4 4 0 0 0 -8 0" />
    <path d="M6 21v-2a4 4 0 0 1 4 -4h4" />
    <path d="M15 19l2 2l4 -4" />
  </g>
    <text x="504" y="552" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="14" font-weight="700" fill="#1565C0">账号创建委托 auth</text>
    <text x="476" y="578" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="12" fill="#1F2733">调 <tspan font-family="Consolas, Courier New, monospace" fill="#1565C0">create_candidate_account</tspan>，</text>
    <text x="476" y="598" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="12" fill="#1F2733">不在 interview 里复制「用户名唯一性 /</text>
    <text x="476" y="616" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="12" fill="#5A6B7D">密码哈希 / 角色约束」这三条规则。</text>

    <path fill="#FFFFFF" stroke="#DCE5EE" stroke-width="1" d="M856,520 H1208 A8,8 0 0 1 1216,528 V616 A8,8 0 0 1 1208,624 H856 A8,8 0 0 1 848,616 V528 A8,8 0 0 1 856,520 Z" />
    
