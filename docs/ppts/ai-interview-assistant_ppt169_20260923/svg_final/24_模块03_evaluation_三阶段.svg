    <text x="104" y="366" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="13" fill="#5A6B7D">产出 DimensionScoreResult</text>
  </g>

  <g id="stage-3">
    <path fill="#FFFFFF" stroke="#2E7D32" stroke-width="1.5" d="M72,400 H592 A8,8 0 0 1 600,408 V502 A8,8 0 0 1 592,510 H72 A8,8 0 0 1 64,502 V408 A8,8 0 0 1 72,400 Z" />
