    <text x="130" y="312" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="17" font-weight="700" fill="#1F2733">多维评分</text>
    <path fill="#00897B" fill-opacity="0.10" d="M442,290 H576 A4,4 0 0 1 580,294 V310 A4,4 0 0 1 576,314 H442 A4,4 0 0 1 438,310 V294 A4,4 0 0 1 442,290 Z" />
