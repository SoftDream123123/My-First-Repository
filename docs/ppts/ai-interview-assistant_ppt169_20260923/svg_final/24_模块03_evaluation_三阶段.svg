  <g id="code-block">
    <rect x="624" y="182" width="592" height="328" fill="#F2F6FA" />
    <path d="M 632 148 h 576 a 8 8 0 0 1 8 8 v 26 h -592 v -26 a 8 8 0 0 1 8 -8 Z" fill="#E3EDF9" />
    
  <g transform="translate(640.0, 156.0) scale(0.8333333333333334)" fill="none" stroke="#1565C0" stroke-width="2">
    <path d="M5 4l-2 2l2 2" />
    <path d="M12 4l2 2l-2 2" />
    <path d="M8 8l1 -4" />
    <path d="M17 6a2 2 0 0 1 2 2v10a2 2 0 0 1 -2 2h-10a2 2 0 0 1 -2 -2v-7" />
  </g>
    <text x="668" y="171" font-family="Consolas, Courier New, monospace" font-size="12" fill="#1565C0">backend/app/evaluation/stream.py:137-154 · 114</text>
    <path fill="none" stroke="#DCE5EE" stroke-width="1" d="M632,148 H1208 A8,8 0 0 1 1216,156 V502 A8,8 0 0 1 1208,510 H632 A8,8 0 0 1 624,502 V156 A8,8 0 0 1 632,148 Z" />

    <text x="644" y="202" font-family="Consolas, Courier New, monospace" font-size="15" fill="#1F2733">def <tspan fill="#1565C0" font-weight="700">_evaluate_in_thread</tspan>(interview_id: int, run) -&gt; None:</text>
    <text x="644" y="217" font-family="Consolas, Courier New, monospace" font-size="15" fill="#5A6B7D">    """后台线程：拥有独立的 DB 会话（Session 非线程安全）。"""</text>
    <text x="644" y="232" font-family="Consolas, Courier New, monospace" font-size="15" fill="#1F2733">    db: Session = SessionLocal()</text>
    <text x="644" y="247" font-family="Consolas, Courier New, monospace" font-size="15" fill="#1F2733">    try:</text>
    <text x="644" y="262" font-family="Consolas, Courier New, monospace" font-size="15" fill="#1F2733">        evaluation_service.evaluate_interview(</text>
    <text x="644" y="277" font-family="Consolas, Courier New, monospace" font-size="15" fill="#1F2733">            db, interview_id,</text>
    <text x="644" y="292" font-family="Consolas, Courier New, monospace" font-size="15" fill="#1F2733">            lambda event: publish(run, event.name, event.payload),</text>
    <text x="644" y="307" font-family="Consolas, Courier New, monospace" font-size="15" fill="#1F2733">        )</text>
    <text x="644" y="322" font-family="Consolas, Courier New, monospace" font-size="15" fill="#2E7D32">        publish_terminal(run, "done", {...}, RUN_DONE)</text>
    <text x="644" y="337" font-family="Consolas, Courier New, monospace" font-size="15" fill="#1F2733">    except Exception as exc:</text>
    <text x="644" y="352" font-family="Consolas, Courier New, monospace" font-size="15" fill="#93A1B0">        logger.exception("面试 %s 评估失败", interview_id)</text>
    <text x="644" y="367" font-family="Consolas, Courier New, monospace" font-size="15" fill="#1F2733">        db.rollback()</text>
    <text x="644" y="382" font-family="Consolas, Courier New, monospace" font-size="15" fill="#1F2733">        _rollback_status(interview_id)</text>
    <text x="644" y="397" font-family="Consolas, Courier New, monospace" font-size="15" fill="#C62828">        publish_terminal(run, "error", _error_payload(exc), RUN_FAILED)</text>
    <text x="644" y="412" font-family="Consolas, Courier New, monospace" font-size="15" fill="#1F2733">    finally:</text>
    <text x="644" y="427" font-family="Consolas, Courier New, monospace" font-size="15" fill="#1F2733">        db.close()</text>
    <text x="644" y="442" font-family="Consolas, Courier New, monospace" font-size="15" fill="#1F2733">        _signal_end(run)</text>
    <text x="644" y="457" font-family="Consolas, Courier New, monospace" font-size="15" fill="#1F2733">        _schedule_eviction(run)</text>
    <text x="644" y="487" font-family="Consolas, Courier New, monospace" font-size="15" fill="#93A1B0"># stream.py:114 —— 终结事件与运行状态在同一把锁内写入</text>
    <text x="644" y="502" font-family="Consolas, Courier New, monospace" font-size="15" fill="#F57C00">def publish_terminal(run, name, payload, status) -&gt; None:</text>
  </g>

