    <text x="130" y="186" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="17" font-weight="700" fill="#1F2733">逐题评分</text>
    <path fill="#1565C0" fill-opacity="0.10" d="M442,164 H576 A4,4 0 0 1 580,168 V184 A4,4 0 0 1 576,188 H442 A4,4 0 0 1 438,184 V168 A4,4 0 0 1 442,164 Z" />
