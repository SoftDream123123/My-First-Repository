    <path fill="#2E7D32" fill-opacity="0.10" d="M442,416 H576 A4,4 0 0 1 580,420 V436 A4,4 0 0 1 576,440 H442 A4,4 0 0 1 438,436 V420 A4,4 0 0 1 442,416 Z" />
