    <text x="104" y="240" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="13" fill="#5A6B7D">产出 QuestionScoreResult；按 seq 升序推送</text>
