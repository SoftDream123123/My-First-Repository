<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <defs>
    <linearGradient id="headerRule" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1565C0" />
      <stop offset="100%" stop-color="#1565C0" stop-opacity="0" />
    </linearGradient>
  </defs>

  <g id="bg-base">
    <rect width="1280" height="720" fill="#FFFFFF" />
  </g>

  <g id="header">
    <text x="64" y="82" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="32" font-weight="700" fill="#1565C0">模块⑥ auth：权限守卫与数据隔离</text>
    <text x="1216" y="82" text-anchor="end" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="14" fill="#93A1B0">04 核心模块技术讲解</text>
    <line x1="64" y1="104" x2="1216" y2="104" stroke="url(#headerRule)" stroke-width="3" />
  </g>

  <g id="footer">
    <line x1="64" y1="636" x2="1216" y2="636" stroke="#DCE5EE" stroke-width="1" />
    <text x="64" y="658" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="11" fill="#93A1B0">AI 智能面试助手 · 技术解构</text>
    <text x="1216" y="658" text-anchor="end" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="11" fill="#93A1B0">P31 / 35</text>
  </g>

  <g id="code-block">
    <rect x="64" y="182" width="536" height="318" fill="#F2F6FA" />
    <path d="M 72 148 h 520 a 8 8 0 0 1 8 8 v 26 h -536 v -26 a 8 8 0 0 1 8 -8 Z" fill="#E3EDF9" />
    
  <g transform="translate(80.0, 156.0) scale(0.8333333333333334)" fill="none" stroke="#1565C0" stroke-width="2">
    <path d="M5 4l-2 2l2 2" />
    <path d="M12 4l2 2l-2 2" />
    <path d="M8 8l1 -4" />
    <path d="M17 6a2 2 0 0 1 2 2v10a2 2 0 0 1 -2 2h-10a2 2 0 0 1 -2 -2v-7" />
  </g>
    <text x="108" y="171" font-family="Consolas, Courier New, monospace" font-size="12" fill="#1565C0">backend/app/core/deps.py:53-69</text>
    <path fill="none" stroke="#DCE5EE" stroke-width="1" d="M72,148 H592 A8,8 0 0 1 600,156 V492 A8,8 0 0 1 592,500 H72 A8,8 0 0 1 64,492 V156 A8,8 0 0 1 72,148 Z" />

    <text x="84" y="202" font-family="Consolas, Courier New, monospace" font-size="14" fill="#1F2733">def <tspan fill="#1565C0" font-weight="700">require_roles</tspan>(*roles: str) -&gt; Callable[..., "User"]:</text>
    <text x="84" y="218" font-family="Consolas, Courier New, monospace" font-size="14" fill="#93A1B0">    """依赖工厂：校验当前用户角色在允许集内。</text>
    <text x="84" y="234" font-family="Consolas, Courier New, monospace" font-size="14" fill="#93A1B0">    精确匹配，不做层级包含 —— 不存在「admin 包含 hr」。</text>
    <text x="84" y="250" font-family="Consolas, Courier New, monospace" font-size="14" fill="#93A1B0">    显式列出是最容易评审的形式：新增角色时不会有意外的放行。"""</text>
    <text x="84" y="266" font-family="Consolas, Courier New, monospace" font-size="14" fill="#1F2733">    allowed = frozenset(roles)</text>
    <text x="84" y="286" font-family="Consolas, Courier New, monospace" font-size="14" fill="#1F2733">    def _dependency(user: "User" = Depends(get_current_user)):</text>
    <text x="84" y="302" font-family="Consolas, Courier New, monospace" font-size="14" fill="#C62828">        if user.role not in allowed:</text>
    <text x="84" y="318" font-family="Consolas, Courier New, monospace" font-size="14" fill="#C62828">            raise ForbiddenError()          # 403，不是 400</text>
    <text x="84" y="334" font-family="Consolas, Courier New, monospace" font-size="14" fill="#1F2733">        return user</text>

    <text x="84" y="362" font-family="Consolas, Courier New, monospace" font-size="14" fill="#93A1B0">    return _dependency</text>
    <text x="84" y="382" font-family="Consolas, Courier New, monospace" font-size="14" fill="#93A1B0"># 用法：HR 侧路由必须显式写出两个角色</text>
    <text x="84" y="398" font-family="Consolas, Courier New, monospace" font-size="14" fill="#1F2733">require_roles("admin", "hr")     # HR 侧</text>
    <text x="84" y="414" font-family="Consolas, Courier New, monospace" font-size="14" fill="#1F2733">require_roles("candidate")       # 候选人侧</text>

    <text x="84" y="442" font-family="Consolas, Courier New, monospace" font-size="14" fill="#93A1B0"># JWT 载荷不放角色：每次请求从库里回读，改角色 /</text>
    <text x="84" y="458" font-family="Consolas, Courier New, monospace" font-size="14" fill="#93A1B0"># 禁用账号立即生效，不必等 token 过期。</text>
  </g>

  <g id="isolation-paths">
    <text x="624" y="168" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="14" font-weight="700" fill="#1565C0">三条数据隔离路径</text>
    <line x1="794" y1="162" x2="1216" y2="162" stroke="#DCE5EE" stroke-width="1" />

    <path fill="#F2F6FA" d="M632,180 H1208 A8,8 0 0 1 1216,188 V262 A8,8 0 0 1 1208,270 H632 A8,8 0 0 1 624,262 V188 A8,8 0 0 1 632,180 Z" />
    
  <g transform="translate(644.0, 196.0) scale(0.9166666666666666)" fill="none" stroke="#5A6B7D" stroke-width="2">
    <path d="M6 21v-2a4 4 0 0 1 4 -4h2" />
    <path d="M22 16c0 4 -2.5 6 -3.5 6s-3.5 -2 -3.5 -6c1 0 2.5 -.5 3.5 -1.5c1 1 2.5 1.5 3.5 1.5" />
    <path d="M8 7a4 4 0 1 0 8 0a4 4 0 0 0 -8 0" />
  </g>
    <text x="676" y="213" font-family="Consolas, Courier New, monospace" font-size="15" font-weight="700" fill="#1F2733">admin</text>
    <text x="736" y="213" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="13" fill="#5A6B7D">返回 None，不过滤</text>
    <text x="644" y="242" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="12" fill="#1F2733">归属判据为空 —— 系统管理员可以看到全部资源，</text>
    <text x="644" y="260" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="12" fill="#5A6B7D">查询层收到 None 就跳过 where 条件。</text>

    <path fill="#F2F6FA" d="M632,280 H1208 A8,8 0 0 1 1216,288 V362 A8,8 0 0 1 1208,370 H632 A8,8 0 0 1 624,362 V288 A8,8 0 0 1 632,280 Z" />
    
  <g transform="translate(644.0, 296.0) scale(0.9166666666666666)" fill="none" stroke="#1565C0" stroke-width="2">
    <path d="M3 9a2 2 0 0 1 2 -2h14a2 2 0 0 1 2 2v9a2 2 0 0 1 -2 2h-14a2 2 0 0 1 -2 -2l0 -9" />
    <path d="M8 7v-2a2 2 0 0 1 2 -2h4a2 2 0 0 1 2 2v2" />
    <path d="M12 12l0 .01" />
    <path d="M3 13a20 20 0 0 0 18 0" />
  </g>
    <text x="676" y="313" font-family="Consolas, Courier New, monospace" font-size="15" font-weight="700" fill="#1565C0">hr</text>
    <text x="724" y="313" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="13" fill="#5A6B7D">按 created_by 过滤</text>
    <text x="644" y="342" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="12" fill="#1F2733">只看自己建的岗位与面试。这条判据对 HR 成立，</text>
    <text x="644" y="360" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="12" fill="#5A6B7D">但下一张卡片会说明：它对候选人完全不成立。</text>

    <path fill="#F2F6FA" d="M632,380 H1208 A8,8 0 0 1 1216,388 V492 A8,8 0 0 1 1208,500 H632 A8,8 0 0 1 624,492 V388 A8,8 0 0 1 632,380 Z" />
    
  <g transform="translate(644.0, 396.0) scale(0.9166666666666666)" fill="none" stroke="#00897B" stroke-width="2">
    <path d="M8 7a4 4 0 1 0 8 0a4 4 0 0 0 -8 0" />
    <path d="M6 21v-2a4 4 0 0 1 4 -4h4" />
    <path d="M15 19l2 2l4 -4" />
  </g>
    <text x="676" y="413" font-family="Consolas, Courier New, monospace" font-size="15" font-weight="700" fill="#00897B">candidate</text>
    <text x="766" y="413" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="13" fill="#5A6B7D">resource 归属 + 有效邀请</text>
    <text x="644" y="442" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="12" fill="#1F2733">练习与简历按资源归属（owner）；面试则按「<tspan font-weight="700" fill="#00897B">持有该面试的</tspan></text>
    <text x="644" y="460" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="12" fill="#1F2733"><tspan font-weight="700" fill="#00897B">有效邀请</tspan>」判定，走 <tspan font-family="Consolas, Courier New, monospace" fill="#00897B">get_interview_for_candidate</tspan>。</text>
    <text x="644" y="482" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="12" fill="#5A6B7D">不引入新机制，直接复用既有的邀请链。</text>

    <path fill="#E3EDF9" d="M632,512 H1208 A8,8 0 0 1 1216,520 V616 A8,8 0 0 1 1208,624 H632 A8,8 0 0 1 624,616 V520 A8,8 0 0 1 632,512 Z" />
    
  <g transform="translate(644.0, 530.0) scale(0.9166666666666666)" fill="none" stroke="#1565C0" stroke-width="2">
    <path d="M11.46 20.846a12 12 0 0 1 -7.96 -14.846a12 12 0 0 0 8.5 -3a12 12 0 0 0 8.5 3a12 12 0 0 1 -.09 7.06" />
    <path d="M15 19l2 2l4 -4" />
  </g>
    <text x="676" y="547" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="14" font-weight="700" fill="#1565C0">结论：集合精确匹配，无继承</text>
    <text x="644" y="574" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="12" fill="#1F2733">HR 侧必须显式写 <tspan font-family="Consolas, Courier New, monospace" fill="#1565C0">require_roles("admin", "hr")</tspan>；</text>
    <text x="644" y="594" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="12" fill="#1F2733">admin 不能调候选人端接口，candidate 不能调 HR 端接口，</text>
    <text x="644" y="614" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="12" fill="#5A6B7D">两个方向都返回 403。守卫先于请求体校验：body 为空也先 403。</text>
  </g>
</svg>