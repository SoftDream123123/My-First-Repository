    <path d="M12 17v-6" />
    <path d="M9.5 14.5l2.5 2.5l2.5 -2.5" />
  </g>
    <text x="112" y="552" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="14" font-weight="700" fill="#1565C0">不落库、不落盘</text>
    <text x="84" y="578" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="12" fill="#1F2733">不建简历、不改简历，服务器上不留那</text>
    <text x="84" y="600" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="12" fill="#1F2733">个文件，也不存解析产物 —— 简历表</text>
    <text x="84" y="618" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="12" fill="#5A6B7D">结构因此完全不变。</text>
  </g>

