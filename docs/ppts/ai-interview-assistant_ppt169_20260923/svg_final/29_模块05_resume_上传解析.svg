    <text x="1216" y="658" text-anchor="end" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="11" fill="#93A1B0">P29 / 35</text>
  </g>

  <g id="code-block">
    <rect x="64" y="182" width="536" height="318" fill="#F2F6FA" />
    <path d="M 72 148 h 520 a 8 8 0 0 1 8 8 v 26 h -536 v -26 a 8 8 0 0 1 8 -8 Z" fill="#E3EDF9" />
    
  <g transform="translate(80.0, 156.0) scale(0.8333333333333334)" fill="none" stroke="#1565C0" stroke-width="2">
    <path d="M5 4l-2 2l2 2" />
    <path d="M12 4l2 2l-2 2" />
    <path d="M8 8l1 -4" />
    <path d="M17 6a2 2 0 0 1 2 2v10a2 2 0 0 1 -2 2h-10a2 2 0 0 1 -2 -2v-7" />
  </g>
    <text x="108" y="171" font-family="Consolas, Courier New, monospace" font-size="12" fill="#1565C0">backend/app/resume/parser.py:31 · 53-67</text>
    <path fill="none" stroke="#DCE5EE" stroke-width="1" d="M72,148 H592 A8,8 0 0 1 600,156 V492 A8,8 0 0 1 592,500 H72 A8,8 0 0 1 64,492 V156 A8,8 0 0 1 72,148 Z" />

    <text x="84" y="202" font-family="Consolas, Courier New, monospace" font-size="14" fill="#1F2733">_MAGIC = {".pdf": b"%PDF-", ".docx": b"PK\x03\x04"}</text>
    <text x="84" y="222" font-family="Consolas, Courier New, monospace" font-size="14" fill="#1F2733">def <tspan fill="#1565C0" font-weight="700">parse_resume_file</tspan>(data: bytes, filename: str | None) -&gt; str:</text>
    <text x="84" y="238" font-family="Consolas, Courier New, monospace" font-size="14" fill="#93A1B0">    """失败抛 ValidationError（400）—— 不新增状态码。"""</text>
    <text x="84" y="258" font-family="Consolas, Courier New, monospace" font-size="14" fill="#1F2733">    extension = _extension_of(filename)</text>
    <text x="84" y="274" font-family="Consolas, Courier New, monospace" font-size="14" fill="#1565C0">    if extension not in SUPPORTED_EXTENSIONS:   # ① 扩展名白名单</text>
    <text x="84" y="290" font-family="Consolas, Courier New, monospace" font-size="14" fill="#1F2733">        raise ValidationError(_TYPE_MESSAGE)</text>
    <text x="84" y="310" font-family="Consolas, Courier New, monospace" font-size="14" fill="#93A1B0">    # 扩展名由客户端提供，改个名字就能绕过</text>
    <text x="84" y="326" font-family="Consolas, Courier New, monospace" font-size="14" fill="#1565C0">    if not data.startswith(_MAGIC[extension]):  # ② 文件头魔数复核</text>
    <text x="84" y="342" font-family="Consolas, Courier New, monospace" font-size="14" fill="#1F2733">        raise ValidationError(_TYPE_MESSAGE)</text>
    <text x="84" y="362" font-family="Consolas, Courier New, monospace" font-size="14" fill="#1F2733">    text = (_parse_docx(data) if extension == ".docx"</text>
    <text x="84" y="378" font-family="Consolas, Courier New, monospace" font-size="14" fill="#1565C0">            else _parse_pdf(data))                # ③ 解析</text>
    <text x="84" y="398" font-family="Consolas, Courier New, monospace" font-size="14" fill="#1F2733">    normalized = _normalize(text)               # ④ 归一化</text>
    <text x="84" y="414" font-family="Consolas, Courier New, monospace" font-size="14" fill="#1F2733">    if not normalized:                          # 非空校验</text>
    <text x="84" y="430" font-family="Consolas, Courier New, monospace" font-size="14" fill="#1F2733">        raise ValidationError(_NO_TEXT_MESSAGE)</text>
    <text x="84" y="446" font-family="Consolas, Courier New, monospace" font-size="14" fill="#1F2733">    return normalized</text>
    <text x="84" y="474" font-family="Consolas, Courier New, monospace" font-size="14" fill="#93A1B0"># 本模块不接 session、不落盘、不读配置 —— 纯函数</text>
  </g>

  <g id="flow-steps">
    <path fill="#FFFFFF" stroke="#1565C0" stroke-width="1.5" d="M630,148 H1210 A6,6 0 0 1 1216,154 V192 A6,6 0 0 1 1210,198 H630 A6,6 0 0 1 624,192 V154 A6,6 0 0 1 630,148 Z" />
    <circle cx="652" cy="173" r="13" fill="#1565C0" fill-opacity="0.12" />
    <text x="652" y="178" text-anchor="middle" font-family="Consolas, Courier New, monospace" font-size="12" font-weight="700" fill="#1565C0">1</text>
    <text x="676" y="170" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="14" font-weight="700" fill="#1F2733">上传</text>
    <text x="676" y="188" font-family="Consolas, Courier New, monospace" font-size="11" fill="#5A6B7D">POST /candidate/resumes/parse</text>

    <line x1="652" y1="198" x2="652" y2="208" stroke="#1565C0" stroke-width="1.5" marker-end="url(#arrowBlue)" />

    <path fill="#FFFFFF" stroke="#DCE5EE" stroke-width="1" d="M630,212 H1210 A6,6 0 0 1 1216,218 V256 A6,6 0 0 1 1210,262 H630 A6,6 0 0 1 624,256 V218 A6,6 0 0 1 630,212 Z" />
    <circle cx="652" cy="237" r="13" fill="#1565C0" fill-opacity="0.12" />
    <text x="652" y="242" text-anchor="middle" font-family="Consolas, Courier New, monospace" font-size="12" font-weight="700" fill="#1565C0">2</text>
    <text x="676" y="234" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="14" font-weight="700" fill="#1F2733">四道校验</text>
    <text x="676" y="252" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="11" fill="#5A6B7D">扩展名白名单 → 文件头魔数 → 解析 → 归一化后非空</text>

    <line x1="652" y1="262" x2="652" y2="272" stroke="#1565C0" stroke-width="1.5" marker-end="url(#arrowBlue)" />

    <path fill="#FFFFFF" stroke="#DCE5EE" stroke-width="1" d="M630,276 H1210 A6,6 0 0 1 1216,282 V320 A6,6 0 0 1 1210,326 H630 A6,6 0 0 1 624,320 V282 A6,6 0 0 1 630,276 Z" />
    <circle cx="652" cy="301" r="13" fill="#1565C0" fill-opacity="0.12" />
    <text x="652" y="306" text-anchor="middle" font-family="Consolas, Courier New, monospace" font-size="12" font-weight="700" fill="#1565C0">3</text>
    <text x="676" y="298" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="14" font-weight="700" fill="#1F2733">解析</text>
    <text x="676" y="316" font-family="Consolas, Courier New, monospace" font-size="11" fill="#5A6B7D">DOCX → python-docx　·　PDF → pypdf</text>

    <line x1="652" y1="326" x2="652" y2="336" stroke="#1565C0" stroke-width="1.5" marker-end="url(#arrowBlue)" />

    <path fill="#FFFFFF" stroke="#DCE5EE" stroke-width="1" d="M630,340 H1210 A6,6 0 0 1 1216,346 V384 A6,6 0 0 1 1210,390 H630 A6,6 0 0 1 624,384 V346 A6,6 0 0 1 630,340 Z" />
    <circle cx="652" cy="365" r="13" fill="#1565C0" fill-opacity="0.12" />
    <text x="652" y="370" text-anchor="middle" font-family="Consolas, Courier New, monospace" font-size="12" font-weight="700" fill="#1565C0">4</text>
    <text x="676" y="362" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="14" font-weight="700" fill="#1F2733">归一化（只做四件事）</text>
    <text x="676" y="380" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="11" fill="#5A6B7D">统一换行 · 去行尾空白 · 折叠连续空行 · 去首尾空白</text>

    <line x1="652" y1="390" x2="652" y2="400" stroke="#1565C0" stroke-width="1.5" marker-end="url(#arrowBlue)" />

    <path fill="#FFFFFF" stroke="#DCE5EE" stroke-width="1" d="M630,404 H1210 A6,6 0 0 1 1216,410 V448 A6,6 0 0 1 1210,454 H630 A6,6 0 0 1 624,448 V410 A6,6 0 0 1 630,404 Z" />
    <circle cx="652" cy="429" r="13" fill="#F57C00" fill-opacity="0.12" />
    <text x="652" y="434" text-anchor="middle" font-family="Consolas, Courier New, monospace" font-size="12" font-weight="700" fill="#F57C00">5</text>
    <text x="676" y="426" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="14" font-weight="700" fill="#1F2733">回填正文框</text>
    <text x="676" y="444" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="11" fill="#5A6B7D">解析结果填进候选人可见的编辑框，他可自行修改</text>

    <line x1="652" y1="454" x2="652" y2="464" stroke="#1565C0" stroke-width="1.5" marker-end="url(#arrowBlue)" />

    <path fill="#FFFFFF" stroke="#2E7D32" stroke-width="1.5" d="M630,468 H1210 A6,6 0 0 1 1216,474 V512 A6,6 0 0 1 1210,518 H630 A6,6 0 0 1 624,512 V474 A6,6 0 0 1 630,468 Z" />
    <circle cx="652" cy="493" r="13" fill="#2E7D32" fill-opacity="0.12" />
    <text x="652" y="498" text-anchor="middle" font-family="Consolas, Courier New, monospace" font-size="12" font-weight="700" fill="#2E7D32">6</text>
    <text x="676" y="490" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="14" font-weight="700" fill="#1F2733">候选人确认保存</text>
    <text x="676" y="508" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="11" fill="#5A6B7D">另走创建 / 更新端点 —— 与解析这一步完全分开</text>
  </g>

