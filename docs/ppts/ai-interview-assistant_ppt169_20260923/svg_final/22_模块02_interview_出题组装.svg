  <g id="code-block">
    <rect x="64" y="182" width="600" height="442" fill="#F2F6FA" />
    <path d="M 72 148 h 584 a 8 8 0 0 1 8 8 v 26 h -600 v -26 a 8 8 0 0 1 8 -8 Z" fill="#E3EDF9" />
    
  <g transform="translate(80.0, 156.0) scale(0.8333333333333334)" fill="none" stroke="#1565C0" stroke-width="2">
    <path d="M5 4l-2 2l2 2" />
    <path d="M12 4l2 2l-2 2" />
    <path d="M8 8l1 -4" />
    <path d="M17 6a2 2 0 0 1 2 2v10a2 2 0 0 1 -2 2h-10a2 2 0 0 1 -2 -2v-7" />
  </g>
    <text x="108" y="171" font-family="Consolas, Courier New, monospace" font-size="12" fill="#1565C0">backend/app/interview/service.py:217-238 · 266</text>
    <path fill="none" stroke="#DCE5EE" stroke-width="1" d="M72,148 H656 A8,8 0 0 1 664,156 V616 A8,8 0 0 1 656,624 H72 A8,8 0 0 1 64,616 V156 A8,8 0 0 1 72,148 Z" />

    <text x="84" y="196" font-family="Consolas, Courier New, monospace" font-size="14" fill="#1F2733">def <tspan fill="#1565C0" font-weight="700">_round_robin_pick</tspan>(groups: dict[str, list],</text>
    <text x="84" y="213" font-family="Consolas, Courier New, monospace" font-size="14" fill="#1F2733">                      dimensions: list[str], count: int):</text>
    <text x="84" y="230" font-family="Consolas, Courier New, monospace" font-size="14" fill="#5A6B7D">    """按维度轮询抽取，保证各维度题目数尽量平均。</text>
    <text x="84" y="247" font-family="Consolas, Courier New, monospace" font-size="14" fill="#5A6B7D">    组内已按 id 升序 —— 抽取结果完全确定，便于测试断言。"""</text>
    <text x="84" y="264" font-family="Consolas, Courier New, monospace" font-size="14" fill="#1F2733">    cursors = {dim: 0 for dim in dimensions}</text>
    <text x="84" y="281" font-family="Consolas, Courier New, monospace" font-size="14" fill="#1F2733">    picked: list = []</text>
    <text x="84" y="298" font-family="Consolas, Courier New, monospace" font-size="14" fill="#1F2733">    while len(picked) &lt; count:</text>
    <text x="84" y="315" font-family="Consolas, Courier New, monospace" font-size="14" fill="#1F2733">        progressed = False</text>
    <text x="84" y="332" font-family="Consolas, Courier New, monospace" font-size="14" fill="#1F2733">        for dim in dimensions:</text>
    <text x="84" y="349" font-family="Consolas, Courier New, monospace" font-size="14" fill="#1F2733">            if len(picked) &gt;= count:</text>
    <text x="84" y="366" font-family="Consolas, Courier New, monospace" font-size="14" fill="#1F2733">                break</text>
    <text x="84" y="383" font-family="Consolas, Courier New, monospace" font-size="14" fill="#1F2733">            index = cursors[dim]</text>
    <text x="84" y="400" font-family="Consolas, Courier New, monospace" font-size="14" fill="#1F2733">            if index &lt; len(groups[dim]):</text>
    <text x="84" y="417" font-family="Consolas, Courier New, monospace" font-size="14" fill="#1F2733">                picked.append(groups[dim][index])</text>
    <text x="84" y="434" font-family="Consolas, Courier New, monospace" font-size="14" fill="#1F2733">                cursors[dim] = index + 1</text>
    <text x="84" y="451" font-family="Consolas, Courier New, monospace" font-size="14" fill="#1F2733">                progressed = True</text>
    <text x="84" y="468" font-family="Consolas, Courier New, monospace" font-size="14" fill="#93A1B0">        if not progressed:  # 所有维度都已抽空</text>
    <text x="84" y="485" font-family="Consolas, Courier New, monospace" font-size="14" fill="#1F2733">            break</text>
    <text x="84" y="502" font-family="Consolas, Courier New, monospace" font-size="14" fill="#1F2733">    return picked</text>
    <text x="84" y="530" font-family="Consolas, Courier New, monospace" font-size="14" fill="#93A1B0"># service.py:266 —— 差额补足公式，总题数恒为 N + M</text>
    <text x="84" y="547" font-family="Consolas, Courier New, monospace" font-size="14" fill="#F57C00">need_ai = want_from_ai + (want_from_bank - len(picked))</text>
    <text x="84" y="576" font-family="Consolas, Courier New, monospace" font-size="14" fill="#93A1B0"># 防御：AI 返回的维度若不在岗位维度列表内，丢弃该条</text>
    <text x="84" y="593" font-family="Consolas, Courier New, monospace" font-size="14" fill="#93A1B0">generated = [g for g in generated if g.dimension in dimensions]</text>
  </g>

  <g id="point-1">
    <path fill="#F2F6FA" d="M696,148 H1208 A8,8 0 0 1 1216,156 V224 A8,8 0 0 1 1208,232 H696 A8,8 0 0 1 688,224 V156 A8,8 0 0 1 696,148 Z" />
    <text x="706" y="174" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="14" font-weight="700" fill="#1565C0">目标</text>
    <text x="706" y="200" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="13" fill="#1F2733">题库抽 <tspan font-weight="700" fill="#1565C0">N（默认 5）</tspan> + AI 补 <tspan font-weight="700" fill="#1565C0">M（默认 3）</tspan></text>
    <text x="706" y="222" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="13" fill="#5A6B7D">合并成题目列表，并逐题写入内容快照</text>
  </g>

  <g id="point-2">
    <path fill="#F2F6FA" d="M696,245 H1208 A8,8 0 0 1 1216,253 V321 A8,8 0 0 1 1208,329 H696 A8,8 0 0 1 688,321 V253 A8,8 0 0 1 696,245 Z" />
    <text x="706" y="271" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="14" font-weight="700" fill="#00897B">round-robin 抽取</text>
    <text x="706" y="297" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="13" fill="#1F2733">按维度轮询，<tspan font-weight="700" fill="#00897B">组内按 id 升序</tspan></text>
    <text x="706" y="319" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="13" fill="#5A6B7D">保证各维度抽到的题目数尽量平均</text>
  </g>

  <g id="point-3">
    <path fill="#F2F6FA" d="M696,342 H1208 A8,8 0 0 1 1216,350 V418 A8,8 0 0 1 1208,426 H696 A8,8 0 0 1 688,418 V350 A8,8 0 0 1 696,342 Z" />
    <text x="706" y="368" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="14" font-weight="700" fill="#00897B">可预测性是刻意追求的</text>
    <text x="706" y="394" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="13" fill="#1F2733">相同数据状态下，出题结果<tspan font-weight="700" fill="#00897B">完全确定</tspan></text>
    <text x="706" y="416" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="13" fill="#5A6B7D">因此测试可以直接断言抽到哪几题</text>
  </g>

  <g id="point-4">
    <path fill="#F2F6FA" d="M696,439 H1208 A8,8 0 0 1 1216,447 V515 A8,8 0 0 1 1208,523 H696 A8,8 0 0 1 688,515 V447 A8,8 0 0 1 696,439 Z" />
    <text x="706" y="465" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="14" font-weight="700" fill="#F57C00">差额补足公式</text>
    <text x="706" y="491" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="13" fill="#1F2733"><tspan font-family="Consolas, Courier New, monospace" fill="#F57C00">need_ai = M + (N - K)</tspan>，K 为实际抽到的题库题数</text>
    <text x="706" y="513" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="13" fill="#5A6B7D">总题数恒为 N + M = 8，题库不足时由 AI 补足差额</text>
  </g>

  <g id="point-5">
    <path fill="#F2F6FA" d="M696,536 H1208 A8,8 0 0 1 1216,544 V612 A8,8 0 0 1 1208,620 H696 A8,8 0 0 1 688,612 V544 A8,8 0 0 1 696,536 Z" />
    <text x="706" y="562" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="14" font-weight="700" fill="#C62828">事务边界</text>
    <text x="706" y="588" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="13" fill="#1F2733">建面试 + 出题组装 + 置 <tspan font-family="Consolas, Courier New, monospace" fill="#1565C0">ongoing</tspan> 在<tspan font-weight="700" fill="#C62828">同一事务</tspan>内</text>
    <text x="706" y="610" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="13" fill="#5A6B7D">AI 出题失败 → 整体回滚，不留下半成品面试</text>
  </g>
</svg>